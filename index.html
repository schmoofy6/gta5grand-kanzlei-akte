          <div><div class="t">${esc(v.lbl)} <span class="muted mono">${esc(v.ref)}</span></div>
          <div class="s">${esc(v.hint)}</div></div></label>`).join("")}
      <div class="sec-title">Gebührenordnung</div>
      <div class="box info" style="margin-bottom:14px">Höchstsätze, gegen die das Tool jede Position prüft.
      Nach §4 IV RAVO kann die Regierung sie jederzeit anpassen – ändert sich etwas am Server, trägst du es hier ein.</div>
      <div class="tblwrap"><table><thead><tr><th>Leistung</th><th>Einheit</th><th>Fundstelle</th><th style="width:150px">Höchstsatz ($)</th></tr></thead>
        <tbody>${Object.entries(RAVO).map(([k,r])=>`<tr>
          <td>${esc(r.lbl)}</td><td class="muted">${esc(r.unit)}</td><td class="muted mono">${esc(r.ref)}</td>
          <td><input type="number" name="${k}" min="0" step="1000" value="${ravoMaxOf(k)}"></td></tr>`).join("")}
        </tbody></table></div>
      <div class="hint">Standard laut RAVO: ${Object.values(RAVO).map(r=>money(r.max)).join(" · ")}</div>
    </div>
    <div class="modal-f"><button type="submit" class="btn primary">Speichern</button>
      <button type="button" class="btn" data-act="ravoReset">auf Standard zurücksetzen</button>
      <button type="button" class="btn ghost" data-act="close">Abbrechen</button></div></form>`);
  const form=document.getElementById("ravoForm");
  form.addEventListener("click",e=>{
    if(e.target.closest('[data-act="ravoReset"]')){
      e.preventDefault(); DB.settings.ravo={}; DB.settings.strafmass="schwerster";
      save(); closeModal(); render(); toast("Auf Standard zurückgesetzt");
    }
  });
  form.onsubmit=e=>{
    e.preventDefault();
    const f=new FormData(form), s={};
    Object.keys(RAVO).forEach(k=>{ const v=+f.get(k)||0; if(v!==RAVO[k].max) s[k]=v; });
    DB.settings.ravo=s;
    DB.settings.strafmass=f.get("strafmass")||"schwerster";
    save(); closeModal(); render(); toast("Einstellungen gespeichert");
  };
}

const LAW_BUECHER=[...new Set(LAW.map(l=>l.b))];
function lawRecht(){
  const q=(ui.rq||"").toLowerCase(), bf=ui.rb||"";
  const shown=LAW.filter(l=>(!bf||l.b===bf)&&(!q||(l.b+" "+l.p+" "+l.t+" "+l.x).toLowerCase().includes(q)));
  const proBuch=b=>shown.filter(l=>l.b===b);
  return `

    <input type="search" id="rq" placeholder="Stichwort, z. B. Kaution, Frist, Belehrung …" value="${esc(ui.rq||"")}">
    <div class="bookfilter">

      ${LAW_BUECHER.map(b=>'<button data-rbook="'+b+'" class="'+(bf===b?"on":"")+'">'+b+' <span class="muted">'+LAW.filter(l=>l.b===b).length+'</span></button>').join("")}
    </div>
    <span class="hint" style="margin:0">${shown.length} von ${LAW.length} Paragraphen</span>
  </div>
  ${shown.length?LAW_BUECHER.filter(b=>proBuch(b).length).map(b=>`
    <div class="sec-title" style="font-size:13px;color:var(--acc);margin-top:20px">${esc(b)} · ${proBuch(b).length} Paragraphen</div>
    <div class="gesetz">${proBuch(b).map(l=>`<div class="lawcard" id="${esc(b+"-"+l.p.replace(/[^\w]/g,""))}">
      <div class="pz"><span class="pnr">${esc(l.p)}</span> <b>${esc(l.t)}</b>
        <span class="buch">${esc(l.b)}</span></div>
      <div class="lawtext">${absaetze(l.x)}</div></div>`).join("")}</div>`).join("")
  :'<div class="card empty">nichts gefunden</div>'}
  <div class="hint" style="margin-top:16px">Wortlaut der Servergesetze, sortiert nach Gesetzbuch und Paragraph.
  Es steht immer der vollständige Text auf der Seite – such einfach mit Strg+F nach einem Stichwort oder einer Paragraphennummer.</div>`;
}
/* Nummerierte Absätze umbrechen, damit lange Paragraphen lesbar bleiben */
function absaetze(x){
  return esc(x).replace(/\s(?=\d{1,2}\.\s[A-ZÄÖÜ(])/g,"<br>")
               .replace(/\s(?=[a-h]\)\s)/g," <br>&nbsp;&nbsp;");
}

function openModal(html,cls){

  document.getElementById("modalHost").innerHTML="";

};
/* Ein Dialog mit Eingabefeldern geht nur \u00fcber das \u00d7 oder Abbrechen zu -
   ein Klick daneben oder Escape hat schon Eingaben gekostet.                  */
const modalHatFormular=()=>!!document.querySelector(".modal form, .modal input, .modal textarea, .modal select");

const chipHtml=v=>'<span class="chip" data-v="'+esc(v)+'">'+esc(v)+'<button type="button" data-rmtag>×</button></span>';
function tagField(name,label,values,listId,ph,hint){
  return `<label class="f"><span>${label}</span>
    <div class="taginput" data-tags="${name}">${(values||[]).map(chipHtml).join("")}
      <input type="text" list="${listId}" placeholder="${ph}" data-taginput></div>
    ${hint?'<div class="hint">'+hint+'</div>':""}</label>`;
}
function bindTags(root,onChange){
  root.querySelectorAll("[data-tags]").forEach(box=>{
    const inp=box.querySelector("[data-taginput]");
    const add=()=>{
      const v=inp.value.trim(); if(!v) return;
      if(![...box.querySelectorAll(".chip")].some(c=>c.dataset.v.toLowerCase()===v.toLowerCase()))
        inp.insertAdjacentHTML("beforebegin",chipHtml(v));
      inp.value=""; onChange&&onChange();
    };
    inp.addEventListener("keydown",e=>{
      if(e.key==="Enter"||e.key===","){e.preventDefault();add();}
      else if(e.key==="Backspace"&&!inp.value){const ch=box.querySelectorAll(".chip");
        if(ch.length){ch[ch.length-1].remove();onChange&&onChange();}}
    });
    inp.addEventListener("blur",add);
    inp.addEventListener("change",add);
    box.addEventListener("click",e=>{
      if(e.target.matches("[data-rmtag]")){e.target.closest(".chip").remove();onChange&&onChange();}
      else if(e.target===box) inp.focus();
    });
  });
}
const readTags=(root,name)=>[...root.querySelectorAll('[data-tags="'+name+'"] .chip')].map(c=>c.dataset.v);

      ${r.hits.length>1&&r.regel==="schwerster"&&r.top?`<div class="hint">Maßgeblich ist <b>${esc(r.top.b+" "+r.top.p+" "+r.top.t)}</b> als schwerster Tatbestand.
        Aufaddiert wären es ${r.sumStars} ⭐ / ${money(r.sumFine)}, getrennte Höchstwerte ${r.maxStars} ⭐ / ${money(r.maxFine)} – beides nach §3 VII StPO unzulässig.</div>`:""}
      ${r.hits.length>1&&r.regel!=="schwerster"?`<div class="hint">Aufaddiert wären es ${r.sumStars} ⭐ / ${money(r.sumFine)}.</div>`:""}
      <div class="line" style="margin-top:8px">
        ${r.hits.length?(r.bailByStars?'<span class="pill ok">Kaution '+money(r.kaution)+'</span>':'<span class="pill bad">keine Kaution (ab 4 ⭐)</span>'):""}
        ${r.hits.length&&r.bailByStars&&!r.bail?'<span class="pill warn">Katalog: einzelne Delikte ohne Kaution</span>':""}
        ${r.fib?'<span class="pill warn">Übergabe FIB</span>':""}
        ${r.sta?'<span class="pill warn">Übergabe StA</span>':""}
        ${r.owi&&r.hits.length?'<span class="pill neutral">nur Ordnungswidrigkeiten – keine Haft (§3 V StPO)</span>':""}
        ${r.unknown.length?'<span class="pill neutral">'+r.unknown.length+' freie Angabe(n)</span>':""}
      </div>
      ${r.conflicts.length?'<div class="box bad"><b>⚠ Ausschluss bei derselben Tat:</b><br>'+r.conflicts.map(esc).join("<br>")+
        '<br>Diese Paragraphen dürfen nicht nebeneinander angeklagt werden – nach §35 Nr. 6 StPO ist das ein Abhandlungsfehler und begründet den Freispruch.</div>':""}
      ${r.qualifOhneGrundtat?'<div class="box bad"><b>⚠ §22 StGB ohne Grundtat:</b> Ein Qualifikationsdelikt setzt eine aufgeführte Grundtat voraus (§35 Nr. 6 StPO).</div>':""}
      ${r.notes.length?'<div class="box warn">'+r.notes.map(esc).join("<br>")+'</div>':""}`;
  };

  /* Ergebnisknöpfe neu beschriften, wenn die Verfahrensart wechselt */
  const drawOutcome=()=>{
    const proc=form.procedure.value, akt=form.outcome.value;
    form.querySelector("#outcomeSeg").innerHTML=Object.keys(OUTCOMES).map(k=>{
      const o=outcomeInfo(k,proc);
      return '<button type="button" data-v="'+k+'" class="'+(akt===k?"on":"")+'">'+esc(o.lbl)+'</button>';
    }).join("");
    form.querySelector("#outcomeHint").textContent =
      (proc==="revision"||proc==="gericht") ? "Zwischenstand wählen, solange noch entschieden wird." : "";
  };
  const drawStrafe=()=>{
    const box=form.querySelector("#strafeInfo"), s=snapshot(), r=catSum(s.charges);
    const fs=s.final.stars, ff=s.final.fine;
    const zuHoch=r.hits.length&&(fs>r.stars||ff>r.fine);
    box.innerHTML=`
      <div class="calc" style="margin-bottom:0">
        <div class="line"><b>Katalog-Höchstmaß:</b><span class="mono">${r.stars} ⭐ · ${money(r.fine)}</span>
          <span class="muted">|</span><b>verhängt:</b><span class="mono ${zuHoch?"bad-tx":""}">${fs} ⭐ · ${money(ff)}</span></div>
        ${zuHoch?'<div class="box bad"><b>⚠ Strafmaß zu hoch.</b> Nach '+esc(STRAFREGELN[r.regel].ref)+' sind höchstens '+r.stars+' ⭐ und '+money(r.fine)+
          ' zulässig'+(r.top&&r.regel==="schwerster"?' (maßgeblich: '+esc(r.top.b+" "+r.top.p)+')':'')+
          '. Das ist ein Abhandlungsfehler nach §35 Nr. 5/6 StPO – der Mandant ist freizusprechen und freizulassen.</div>':""}
        <div class="box info">
          <b>Kaution (§22 StPO):</b> ${fs>KAUTION_MAX_HE?'nicht möglich – ab 4 Hafteinheiten ausgeschlossen (§22 III)':money(fs*WANTED_WERT*KAUTION_FAKTOR)+' = 200 % der '+fs+' Wanteds, zzgl. Gebühr beim Wärter'}<br>
          <b>Ersatzfreiheitsstrafe (§3 VI):</b> ${ff?ersatzHaft(ff)+" ⭐, falls der Mandant die "+money(ff)+" nicht zahlen kann":"keine Geldstrafe erfasst"}<br>
          <b>Entschädigung bei erfolgreicher Revision (§23 V):</b> ${money(fs*ENTSCHAEDIGUNG_JE_HE+ff+fees.reduce((a,f)=>a+(+f.amount||0),0))}
          <span class="muted">(${fs} ⭐ × ${money(ENTSCHAEDIGUNG_JE_HE)} + Geldstrafe + Anwaltskosten)</span>
        </div>
      </div>`;
  };

  /* Nur noch die Revisionsfrist – die Abhandlungszeit prüft der Nutzer selbst */
  const drawFehler=()=>{
    const vd=form.verdictAt.value, fi=form.querySelector("#fristInfo");
    if(!vd){ fi.innerHTML='<div class="hint">Urteilsdatum eintragen \u2013 die 72-Stunden-Frist wird dann berechnet.</div>'; return; }
    const st=revisionStatus({verdictAt:vd,revision:{filed:form.revFiled.checked}});
    const dl=revisionDeadline({verdictAt:vd});
    fi.innerHTML=`<div class="box ${st.cls==="bad"?"bad":st.cls==="ok"?"ok":"warn"}">${st.lbl}${st.s!=="filed"?" \u2013 Fristende "+dl.toLocaleString("de-DE"):""}</div>`;
  };

  /* Geforderte Strafe folgt den angeklickten Vorwuerfen, solange nichts von Hand eingetragen wurde */
  let demandFest=!!(c&&c.demand&&(c.demand.stars||c.demand.fine));
  const autoDemand=()=>{
    if(demandFest) return;
    const r=catSum(readTags(form,"charges"));
    form.ds.value=r.hits.length?r.stars:"";
    form.df.value=r.hits.length?r.fine:"";
  };

  const drawFees=()=>{
    const box=form.querySelector("#feeList");
    box.innerHTML=fees.length?`<div class="tblwrap"><table>
      <thead><tr><th>Datum</th><th>Leistung</th><th>Umfang</th><th>Betrag</th><th>Höchstsatz</th><th>Status</th><th></th></tr></thead>
      <tbody>${fees.map((f,i)=>{const r=RAVO[f.type]||{lbl:f.type},max=ravoMax(f.type,f.qty),ue=(+f.amount||0)>max;
        return `<tr><td class="mono">${dateDE(f.date)}</td>
          <td>${esc(r.lbl)}${f.desc?'<div class="muted" style="font-size:12px">'+esc(f.desc)+'</div>':""}</td>
          <td class="mono">${r.per?(f.qty||1)+" × "+r.per+" Min.":"Pauschale"}</td>
          <td class="mono ${ue?"bad-tx":""}"><b>${money(f.amount)}</b></td>
          <td class="mono muted">${money(max)}</td>
          <td><button type="button" class="btn sm ${f.paid?"":"danger"}" data-feepaid="${i}">${f.paid?"bezahlt":"offen"}</button></td>
          <td><button type="button" class="btn ghost sm" data-feedel="${i}">✕</button></td></tr>`;}).join("")}
      </tbody><tfoot><tr><td colspan="3" class="muted">Summe</td>
        <td class="mono"><b>${money(fees.reduce((a,f)=>a+(+f.amount||0),0))}</b></td><td colspan="3"></td></tr></tfoot>
      </table></div>${fees.some(f=>(+f.amount||0)>ravoMax(f.type,f.qty))?
        '<div class="box bad">Mindestens eine Position liegt über dem Höchstsatz der RAVO §4 II – solche Vereinbarungen sind unwirksam (§4 III) und können nach §10 RAVO mit bis zu '+money(RAVO_BUSSE_MAX)+' geahndet werden.</div>':""}`
      :'<div class="hint">Noch keine Leistungen erfasst.</div>';
    const dl=c?docFees(c):[];
    form.querySelector("#feeDocs").innerHTML=dl.length?`<div class="calc" style="margin-top:10px">
      <div class="line"><b>Gebühren der Schriftstücke zu diesem Verfahren</b>
        <span class="mono" style="margin-left:auto"><b>${money(summe(dl))}</b></span></div>
      ${dl.map(f=>`<div class="line"><span>${esc(f.desc)}</span>
        <span class="muted mono">${dateDE(f.date)}</span>
        <span class="mono" style="margin-left:auto">${money(f.amount)}${f.paid?"":' <span class="bad-tx">offen</span>'}</span></div>`).join("")}
      <div class="line"><b>Gesamt für dieses Verfahren</b>
        <span class="mono" style="margin-left:auto"><b>${money(fees.reduce((a,f)=>a+(+f.amount||0),0)+summe(dl))}</b></span></div>
      <div class="hint" style="margin:6px 0 0">Diese Posten stammen aus den Schriftstücken und zählen automatisch mit – nicht noch einmal von Hand eintragen.</div>
    </div>`:"";
    const t=form.querySelector("#feeType").value, r=RAVO[t];
    form.querySelector("#feeQtyLbl").textContent=r.per?"Angefangene Einheiten à "+r.per+" Min.":"Anzahl";
    form.querySelector("#feeHint").innerHTML="Höchstsatz: <b>"+money(ravoMax(t,form.querySelector("#feeQty").value))+"</b> ("+r.ref+", "+r.unit+")";
  };

  const refresh=()=>{drawCat();drawCalc();drawStrafe();drawFehler();drawFees();drawOutcome();};
  bindTags(form,()=>{autoDemand();drawCat();drawCalc();drawStrafe();});
  refresh();
  showPane(tab());

  function showPane(t){
    ui.caseTab=t;
    form.querySelectorAll("[data-ctab]").forEach(b=>b.classList.toggle("on",b.dataset.ctab===t));
    form.querySelectorAll("[data-cpane]").forEach(p=>p.hidden=p.dataset.cpane!==t);
  }

  form.querySelector("#catSearch").addEventListener("input",e=>{catQ=e.target.value;drawCat();});
  form.addEventListener("input",e=>{
    if(["ds","df","fs","ff"].includes(e.target.name)) drawStrafe();
    if(e.target.name==="verdictAt") drawFehler();
    if(e.target.name==="ds"||e.target.name==="df") demandFest=true;
    if(e.target.id==="feeQty") drawFees();
  });
  form.addEventListener("change",e=>{
    if(e.target.name==="procedure") drawOutcome();
    if(e.target.name==="revFiled") drawFehler();
    if(e.target.id==="feeType") drawFees();
  });
  form.addEventListener("click",e=>{
    const t=e.target;
    const gl=t.closest("[data-ctab-link]");      if(gl){e.preventDefault();return showPane(gl.dataset.ctabLink);}
    const ct=t.closest("[data-ctab]");           if(ct) return showPane(ct.dataset.ctab);
    const bb=t.closest("[data-catbook]");
    if(bb){form.querySelectorAll("[data-catbook]").forEach(x=>x.classList.toggle("on",x===bb));catBook=bb.dataset.catbook;return drawCat();}
    const row=t.closest("[data-add]");
    if(row){
      const box=form.querySelector('[data-tags="charges"]'), v=row.dataset.add;
      const has=[...box.querySelectorAll(".chip")].find(x=>x.dataset.v===v);
      if(has) has.remove(); else box.querySelector("[data-taginput]").insertAdjacentHTML("beforebegin",chipHtml(v));
      autoDemand();drawCat();drawCalc();drawStrafe();return;
    }
    const fill=t.closest("[data-fill]");
    if(fill){
      const r=catSum(readTags(form,"charges"));
      if(fill.dataset.fill==="demand"){form.ds.value=r.stars;form.df.value=r.fine;demandFest=true;}
      else{form.fs.value=r.stars;form.ff.value=r.fine;}
      drawStrafe();return;
    }
    const seg=t.closest("[data-seg] button[data-v]");
    if(seg){
      form.querySelectorAll("[data-seg] button").forEach(x=>x.classList.toggle("on",x===seg));
      form.outcome.value=seg.dataset.v;
      if(seg.dataset.v==="freed"){form.fs.value=0;form.ff.value=0;drawStrafe();}
      return;
    }
    const act=t.closest("[data-act]");
    if(act&&act.dataset.act==="genRef"){
      form.revRef.value=makeRef("RA",form.clientId.value); return;
    }
    if(act&&act.dataset.act==="feeMax"){
      form.querySelector("#feeAmount").value=ravoMax(form.querySelector("#feeType").value,form.querySelector("#feeQty").value); return;
    }
    if(act&&act.dataset.act==="feeAdd"){
      const type=form.querySelector("#feeType").value, qty=Math.max(1,+form.querySelector("#feeQty").value||1);
      const amount=+form.querySelector("#feeAmount").value||0;
      if(!amount){toast("Bitte einen Betrag eintragen");return;}
      fees.push({id:uid(),type,qty,amount,paid:false,date:form.date.value||today(),desc:form.querySelector("#feeDesc").value.trim()});
      form.querySelector("#feeAmount").value="";form.querySelector("#feeDesc").value="";
      drawFees();drawStrafe();return;
    }
    const fp=t.closest("[data-feepaid]"); if(fp){fees[+fp.dataset.feepaid].paid=!fees[+fp.dataset.feepaid].paid;return drawFees();}
    const fd=t.closest("[data-feedel]"); if(fd){fees.splice(+fd.dataset.feedel,1);drawFees();return drawStrafe();}
  });

  form.onsubmit=e=>{
    e.preventDefault();
    const f=new FormData(form), num=k=>f.get(k)===""||f.get(k)===null?0:Number(f.get(k));
    if(!f.get("clientId")){                       /* das versteckte Feld pruefen sich nicht selbst */
      showPane("fall"); form.querySelector('[data-picker="clientId"] .pin').focus();
      return toast("Bitte eine Mandantschaft wählen");
    }
    const errors=Object.assign({},c&&c.errors);   /* frueher von Hand gesetzte Fehler bleiben erhalten */
    const obj={
      caseNo:(f.get("caseNo")||"").trim()||nextCaseNo(), date:f.get("date"), clientId:f.get("clientId"),
      charges:readTags(form,"charges"), officers:readTags(form,"officers"),
      sta:(f.get("sta")||"").trim(), agency:(f.get("agency")||"").trim(), procedure:f.get("procedure"),
      outcome:f.get("outcome"),
      demand:{stars:num("ds"),fine:num("df")}, final:{stars:num("fs"),fine:num("ff")},
      cuffAt:f.get("cuffAt")||"", endAt:c?.endAt??"", emsPause:c?.emsPause??0,
      belehrungMin:c?.belehrungMin??"", lawyerCalled:!!c?.lawyerCalled,
      errors, verdictAt:f.get("verdictAt")||"",
      revision:{filed:!!f.get("revFiled"),ref:(f.get("revRef")||"").trim(),result:(f.get("revResult")||"").trim()},
      fees, note:(f.get("note")||"").trim()
    };
    if(c) Object.assign(c,obj,{updated:new Date().toISOString()});
    else DB.cases.push({id:uid(),...obj,created:new Date().toISOString()});
    save();closeModal();render();toast(c?"Fall aktualisiert":"Fall gespeichert");
  };
}

/* =============================================================================
   18) Fall ansehen
   ============================================================================= */
function mCaseView(id){
  const c=DB.cases.find(x=>x.id===id); if(!c) return;
  const cl=client(c.clientId), o=outcomeInfo(c.outcome,c.procedure), sv=saved(c), red=reductionPct(c);
  const r=catSum(c.charges), errs=allErrors(c), rv=revisionStatus(c), vj=verjaehrung(c);
  const d=(t,v)=>'<div><div class="dt">'+t+'</div><div class="dd">'+v+'</div></div>';
  const zuHoch=r.hits.length&&((c.final?.stars||0)>r.stars||(c.final?.fine||0)>r.fine);
  openModal(`<div class="modal-h"><h3>${esc(c.caseNo||"Fall")}</h3><span class="pill ${o.cls}">${o.lbl}</span>
      ${Object.keys(errs).length?'<span class="pill bad">§35 StPO · '+Object.keys(errs).length+'</span>':""}
      <button type="button" class="x" data-act="close">×</button></div>
    <div class="modal-b">
      <div class="detail-grid">
        ${d("Mandant",cl?"<b>"+esc(cl.name)+"</b>":"–")}
        ${d("Reisepass",'<span class="mono">'+esc(cl?.pass||"–")+'</span>')}
        ${d("Telefon",'<span class="mono">'+esc(cl?.phone||"–")+'</span>')}
        ${d("Datum",dateDE(c.date))}
        ${d("Verfahren",esc(PROCEDURES[c.procedure]||"–"))}
        ${d("Staatsanwalt",esc(c.sta||"–"))}
        ${d("Behörde",esc(c.agency||"–"))}
        ${d("Honorar",money(feeTotal(c))+(feeOpen(c)?' <span class="pill bad">'+money(feeOpen(c))+' offen</span>':""))}
      </div>
      <div class="dt">Vorwürfe</div>
      <div class="tags" style="margin:4px 0 16px">${(c.charges||[]).map(x=>'<span class="pill tag">'+esc(x)+'</span>').join("")||'<span class="muted">–</span>'}</div>
      <div class="dt">Festnehmende Beamte</div>
      <div class="tags" style="margin:4px 0 16px">${(c.officers||[]).map(x=>'<span class="pill tag">'+esc(x)+'</span>').join("")||'<span class="muted">–</span>'}</div>

      <div class="card" style="background:var(--card2)">
        <div class="detail-grid" style="margin:0">
          ${d("Zulässig (§7 StGB)",'<span class="mono">'+r.stars+' ⭐ · '+money(r.fine)+'</span>')}
          ${d("Gefordert",'<span class="mono">'+(c.demand?.stars||0)+' ⭐ · '+money(c.demand?.fine)+'</span>')}
          ${d("Verhängt",'<span class="mono '+(zuHoch?"bad-tx":"")+'">'+(c.final?.stars||0)+' ⭐ · '+money(c.final?.fine)+'</span>')}
          ${d("Erspart",'<span class="mono ok-tx">'+sv.stars+' ⭐ · '+money(sv.fine)+(red!==null?" ("+red+"%)":"")+'</span>')}
        </div>
        <div class="hint" style="margin-top:10px">
          Kaution nach §22 StPO: ${(c.final?.stars||0)>KAUTION_MAX_HE?"nicht möglich (ab 4 ⭐)":money((c.final?.stars||0)*WANTED_WERT*KAUTION_FAKTOR)} ·
          Ersatzfreiheitsstrafe nach §3 VI StPO: ${ersatzHaft(c.final?.fine)} ⭐ ·
          Entschädigung nach §23 V StPO: ${money(entschaedigung(c))}
        </div>
      </div>

      ${Object.keys(errs).length?`<div class="box bad" style="margin-top:14px">
        <b>⚠ Abhandlungsfehler nach §35 StPO – Freispruch beantragen</b>
        ${Object.entries(errs).map(([k,v])=>{const f=FEHLER.find(x=>x.k===k);
          return '<div style="margin-top:6px">• '+esc(f?f.t:k)+' <span style="opacity:.8">('+esc(f?f.s:"")+')</span>'+(v.txt?'<br><span style="opacity:.9">'+esc(v.txt)+'</span>':"")+'</div>';}).join("")}
        </div>`:""}
      ${r.conflicts.length?'<div class="box bad" style="margin-top:10px"><b>Ausschluss bei derselben Tat:</b><br>'+r.conflicts.map(esc).join("<br>")+'</div>':""}

      <div class="detail-grid" style="margin-top:16px">
        ${d("Handschellen um",c.cuffAt?'<span class="mono">'+esc(c.cuffAt)+' Uhr</span>':'<span class="muted">nicht erfasst</span>')}
        ${d("Revision",rv.lbl?'<span class="'+(rv.cls==="bad"?"bad-tx":rv.cls==="ok"?"ok-tx":"warn-tx")+'">'+esc(rv.lbl)+'</span>'+(c.revision?.ref?'<div class="mono muted" style="font-size:12px">'+esc(c.revision.ref)+'</div>':""):'<span class="muted">–</span>')}
        ${d("Verjährung §19 StPO",vj?(vj.left>0?'in '+vj.left+' Tagen ('+vj.date.toLocaleDateString("de-DE")+')':'<span class="muted">verjährt seit '+vj.date.toLocaleDateString("de-DE")+'</span>'):'–')}
      </div>

      ${(pp=>pp.length?`<div class="dt" style="margin-top:6px">Leistungen nach RAVO §4</div>
        <div class="tblwrap" style="margin-top:5px"><table><thead><tr><th>Datum</th><th>Leistung</th><th>Betrag</th><th>Status</th></tr></thead>
        <tbody>${pp.map(f=>{const rr=RAVO[f.type]||{lbl:f.type};
          return '<tr><td class="mono">'+dateDE(f.date)+'</td><td>'+esc(f.src==="doc"?f.desc:rr.lbl)+(f.src!=="doc"&&f.desc?' <span class="muted">– '+esc(f.desc)+'</span>':"")+
                 (f.src==="doc"?' <span class="pill tag">Schriftstück</span>':"")+
                 '</td><td class="mono">'+money(f.amount)+'</td><td>'+(f.paid?'<span class="pill ok">bezahlt</span>':'<span class="pill bad">offen</span>')+'</td></tr>';}).join("")}
        </tbody><tfoot><tr><td colspan="2" class="muted">Gesamt für dieses Verfahren</td>
        <td class="mono"><b>${money(feeTotal(c))}</b></td>
        <td>${feeOpen(c)?'<span class="pill bad">'+money(feeOpen(c))+' offen</span>':'<span class="pill ok">vollständig bezahlt</span>'}</td></tr></tfoot></table></div>`:"")(caseFees(c))}

      ${docsOfCase(c.id).length?'<div class="sec-title">Schriftsätze zu diesem Verfahren</div>'+docTable(docsOfCase(c.id)):""}
      ${c.note?'<div class="dt" style="margin-top:16px">Notizen</div><div class="dd" style="white-space:pre-wrap">'+esc(c.note)+'</div>':""}
    </div>
    <div class="modal-f"><button class="btn primary" data-act="editCase" data-id="${c.id}">Bearbeiten</button>
      ${cl?'<button class="btn" data-act="openClient" data-id="'+cl.id+'">Mandantenakte</button>':""}
      <button class="btn" data-act="newDocFor" data-id="${c.id}" data-tpl="akte">📂 Akteneinsicht</button>
      <button class="btn" data-act="newRevision" data-id="${c.id}">⚖️ Revisionsantrag</button>
      <button class="btn" data-act="newInvoice" data-id="${c.id}">🧾 Rechnung</button>
      <button class="btn ghost" data-act="close">Schließen</button></div>`);
}


/* =============================================================================
   19) Mandant ansehen
   ============================================================================= */
function mClientView(id){
  const c=client(id); if(!c) return;
  const list=casesOf(id).sort(byDateDesc), s=stats(list);
  openModal(`<div class="modal-h"><h3>${esc(c.name)}</h3><span class="muted mono">${esc(c.pass||"ohne Reisepass")}</span>
      <button type="button" class="x" data-act="close">×</button></div>
    <div class="modal-b">
      <div class="detail-grid">
        <div><div class="dt">Reisepassnummer</div><div class="dd mono">${c.pass?esc(c.pass):'<span class="muted">nicht erfasst</span>'}</div></div>
        <div><div class="dt">Telefon</div><div class="dd mono">${c.phone?esc(c.phone):'<span class="muted" title="RAVO §3 V">nicht erfasst</span>'}</div></div>
        <div><div class="dt">Fälle</div><div class="dd mono">${s.n}</div></div>
        <div><div class="dt">Erfolgsquote</div><div class="dd mono ok-tx">${s.closed?s.rate+"%":"–"}</div></div>
        <div><div class="dt">Erspart</div><div class="dd mono ok-tx">${s.savedS} ⭐ · ${money(s.savedF)}</div></div>
        <div><div class="dt">Honorar</div><div class="dd mono">${money(s.fee+docStats(docsLose(id)).fee)}${(s.open$+docStats(docsLose(id)).offen)?' <span class="bad-tx">('+money(s.open$+docStats(docsLose(id)).offen)+' offen)</span>':""}</div></div>

function mRechner(){
  openModal(`<div class="modal-h"><h3>Strafmaß-Rechner</h3><button type="button" class="x" data-act="close">×</button></div>
    <div class="modal-b">
      <div class="catbox">
        <div class="head"><input type="text" id="rcSearch" placeholder="📖 Delikte suchen und anklicken …">
          <div class="bookfilter"><button type="button" data-rcbook="" class="on">Alle</button>
          ${BOOKS.map(b=>'<button type="button" data-rcbook="'+b+'">'+b+'</button>').join("")}</div></div>
        <div class="list" id="rcList"></div>
      </div>
      <div class="dt">Gewählte Vorwürfe</div>
      <div class="taginput" data-tags="rc" style="margin:5px 0 14px"><input type="text" data-taginput placeholder="oder frei eintippen + Enter"></div>
      <div id="rcOut"></div>
    </div>
    <div class="modal-f"><button class="btn ghost" data-act="close">Schließen</button></div>`);
  const host=document.querySelector(".modal");
  let book="",q="";
  const drawList=()=>{
    const chosen=readTags(host,"rc");
    const l=CATALOG.filter(e=>(!book||e.b===book)&&(!q||(e.p+" "+e.t).toLowerCase().includes(q.toLowerCase())));
    host.querySelector("#rcList").innerHTML=l.map(e=>`<div class="catrow ${chosen.includes(catLabel(e))?"sel":""}" data-rcadd="${esc(catLabel(e))}">
      <div class="p">${esc(e.b)} ${esc(e.p)}</div><div>${esc(e.t)}</div>
      <div class="r">${money(e.fine)}${e.stars?" · "+e.stars+"⭐":""}</div></div>`).join("")||'<div class="empty" style="padding:20px">nichts gefunden</div>';
  };
  const drawOut=()=>{
    const ch=readTags(host,"rc"), r=catSum(ch);
    host.querySelector("#rcOut").innerHTML=!ch.length?'<div class="box info">Delikte auswählen – der Rechner ermittelt Höchststrafe, Kaution und Ersatzfreiheitsstrafe.</div>':`
      <div class="calc">
        <div class="line" style="font-size:15px"><b>Höchstmaß nach ${esc(STRAFREGELN[r.regel].ref)}:</b>
          <span class="mono">${r.stars} ⭐</span><span class="muted">·</span><span class="mono">${money(r.fine)}</span></div>
        ${r.hits.length>1&&r.top&&r.regel==="schwerster"?'<div class="hint">Maßgeblich: <b>'+esc(r.top.b+" "+r.top.p+" "+r.top.t)+'</b>. Summiert wären es '+r.sumStars+' ⭐ / '+money(r.sumFine)+', getrennte Höchstwerte '+r.maxStars+' ⭐ / '+money(r.maxFine)+'.</div>':""}
        <div class="box info">
          <b>Kaution (§22 StPO):</b> ${r.bailByStars?money(r.kaution)+" (200 % von "+r.stars+" Wanteds à "+money(WANTED_WERT)+")":"nicht möglich – ab 4 Hafteinheiten ausgeschlossen"}<br>
          <b>Ersatzfreiheitsstrafe (§3 VI):</b> ${ersatzHaft(r.fine)} ⭐ statt ${money(r.fine)}<br>
          <b>Übergabe:</b> ${r.fib?"FIB":""}${r.fib&&r.sta?" und ":""}${r.sta?"Staatsanwaltschaft":""}${!r.fib&&!r.sta?"nicht erforderlich":""}<br>
          <b>Kaution laut Katalog:</b> ${r.bail?"bei allen gewählten Delikten vorgesehen":"mindestens ein Delikt ohne Kautionsmöglichkeit"}
        </div>
        ${r.conflicts.length?'<div class="box bad"><b>⚠ Ausschluss bei derselben Tat:</b><br>'+r.conflicts.map(esc).join("<br>")+'</div>':""}
        ${r.qualifOhneGrundtat?'<div class="box bad"><b>⚠ §22 StGB ohne Grundtat</b> – Qualifikationsdelikt setzt eine Grundtat voraus.</div>':""}
        ${r.owi?'<div class="box warn">Nur Ordnungswidrigkeiten – nach §3 V StPO ergeben sich daraus keine Hafteinheiten.</div>':""}
      </div>`;
  };
  bindTags(host,()=>{drawList();drawOut();});
  drawList();drawOut();
  host.querySelector("#rcSearch").addEventListener("input",e=>{q=e.target.value;drawList();});
  host.addEventListener("click",e=>{
    const b=e.target.closest("[data-rcbook]");
    if(b){host.querySelectorAll("[data-rcbook]").forEach(x=>x.classList.toggle("on",x===b));book=b.dataset.rcbook;return drawList();}
    const a=e.target.closest("[data-rcadd]");
    if(a){
      const box=host.querySelector('[data-tags="rc"]'), v=a.dataset.rcadd;
      const has=[...box.querySelectorAll(".chip")].find(x=>x.dataset.v===v);
      if(has) has.remove(); else box.querySelector("[data-taginput]").insertAdjacentHTML("beforebegin",chipHtml(v));
      drawList();drawOut();
    }
  });
}

function dokuHtml(){
  const list=dokuListe(), p=me(), kopf=briefkopf();
  const von=dateDE(new Date(Date.now()-DOKU_TAGE*86400000).toISOString().slice(0,10)), bis=dateDE(today());

  const ueber=list.filter(f=>(+f.amount||0)>ravoMax(f.type,f.qty));

    const e=m.get(k)||{n:0,sum:0,phone:(f.client&&f.client.phone)||""};
    e.n++; e.sum+=+f.amount||0; if(!e.phone&&f.client) e.phone=f.client.phone||"";

  const zeile=f=>{
    const r=RAVO[f.type]||{lbl:f.type,ref:"",per:0}, max=ravoMax(f.type,f.qty);

      <td class="num">${money(f.amount)}${zuviel?'<br><span style="color:#a12">über Höchstsatz '+money(max)+'</span>':""}</td>
      <td>${f.paid?"bezahlt":"offen"}</td></tr>`;
  };

  return `<div class="doc">
    ${logoAlsWz()?'<div class="wz"><img src="'+esc(logoBild())+'" alt=""></div>':""}
    <div class="kopfblock">
      ${(kopf.length||logoImKopf())?(logoImKopf()
        ? '<div class="kanzleikopf'+(kopf.length?"":" nurlogo")+'"><img src="'+esc(logoBild())+'" alt="">'+
          (kopf.length?'<div class="kanzlei">'+kopf.map(z=>esc(z)).join("<br>")+'</div>':"")+'</div>'
        : '<div class="kanzlei">'+kopf.map(z=>esc(z)).join("<br>")+'</div>'):""}
      <div class="abs">${esc([p.name,p.pass?"Reisepass-Nr. "+p.pass:"",p.phone?"Tel. "+p.phone:""].filter(Boolean).join(" · "))}</div>
      <h1>Leistungsnachweis</h1>
      <div class="betreff" style="text-align:center;font-weight:400">nach § 3 Abs. 5 der Rechtsanwaltsverordnung</div>
      <div class="nwkopf">
        <div><span>Rechtsanwalt</span>${esc(p.name||"—")}</div>
        <div><span>Zeitraum</span>${von} – ${bis}</div>
        <div><span>Positionen</span>${list.length}</div>
        <div><span>Gesamtbetrag</span>${money(summe)}</div>
        <div><span>davon offen</span>${money(offen)}</div>
        <div><span>Erstellt am</span>${new Date().toLocaleString("de-DE")}</div>
      </div>
    </div>

    ${proMandant.length?`<h2 class="abschnitt">Übersicht nach Mandantschaft</h2>
    <table class="pos nachweis"><thead><tr><th>Mandantschaft</th><th>Telefonnummer</th><th>Positionen</th><th>Betrag</th></tr></thead>
      <tbody>${proMandant.map(([k,e])=>`<tr><td>${esc(k)}</td><td class="num">${esc(e.phone||"—")}</td>
        <td class="num">${e.n}</td><td class="num">${money(e.sum)}</td></tr>`).join("")}</tbody></table>`:""}

    <h2 class="abschnitt">Einzelne Leistungen</h2>
    ${list.length?`<table class="pos nachweis">
      <thead><tr><th>Datum</th><th>Mandantschaft</th><th>Telefon</th><th>Erbrachte Leistung</th><th>Umfang</th><th>Gebühr</th><th>Status</th></tr></thead>
      <tbody>${list.map(zeile).join("")}</tbody>
      <tfoot><tr><td colspan="5">Gesamtbetrag im Zeitraum</td><td class="num"><b>${money(summe)}</b></td><td></td></tr></tfoot>
    </table>`:'<p>Im Nachweiszeitraum wurden keine vergütungspflichtigen Leistungen erbracht.</p>'}

    <div class="nwsumme">
      ${ueber.length
        ? '<b>Hinweis:</b> '+ueber.length+' Position'+(ueber.length>1?"en überschreiten":" überschreitet")+
          ' den Höchstsatz nach § 4 Abs. 2 RAVO.'
        : 'Sämtliche Positionen halten die Höchstsätze nach § 4 Abs. 2 RAVO ein.'}
      Die Aufstellung enthält zu jeder Leistung den Namen und die Telefonnummer der Mandantschaft, die erbrachte

    </div>

    <div class="schluss">
      <p class="gruss">Für die Richtigkeit</p>

  </div>`;

function importJson(){
  const i=document.createElement("input"); i.type="file"; i.accept=".json,application/json";
  i.onchange=()=>{
    const f=i.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(r.result);
        if(!Array.isArray(d.clients)||!Array.isArray(d.cases)) throw 0;
        if(!confirm("Backup einlesen?\n\n"+d.clients.length+" Mandanten, "+d.cases.length+" Fälle.\n\nDie aktuellen Daten ("+DB.clients.length+" / "+DB.cases.length+") werden ersetzt.")) return;
        DB=migrate(Object.assign(structuredClone(blank),d));
        save();render();toast("Backup eingelesen");
      }catch(e){alert("Diese Datei ist kein gültiges Backup.");}
    };
    r.readAsText(f);
  };
  i.click();
}
function copyText(t,msg){
  const done=()=>toast(msg||"In die Zwischenablage kopiert");
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done,()=>fallback());
  else fallback();
  function fallback(){
    const ta=document.createElement("textarea");
    ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{document.execCommand("copy");done();}catch(e){alert(t);}
    ta.remove();
  }
}

document.addEventListener("click",e=>{
  if(!e.target||!e.target.closest) return;
  const nav=e.target.closest("[data-nav]"); if(nav) return go(nav.dataset.nav);
  const bk=e.target.closest("[data-book]");   if(bk){ui.lb=bk.dataset.book;return render();}
  const rb=e.target.closest("[data-rbook]");  if(rb){ui.rb=rb.dataset.rbook;return render();}
  const lt=e.target.closest("[data-lawtab]"); if(lt){ui.lawTab=lt.dataset.lawtab;return render();}
  const ft=e.target.closest("[data-feetab]"); if(ft){ui.feeTab=ft.dataset.feetab;return render();}

  const a=e.target.closest("[data-act]");
  if(a){
    const id=a.dataset.id;
    switch(a.dataset.act){
      case "close": return closeModal();
      case "newClient": return mClient();
      case "editClient": closeModal(); return mClient(id);
      case "pickDoc": return mPickDoc();
      case "editDoc": closeModal(); return mDoc(id);
      case "printDoc": return printDocument(id);
      case "copyDocId": {
        const dd=DB.docs.find(x=>x.id===id);
        if(dd) copyText(docText(dd),"Schriftsatz als Text kopiert");
        return;
      }
      case "delDoc":
        if(confirm("Diesen Schriftsatz löschen?")){
          DB.docs=DB.docs.filter(x=>x.id!==id);save();closeModal();render();toast("Schriftsatz gelöscht");}
        return;
      case "editRavo": return mRavo();
      case "tplList": closeModal(); return mTplList();
      case "editTpl": closeModal(); return mTplEdit(id);
      case "newTpl": closeModal(); return mTplNew();
      case "resetTpl":
        if(confirm("Diese Vorlage auf den Auslieferungszustand zurücksetzen?")){
          delete DB.tpl[id]; save(); closeModal(); render(); mTplList(); toast("Vorlage zurückgesetzt"); }
        return;
      case "delTpl":
        if(confirm("Eigene Vorlage löschen?")){
          delete DB.tpl[id]; save(); closeModal(); render(); mTplList(); toast("Vorlage gelöscht"); }
        return;
      case "saveDocId": {
        const sd=DB.docs.find(x=>x.id===id); if(sd) saveDocFile(sd); return;
      }
      case "taskDone": {
        const t=DB.tasks.find(x=>x.id===id); if(!t) return;
        t.done=!t.done; t.erledigtAm=t.done?new Date().toISOString():"";
        save(); return render();
      }
      case "taskDel": {
        DB.tasks=DB.tasks.filter(x=>x.id!==id); save(); render(); return toast("Aufgabe gel\u00f6scht");
      }
      case "taskFrom": {
        const auf=taskAuto().find(x=>x.k===a.dataset.k); if(!auf) return;
        DB.tasks.push({id:uid(),text:auf.txt,done:false,due:"",created:new Date().toISOString(),
          clientId:auf.ziel.art==="client"?auf.ziel.id:"",caseId:auf.ziel.art==="case"?auf.ziel.id:"",
          docId:auf.ziel.art==="doc"?auf.ziel.id:""});
        save(); render(); return toast("Als eigene Aufgabe \u00fcbernommen");
      }
      case "docRueck": {
        const dr2=DB.docs.find(x=>x.id===id); if(!dr2) return;
        dr2.rueck=dr2.rueck==="offen"?"erledigt":"offen"; save(); render();
        if(document.querySelector(".modal")){ closeModal(); mDocView(dr2.id); }
        return toast(dr2.rueck==="offen"?"Als zu besprechen vermerkt":"Als besprochen vermerkt");
      }
      case "docPaid": {
        const dp=DB.docs.find(x=>x.id===id); if(!dp) return;
        dp.paid=!dp.paid; save(); render();
        if(document.querySelector(".modal")){ closeModal(); mDocView(dp.id); }
        return toast(dp.paid?"Als bezahlt vermerkt":"Wieder als offen vermerkt");
      }
      case "newDocFor": {
        const c=DB.cases.find(x=>x.id===id); if(!c) return;
        closeModal();
        return mDoc(null,a.dataset.tpl,{caseId:c.id,clientId:c.clientId,date:today()});
      }
      case "newRevision": {
        const c=DB.cases.find(x=>x.id===id); if(!c) return;
        closeModal();
        return mDoc(null,"revision",{caseId:c.id,clientId:c.clientId,date:today()});
      }
      case "newInvoice": {
        const c=DB.cases.find(x=>x.id===id); if(!c) return;
        closeModal();
        return mDoc(null,"rechnung",{caseId:c.id,clientId:c.clientId,date:today(),
          posten:caseFees(c).map(f=>({type:f.type,qty:f.qty||1,amount:f.amount,date:f.date,desc:f.desc}))});
      }
      case "openClient": closeModal(); return mClientView(id);
      case "editProfile": return mProfile();
      case "werbung": return mWerbung();
      case "openRechner": return mRechner();
      case "newCase": ui.caseTab="fall"; return DB.clients.length?mCase():(alert("Lege zuerst einen Mandanten an."),mClient());
      case "newCaseFor": closeModal(); ui.caseTab="fall"; return mCase(null,id);
      case "editCase": closeModal(); ui.caseTab="fall"; return mCase(id);
      case "toggleErr": ui.ferr=!ui.ferr; return render();
      case "delClient":
        if(confirm("Mandant und alle "+casesOf(id).length+" zugehörigen Fälle löschen?")){
          DB.clients=DB.clients.filter(c=>c.id!==id); DB.cases=DB.cases.filter(c=>c.clientId!==id);
          save();closeModal();render();toast("Gelöscht");} return;
      case "delCase":
        if(confirm("Diesen Fall löschen?")){DB.cases=DB.cases.filter(c=>c.id!==id);save();closeModal();render();toast("Fall gelöscht");} return;
      case "clearFilter": ui.fq="";ui.fo="";ui.fsta="";ui.fproc="";ui.ferr=false; return render();
      case "exportJson": return dl("kanzlei_backup_"+stamp()+".json",JSON.stringify(DB,null,2),"application/json");
      case "importJson": return importJson();
      case "exportCasesCsv": return exportCasesCsv();
      case "exportClientsCsv": return exportClientsCsv();
      case "exportDoku": return exportDoku();
      case "exportDokuCsv": return exportDokuCsv();
      case "wipe":
        if(confirm("Wirklich ALLES löschen? Vorher exportieren!")&&confirm("Letzte Warnung – alle Mandanten und Fälle werden gelöscht.")){
          DB=structuredClone(blank);save();render();toast("Alles gelöscht");} return;
    }
  }
  /* Wer Text markiert, will nichts anklicken – Zeilen reagieren dann nicht */
  if(istAuswahl(e)) return;
  const nd=e.target.closest("[data-newdoc]");
  if(nd){e.preventDefault();closeModal();return mDoc(null,nd.dataset.newdoc);}
  const tf=e.target.closest("[data-tplfilter]");
  if(tf){ui.atype=tf.dataset.tplfilter;ui.astatus="";ui.aq="";return go("antrag");}
  const dr=e.target.closest("[data-doc]");
  if(dr){e.preventDefault();return mDocView(dr.dataset.doc);}
  const cr=e.target.closest("[data-case]");
  if(cr){e.preventDefault();return mCaseView(cr.dataset.case);}
  const kr=e.target.closest("[data-client]"); if(kr) return mClientView(kr.dataset.client);
});
/* Merkt sich, wo ein Klick begann – zum Unterscheiden von Klick und Markieren */
const zeigerStart={x:0,y:0};
document.addEventListener("mousedown",e=>{
  zeigerStart.x=e.clientX; zeigerStart.y=e.clientY;
},true);
function istAuswahl(e){
  if(e.target.closest("button,a,input,select,textarea,[data-act]")) return false;
  if(Math.abs(e.clientX-zeigerStart.x)>4||Math.abs(e.clientY-zeigerStart.y)>4) return true;
  const s=window.getSelection();
  return !!(s&&!s.isCollapsed&&s.toString().trim());
}
/* Suchfelder: Wert merken, neu rendern, Cursorposition zurücksetzen */
document.addEventListener("input",e=>{
  if(!e.target||!e.target.closest) return;
  const k={cq:"cq",fq:"fq",lq:"lq",rq:"rq",aq:"aq"}[e.target.id];
  if(!k||e.target.closest(".modal")) return;
  ui[k]=e.target.value;
  const pos=e.target.selectionStart, id=e.target.id;
  render();
  const n=document.getElementById(id);
  if(n){n.focus();n.setSelectionRange(pos,pos);}
});
document.addEventListener("change",e=>{
  if(!e.target||!e.target.closest) return;
  if(e.target.closest(".modal")) return;
  if(e.target.id==="cs"){ui.cs=e.target.value;render();}
  if(e.target.id==="fo"){ui.fo=e.target.value;render();}
  if(e.target.id==="fsta"){ui.fsta=e.target.value;render();}
  if(e.target.id==="fproc"){ui.fproc=e.target.value;render();}
  if(e.target.id==="astatus"){ui.astatus=e.target.value;render();}
  if(e.target.id==="atype"){ui.atype=e.target.value;render();}

});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!modalHatFormular()) closeModal();
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="n"&&!e.shiftKey){e.preventDefault();if(DB.clients.length){ui.caseTab="fall";mCase();}}
});
/* Neue Aufgabe anlegen */
document.addEventListener("submit",e=>{
  if(!e.target||e.target.id!=="taskNeu") return;
  e.preventDefault();
  const f=new FormData(e.target), txt=(f.get("text")||"").trim();
  if(!txt) return;
  DB.tasks.push({id:uid(),text:txt,done:false,due:f.get("due")||"",created:new Date().toISOString(),
                 clientId:"",caseId:"",docId:""});
  save(); render();
  const n=document.querySelector("#taskNeu [name=text]"); if(n) n.focus();
});
document.getElementById("themeBtn").onclick=()=>{
  DB.theme=DB.theme==="dark"?"light":"dark";
  document.documentElement.dataset.theme=DB.theme; save();
};
window.addEventListener("beforeunload",save);

/* =============================================================================
   Start
   ============================================================================= */
document.documentElement.dataset.theme=DB.theme||"dark";
render();
setSaveState("💾 in diesem Browser gespeichert","var(--tx3)");
</script>
