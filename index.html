<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanzlei-Akte</title>
<style>
:root{
  --bg:#0d1117; --bg2:#141b24; --card:#161d27; --card2:#1c2530;
  --line:#252f3d; --line2:#334154;
  --tx:#e6edf5; --tx2:#9fb0c4; --tx3:#6b7d92;
  --acc:#4c8dff; --acc-dim:#1e3a63;
  --ok:#2ecc82; --ok-bg:rgba(46,204,130,.13);
  --warn:#f5b544; --warn-bg:rgba(245,181,68,.13);
  --bad:#ff5f6b; --bad-bg:rgba(255,95,107,.13);
  --neutral:#7d8da1; --neutral-bg:rgba(125,141,161,.13);
  --r:12px; --sh:0 4px 20px rgba(0,0,0,.35);
}
html[data-theme="light"]{
  --bg:#f2f5f9; --bg2:#e9eef5; --card:#fff; --card2:#f6f8fb;
  --line:#dde4ee; --line2:#c6d1e0;
  --tx:#111823; --tx2:#4d5c70; --tx3:#7b8a9d;
  --acc:#2f6fe0; --acc-dim:#dbe7ff;
  --ok:#13965a; --ok-bg:rgba(19,150,90,.12);
  --warn:#b57c07; --warn-bg:rgba(181,124,7,.12);
  --bad:#d92c3c; --bad-bg:rgba(217,44,60,.1);
  --neutral:#66768a; --neutral-bg:rgba(102,118,138,.12);
  --sh:0 4px 18px rgba(20,40,80,.08);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}

#app{display:flex;min-height:100vh}
#side{width:232px;flex:0 0 232px;background:var(--bg2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:20}
.brand{padding:18px 18px 13px;border-bottom:1px solid var(--line)}
.brand h1{margin:0;font-size:16px}
.brand span{display:block;font-size:11px;color:var(--tx3);margin-top:3px;letter-spacing:.6px;text-transform:uppercase}
nav{padding:10px;flex:1;overflow:auto}
nav button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:9px 12px;
  border-radius:9px;color:var(--tx2);cursor:pointer;text-align:left;margin-bottom:2px}
nav button:hover{background:var(--card);color:var(--tx)}
nav button.on{background:var(--acc-dim);color:var(--tx)}
nav button .ic{width:18px;text-align:center}
nav button .cnt{margin-left:auto;font-size:11px;color:var(--tx3);background:var(--card2);padding:1px 7px;border-radius:20px}
nav button .cnt.alert{background:var(--bad);color:#fff}
.lawbar{padding:9px 10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--card)}
.lawbar select{font-size:12.5px;padding:6px 9px}
.lawbar .row{display:flex;gap:6px;align-items:center;margin-top:6px}
.lawbar .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--tx3)}
.side-foot{padding:11px;border-top:1px solid var(--line);font-size:11px;color:var(--tx3)}
.side-foot .row{display:flex;align-items:center;gap:8px;justify-content:space-between}
main{flex:1;min-width:0;padding:22px 26px 60px}
header.top{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
header.top h2{margin:0;font-size:22px;font-weight:600}
header.top .sub{color:var(--tx3);font-size:13px}
.spacer{flex:1}

.btn{background:var(--card2);border:1px solid var(--line2);color:var(--tx);padding:8px 14px;border-radius:9px;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:500}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--tx2)}
.btn.ghost:hover{background:var(--card2);color:var(--tx)}
.btn.danger{color:var(--bad)}
.btn.danger:hover{border-color:var(--bad);background:var(--bad-bg)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h3{margin:0 0 14px;font-weight:600;color:var(--tx2);letter-spacing:.3px;text-transform:uppercase;font-size:11.5px}
.grid{display:grid;gap:14px}
.muted{color:var(--tx3)}
.mono{font-variant-numeric:tabular-nums}
.ok-tx{color:var(--ok)} .bad-tx{color:var(--bad)} .warn-tx{color:var(--warn)}

input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{
  width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:8px 11px;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:66px}
label.f{display:block;margin-bottom:12px}
label.f > span{display:block;font-size:12px;color:var(--tx2);margin-bottom:5px}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.f-row.three{grid-template-columns:1fr 1fr 1fr}
.f-row.four{grid-template-columns:1fr 1fr 1fr 1fr}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(163px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px}
.kpi .lbl{font-size:11.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px}
.kpi .val{font-size:26px;font-weight:600;margin-top:6px;line-height:1.1}
.kpi .sub{font-size:12px;color:var(--tx3);margin-top:4px}
.kpi.ok .val{color:var(--ok)} .kpi.warn .val{color:var(--warn)} .kpi.bad .val{color:var(--bad)} .kpi.acc .val{color:var(--acc)}

.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:var(--card2);text-align:left;padding:10px 13px;font-size:11.5px;letter-spacing:.4px;text-transform:uppercase;
  color:var(--tx3);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 13px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--card2)}
tr.click{cursor:pointer}
.empty{padding:40px 20px;text-align:center;color:var(--tx3)}
.empty .big{font-size:34px;opacity:.4;margin-bottom:8px}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:12px;white-space:nowrap;font-weight:500}
button.pill{font-family:inherit;border:0;cursor:pointer}
button.pill:hover{filter:brightness(1.25)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.neutral{background:var(--neutral-bg);color:var(--neutral)}
.pill.tag{background:var(--card2);color:var(--tx2);border:1px solid var(--line2);font-weight:400}
.tags{display:flex;flex-wrap:wrap;gap:5px}

.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search]{max-width:280px}
.toolbar select{width:auto;min-width:130px}

.bars{display:flex;flex-direction:column;gap:11px}
.bar-row{display:grid;grid-template-columns:minmax(90px,1.3fr) 3fr auto;gap:12px;align-items:center;font-size:13px}
.bar-row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:9px;background:var(--card2);border-radius:6px;overflow:hidden;display:flex}
.track i{display:block;height:100%}
.track i.ok{background:var(--ok)} .track i.warn{background:var(--warn)} .track i.bad{background:var(--bad)} .track i.neutral{background:var(--neutral)}
.bar-row .vv{font-size:12px;color:var(--tx3);white-space:nowrap;min-width:52px;text-align:right}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--tx2);margin-top:14px}
.legend b{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:10px}
.chart .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;min-width:14px}
.chart .col .seg{border-radius:2px}
.chart-x{display:flex;gap:6px;margin-top:6px}
.chart-x span{flex:1;text-align:center;font-size:10px;color:var(--tx3);min-width:14px}

.overlay{position:fixed;inset:0;background:rgba(3,6,12,.65);backdrop-filter:blur(3px);z-index:50;
  display:flex;align-items:flex-start;justify-content:center;padding:34px 16px;overflow:auto}
/* Kopf und Fuss stehen fest, nur der Rumpf scrollt - das vermeidet klebende
   Leisten, die beim Scrollen ineinanderlaufen. */
.modal{background:var(--card);border:1px solid var(--line2);border-radius:16px;box-shadow:var(--sh);width:100%;max-width:820px;
  display:flex;flex-direction:column;max-height:calc(100vh - 68px);overflow:hidden}
/* Viele Dialoge sind ein <form> - das muss die Aufteilung mitmachen */
.modal>form{display:flex;flex-direction:column;min-height:0;flex:1 1 auto}
.modal.narrow{max-width:540px}
.modal-h{display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid var(--line);
  background:var(--card);border-radius:16px 16px 0 0;flex:0 0 auto}
.modal-h h3{margin:0;font-size:16px;text-transform:none;letter-spacing:0;color:var(--tx)}
.modal-b{padding:20px;overflow:auto;flex:1 1 auto;min-height:0}
.modal-f{display:flex;gap:10px;padding:13px 20px;border-top:1px solid var(--line);background:var(--card2);
  border-radius:0 0 16px 16px;flex-wrap:wrap;flex:0 0 auto}
/* Solange ein Dialog offen ist, ruht die Seite dahinter */
html.modal-offen,html.modal-offen body{overflow:hidden}
.x{margin-left:auto;background:none;border:0;color:var(--tx3);font-size:20px;cursor:pointer;line-height:1;padding:2px 6px}
.x:hover{color:var(--tx)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px 0 16px;flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 13px;color:var(--tx3);cursor:pointer;font-size:13.5px}
.tabs button:hover{color:var(--tx)}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}

.taginput{background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:5px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.taginput:focus-within{border-color:var(--acc)}
.taginput input{border:0!important;background:none!important;flex:1;min-width:140px;padding:4px 6px!important}
.taginput .chip{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line2);
  border-radius:20px;padding:2px 4px 2px 10px;font-size:12.5px}
.taginput .chip button{background:none;border:0;color:var(--tx3);cursor:pointer;padding:0 4px;font-size:14px;line-height:1}
.taginput .chip button:hover{color:var(--bad)}
.hint{font-size:11.5px;color:var(--tx3);margin-top:4px}

.seg-ctl{display:flex;gap:6px;flex-wrap:wrap}
.seg-ctl button{flex:1;min-width:110px;background:var(--bg);border:1px solid var(--line2);padding:9px;border-radius:9px;cursor:pointer;color:var(--tx2);font-size:13px}
.seg-ctl button.on{color:#fff;font-weight:500}
.seg-ctl button[data-v=freed].on{background:var(--ok);border-color:var(--ok)}
.seg-ctl button[data-v=reduced].on{background:var(--warn);border-color:var(--warn);color:#20160a}
.seg-ctl button[data-v=none].on{background:var(--bad);border-color:var(--bad)}
.seg-ctl button[data-v=pending].on{background:var(--warn);border-color:var(--warn);color:#20160a}
.seg-ctl button[data-v=open].on{background:var(--neutral);border-color:var(--neutral)}
.seg-ctl.plain button.on{background:var(--acc);border-color:var(--acc)}

.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:14px;margin-bottom:16px}
.dt{font-size:11.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.dd{font-size:14px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--line2);
  padding:11px 18px;border-radius:10px;box-shadow:var(--sh);z-index:99;font-size:13.5px}
.sec-title{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--tx3);margin:22px 0 10px;font-weight:600}

.catbox{border:1px solid var(--line2);border-radius:10px;overflow:hidden;margin-bottom:12px}
.catbox .head{display:flex;gap:8px;padding:8px;background:var(--card2);flex-wrap:wrap;align-items:center}
.catbox .head input{flex:1;min-width:150px}
.catbox .list{max-height:210px;overflow:auto}
.catrow{display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:center;padding:7px 11px;
  border-top:1px solid var(--line);cursor:pointer;font-size:13px}
.catrow:hover{background:var(--acc-dim)}
.catrow.sel{opacity:.45}
.catrow .p{font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums}
.catrow .r{font-size:12px;color:var(--tx2);white-space:nowrap;font-variant-numeric:tabular-nums}
.bookfilter{display:flex;gap:5px;flex-wrap:wrap}
.bookfilter button{background:var(--bg);border:1px solid var(--line2);border-radius:7px;padding:5px 10px;font-size:12.5px;cursor:pointer;color:var(--tx2)}
.bookfilter button.on{background:var(--acc);border-color:var(--acc);color:#fff}

.calc{background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:13px}
.calc .line{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.box{border-radius:9px;padding:9px 12px;margin-top:9px;font-size:12.5px;line-height:1.5}
.box.bad{background:var(--bad-bg);border:1px solid var(--bad);color:var(--bad)}
.box.warn{background:var(--warn-bg);border:1px solid var(--warn);color:var(--warn)}
.box.ok{background:var(--ok-bg);border:1px solid var(--ok);color:var(--ok)}
.box.info{background:var(--card);border:1px solid var(--line2);color:var(--tx2)}
.stars{color:var(--warn);letter-spacing:1px}

.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line2);border-radius:9px;margin-bottom:7px;cursor:pointer}
.chk:hover{border-color:var(--acc)}
.chk input{margin:2px 0 0;width:16px;height:16px;flex:0 0 16px;accent-color:var(--bad)}
.chk .t{font-size:13px}
.chk .s{font-size:11.5px;color:var(--tx3);margin-top:2px}
.chk.on{border-color:var(--bad);background:var(--bad-bg)}
.chk.auto{border-color:var(--warn)}

.lawtext{font-size:13.5px;line-height:1.65}
.lawtext h4{margin:18px 0 6px;font-size:14px;color:var(--acc)}
.lawtext p{margin:0 0 8px}
.lawcard{border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:10px;background:var(--card)}
.lawcard .p{font-size:12px;color:var(--tx3);margin-bottom:3px;letter-spacing:.3px}
.lawcard b{display:block;margin-bottom:5px}
.gesetz{display:flex;flex-direction:column;gap:8px}
.phase{margin-bottom:18px}
.phase-h{font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--acc);font-weight:600;
  margin:0 0 9px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.tplcard{display:flex;flex-direction:column}
.tplcard .tags{margin-top:auto}
.lawcard .pz{display:flex;gap:9px;align-items:baseline;margin-bottom:6px;flex-wrap:wrap}
.lawcard .pz b{display:inline;margin:0;font-size:14px}
.lawcard .pnr{font-variant-numeric:tabular-nums;font-weight:700;color:var(--acc);min-width:46px}
.lawcard .buch{margin-left:auto;font-size:11px;color:var(--tx3);letter-spacing:.5px}

/* ---------- Druckdokument (Anträge) ---------- */
#printDoc{display:none}
.doc{background:#fff;color:#12181f;padding:26mm 22mm;font:12.5pt/1.6 "Times New Roman",Georgia,serif;max-width:210mm;margin:0 auto}
.doc h1{font-size:16pt;text-align:center;letter-spacing:.06em;text-transform:uppercase;margin:0 0 4mm;font-weight:700}
.doc .kanzlei{text-align:center;font-size:10pt;letter-spacing:.09em;text-transform:uppercase;color:#3c4756;
  border-bottom:1.5pt solid #12181f;padding-bottom:3mm;margin-bottom:8mm}
/* Kanzleilogo: klein neben dem Briefkopf, optional blass hinter dem Text */
.doc .kanzleikopf{display:flex;align-items:center;justify-content:center;gap:5mm;
  border-bottom:1.5pt solid #12181f;padding-bottom:3mm;margin-bottom:8mm}
.doc .kanzleikopf .kanzlei{border:0;padding:0;margin:0;text-align:left}
.doc .kanzleikopf img{height:16mm;width:auto;flex:0 0 auto;object-fit:contain}
.doc .kanzleikopf.nurlogo{justify-content:center}
.doc .wz{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  pointer-events:none;z-index:0}
.doc .wz img{width:120mm;max-width:70%;opacity:.055}
.doc{position:relative}
.doc .kopfblock,.doc p,.doc h2,.doc table,.doc .schluss,.doc .fuss,.doc ol,.doc ul{position:relative;z-index:1}
/* Suchbare Auswahl: Textfeld mit Trefferliste darunter */
.picker{position:relative}
.picker .pclear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;
  color:var(--tx3);cursor:pointer;font-size:15px;padding:4px;line-height:1}
.picker .pclear:hover{color:var(--tx)}
.plist{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:70;max-height:238px;overflow:auto;
  background:var(--card);border:1px solid var(--line2);border-radius:11px;box-shadow:var(--sh)}
.prow{padding:8px 11px;cursor:pointer;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .pt{font-size:13.5px}
.prow .ps{font-size:12px;color:var(--tx2);margin-top:1px}
.prow.on,.prow:hover{background:var(--card2)}
.plist .empty{padding:12px;font-size:13px}
.videobox{position:relative;padding-top:56.25%;border-radius:11px;overflow:hidden;background:#000;border:1px solid var(--line2)}
.videobox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.task{display:flex;gap:11px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:11px 13px;margin-bottom:7px}
.task .tbody{flex:1;min-width:0}
.task .tt{font-size:13.5px}
.task .ts{font-size:12px;color:var(--tx3);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.task.done{opacity:.5}
.task.done .tt{text-decoration:line-through}
.task.auto{background:var(--card2)}
.tcheck{flex:0 0 20px;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line2);
  background:var(--bg);cursor:pointer;color:#fff;font-size:12px;line-height:1;padding:0}
.tcheck:hover{border-color:var(--acc)}
.tcheck.on{background:var(--ok);border-color:var(--ok)}
.tdot{flex:0 0 9px;width:9px;height:9px;border-radius:50%;margin-top:6px}
.tdot.bad{background:var(--bad)} .tdot.neutral{background:var(--neutral)}
.werbe{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.werbe textarea{flex:1;min-height:52px;resize:vertical}
.werbe .row{flex:0 0 auto;flex-direction:column;gap:5px}
.doc .fusslogo{height:7mm;width:auto;vertical-align:-2mm;margin-right:2mm;opacity:.8}
/* Steckbrief des Verfahrens: schmale Beschriftungsspalte, keine Kopfzeile */
/* Leistungsnachweis: viele Zeilen, deshalb enger gesetzt */
.doc table.nachweis{font-size:9.5pt}
.doc table.nachweis td,.doc table.nachweis th{padding:1.6mm 2mm}
.doc table.nachweis .num{text-align:right;white-space:nowrap}
.doc table.nachweis tbody tr:nth-child(even){background:#f4f6f9}
.doc .nwkopf{display:flex;gap:8mm;flex-wrap:wrap;margin:0 0 6mm;font-size:10.5pt}
.doc .nwkopf div span{display:block;font-size:9pt;color:#5a6879;letter-spacing:.04em;text-transform:uppercase}
.doc .nwsumme{margin-top:5mm;border-top:1pt solid #12181f;padding-top:3mm;font-size:11pt}
.doc table.vorgang td:first-child{width:52mm;color:#3c4756}
.doc table.vorgang td{vertical-align:top}
.doc table.vorgang td.r,.doc table.vorgang td:last-child{text-align:left}
.doc .abs{font-size:9pt;color:#5a6879;border-bottom:.4pt solid #c3ccd8;padding-bottom:1.5mm;margin-bottom:6mm}
.doc .head2{display:flex;gap:10mm;margin-bottom:9mm}
.doc .empf{flex:1;font-size:12pt;line-height:1.5}
.doc .meta{text-align:right;font-size:11pt;white-space:nowrap}

@media print{
  /* Ränder gehören an die Seite, nicht an das Dokument – sonst hat nur die
     erste Seite oben Rand und der Text der Folgeseiten klebt am Blattrand. */
  @page{size:A4;margin:20mm 18mm}
  #app,#modalHost,#toastHost{display:none!important}
  #printDoc{display:block!important}
  html,body{background:#fff!important;margin:0;padding:0}
  .doc{max-width:none;box-shadow:none;padding:0;margin:0;font-size:11.5pt}

  /* Einzelne Zeilen nicht allein über den Seitenwechsel schicken */
  .doc p,.doc li{orphans:3;widows:3}
  /* Zusammengehöriges nicht zerreißen */
  .doc .kopfblock,.doc .kopfdaten,.doc .oath,.doc .schluss,.doc .sign,.doc .sig,
  .doc table.pos,.doc li,.doc .fuss{break-inside:avoid;page-break-inside:avoid}
  /* Überschriften und Anreden hängen am folgenden Text */
  .doc h2,.doc h2.abschnitt,.doc .betreff,.doc .anrede,.doc .gruss{break-after:avoid;page-break-after:avoid}
  .doc .sign,.doc .fuss{break-before:avoid;page-break-before:avoid}
  /* Tabellenkopf auf jeder Seite wiederholen */
  .doc table.pos thead{display:table-header-group}
  /* Logo und Wasserzeichen muessen beim Druck erhalten bleiben */
  .doc img,.doc .wz img{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .doc .wz{position:fixed;inset:0}
  .doc table.pos tfoot{display:table-row-group}
  .doc .abschnitt{margin-top:6mm}
  a[href]:after{content:""}
}

/* Ausschluss-Paragraphen einer Katalogzeile auflösen */
function exRefs(entry){
  const s=entry.ex||"";
  if(!s||/^Alle/i.test(s)) return [];
  const bm=/(StGB|WaffG|BtMG|StVO)\s*$/.exec(s);
  const book=bm?bm[1]:entry.b;
  const out=[];
  s.replace(/(StGB|WaffG|BtMG|StVO)/g,"").split(",").forEach(part=>{
    const m=/(\d+(?:\.\d+)?[a-z]?)/.exec(part.trim());
    if(m) out.push({book,num:"§"+m[1]});
  });
  return out;
}

const LAW=[
{b:"SVerfG",p:"§1",t:"Personen- und Sachbegriffe",x:"Behörden im Sinne des SVerfG sind: 1. GOV (Bundesbehörde, Government of San Andreas), 2. FIB (Bundesbehörde, Federal Investigation Bureau), 3. LSPD (Los Santos Police Department), 4. SAHP (San Andreas Highway Patrol), 5. NG (Nationalgarde), 6. EMS (Emergency Medical Services). Mitarbeiter der o.g. Behörden sind Amtsträger (Beamte). Staatliche Einrichtungen iSd SVerfG sind: 1. Alle Regierungsgebäude und die dazugehörigen Gebäude, 2. Alle Polizeistationen und die dazugehörigen Gebäude, 3. Alle Krankenhäuser und die dazugehörigen Gebäude, 4. Das Fort Zancudo, 5. Das Staatsgefängnis."},
{b:"SVerfG",p:"§2",t:"Hierarchie der Gesetze",x:"Die Gesetze des Staates von San Andreas unterliegen folgender Hierarchie: 1. SVerfG (Grundgesetz), 2. StPO, 3. RAVO, 4. StGB/WaffG/BtMG, 5. BDG, 6. StVO, 7. BGB."},
{b:"SVerfG",p:"§3",t:"Hierarchie der Behörden",x:"Die Behörden des Staates von San Andreas unterliegen folgender Hierarchie im Falle eines Notstandes: 1. Gouverneur, 2. NG, 3. Justiz, 4. GOV/FIB, 5. LSPD/SAHP, 6. EMS, 7. Sonstige."},
{b:"SVerfG",p:"§4",t:"Eidesformel",x:"1. Jeder Beamte einer Behörde ist zwingend zu vereidigen. 2. Die Eidesformel lautet wie folgt: Ich schwöre, dass ich meine Kraft dem Wohle des Volkes von San Andreas widmen, seinen Nutzen mehren, Schaden von ihm wenden, die Gesetze und die Verfassung des Staates wahren und verteidigen, meine Pflichten gewissenhaft erfüllen und Gerechtigkeit gegen jedermann üben werde. 3. Der Eid gilt automatisch nach der Aufnahme in eine Behörde als akzeptiert und abgelegt."},
{b:"SVerfG",p:"Art. 1",t:"Persönlichkeitsrechte",x:"1. Die Würde des Menschen ist unantastbar. Sie zu achten und zu schützen ist Verpflichtung aller staatlichen Gewalt. 2. Alle Menschen sind vor dem Gesetz gleich. 3. Jeder hat das Recht auf die freie Entfaltung seiner Persönlichkeit, soweit er nicht die Rechte anderer verletzt und nicht gegen die verfassungsmäßige Ordnung verstößt. 4. Jeder hat das Recht auf Leben und körperliche Unversehrtheit. Die Freiheit der Person ist unverletzlich. In diese Rechte darf nur auf Grund eines Gesetzes eingegriffen werden. 5. Männer und Frauen sind gleichberechtigt. Der Staat fördert die tatsächliche Durchsetzung der Gleichberechtigung von Frauen und Männern und wirkt auf die Beseitigung bestehender Nachteile hin. 6. Niemand darf wegen seines Geschlechtes, seiner Abstammung, seiner Rasse, seiner Sprache, seiner Heimat und Herkunft, seines Glaubens, seiner religiösen oder politischen Anschauungen benachteiligt oder bevorzugt werden. Niemand darf wegen seiner Behinderung benachteiligt werden. 7. Jede Person hat das Recht, über die Verwendung ihres Bildnisses zu bestimmen. Die Verbreitung und Veröffentlichung von Bildnissen bedarf grundsätzlich der Einwilligung der abgebildeten Person. 8. Die Freiheit des Glaubens, des Gewissens und die Freiheit des religiösen und weltanschaulichen Bekenntnisses sind unverletzlich. 9. Die ungestörte Religionsausübung wird gewährleistet. 10. Jede Person hat das Recht auf Schutz ihrer personenbezogenen Daten. Der Staat gewährleistet, dass Daten nur mit ausdrücklicher Zustimmung der betroffenen Person verarbeitet werden, es sei denn, es besteht eine gesetzliche Grundlage dafür."},
{b:"SVerfG",p:"Art. 2",t:"Meinungs- und Pressefreiheit",x:"1. Jeder hat das Recht, seine Meinung in Wort, Schrift und Bild frei zu äußern und zu verbreiten und sich aus allgemein zugänglichen Quellen ungehindert zu unterrichten. Die Pressefreiheit und die Freiheit der Berichterstattung durch Rundfunk und Film werden gewährleistet. Eine Zensur findet nicht statt. 2. Diese Rechte finden ihre Schranken in den Vorschriften der allgemeinen Gesetze, sowie in dem Recht zum Schutze der persönlichen Ehre. 3. Meinungsäußerungen, die zu Gewalt aufrufen oder Hass gegen bestimmte Gruppen schüren, sind nicht durch die Meinungsfreiheit gedeckt. Der Staat ergreift verhältnismäßige Maßnahmen innerhalb des Gesetzes, um die Verbreitung von Fehlinformationen und Hassrede zu verhindern."},
{b:"SVerfG",p:"Art. 3",t:"Versammlungsfreiheit",x:"1. Alle Bürger haben das Recht, sich ohne Anmeldung oder Erlaubnis friedlich und ohne Waffen zu versammeln. 2. Für Versammlungen unter freiem Himmel kann dieses Recht durch Gesetz oder auf Grund eines Gesetzes beschränkt werden. 3. Unangemeldete Versammlungen vor Dienststellen des LSPD, SAHP, FIB, sowie NG sind verboten und werden sofort aufgelöst. 4. Versammlungen, die die öffentliche Ordnung gefährden oder bei denen Straftaten begangen werden, können durch die zuständigen Behörden aufgelöst werden."},
{b:"SVerfG",p:"Art. 4",t:"Berufsfreiheit",x:"1. Alle Bürger haben das Recht, Vereine, Familien, Unternehmen und sonstige Organisationen zu gründen, sofern deren Satzung oder Ziel nicht gegen geltendes Recht verstößt. 2. Alle Bürger haben das Recht, Beruf, Arbeitsplatz und Ausbildungsstätte frei zu wählen."},
{b:"SVerfG",p:"Art. 5",t:"Unverletzlichkeit der eigenen Wohnung",x:"1. Der Wohnsitz ist unverletzlich. 2. Durchsuchungen von Wohnungen, Häusern, Lagerräumen, Garagen und weiterer separater Nebenräume dürfen nur durch den Richter, bei Gefahr im Verzuge auch durch die in den Gesetzen vorgesehenen anderen Behörden angeordnet und nur in der dort vorgeschriebenen Form durchgeführt werden."},
{b:"SVerfG",p:"Art. 6",t:"Rechtsstaatsprinzip",x:"1. Der Staat San Andreas ist ein demokratischer Staat. 2. Alle Staatsgewalt geht vom Volke aus. Sie wird vom Volke in Wahlen und Abstimmungen und durch besondere Organe der Gesetzgebung, der vollziehenden Gewalt und der Rechtsprechung ausgeübt. 3. Gegen jeden, der es unternimmt, diese Ordnung zu beseitigen, haben alle Bürger das Recht zum Widerstand, wenn eine andere Abhilfe nicht möglich ist. 4. Jeder Bürger ist dazu verpflichtet, die von ihm verlangten Abgaben in Form von möglich anfallenden Strafzahlungen zu bezahlen. 5. Jeder Bürger ist dazu verpflichtet sich selbstständig und unaufgefordert über Gesetzesänderungen und neue Gesetze zu informieren."},
{b:"SVerfG",p:"Art. 7",t:"Gewaltenteilung und -verschränkung",x:"1. Die Verteilung der Staatsorgane und deren Zuständigkeiten und Kompetenzen teilt sich auf in Legislative (Gesetzgebung), Exekutive (Gesetzesausführung) und Judikative (Gerichtsbarkeit). 2. Der Gouverneur und seine Stellv. stellen im Rahmen der Gewaltenverschränkung sowohl Legislative, Judikative als auch Exekutive in Person dar, wobei die Unabhängigkeit der Gerichte gewahrt bleiben muss. Entscheidungen der Judikative dürfen nicht durch die Exekutive in einer Person beeinflusst werden. 3. Der Gouverneur und seine Stellv. können damit, bei personellem Bedarf, sämtliche Rollen und Posten selbst übernehmen und stellen. 4. Der Gouverneur von San Andreas und seine Stellv. sind exekutiver und disziplinarischer Vorgesetzter aller Beamten und Oberbefehlshaber der Nationalgarde (NG), sowie des United States Secret Service (USSS). 5. Der Gouverneur kann Führungskräfte aller Behörden, sofern der Verdacht auf ein Dienstvergehen oder eine anderweitige Straftat besteht, zur Klärung des Sachverhaltes und/oder einem Gerichtsprozess von ihrem Posten suspendieren und, im Falle einer Verurteilung gemäß Art. 12 jeweilige Immunität entziehen. 6. Dem Gouverneur ist es gestattet jederzeit, mit Angabe von Gründen, angemeldete sowie unangemeldete Inspektionen und Überprüfungen sämtlicher staatlicher Organisationen, inklusive Sichtung aller Berichte, Unterlagen, Akten etc., schriftlich anzuordnen und durchzuführen solange nicht gegen die Offenlegung personenbezogener Daten verstoßen wird. Ausgenommen sind Akten, die unter die berufliche Geheimhaltung fallen. 7. Der Gouverneur ist befugt, die Klassifizierung von Akten im öffentlichen Interesse vorzunehmen und zu überwachen. Klassifizierungen sind Leadern und Vizes von staatlichen Organisationen vorbehalten. Es werden keine Familienangehörigen von Leadern o.ä. klassifiziert. 8. Hoheitliche Tätigkeiten der Sicherheit und Strafverfolgung können durch den Gouverneur an für den öffentlichen Dienst besonders Verpflichtete Dritte übertragen werden (z.B. Sicherheitsdienste etc.). 9. Jede Exekutivbehörde ist ausnahmslos dazu verpflichtet ihre Dienstvorschriften, oder entsprechende Teile davon, unaufgefordert öffentlich zu machen, wenn Bürger durch definierte Maßnahmen in ihren Grundrechten verletzt werden könnten."},
{b:"SVerfG",p:"Art. 8",t:"Bürgerbegehren und Volksentscheide",x:"1. Jeder Bürger hat das Recht, ein Bürgerbegehren zu starten, das direkt und ohne Einwirkung des Kongresses durch die Bürger selbst entschieden wird. 2. Um ein Bürgerbegehren zu starten, muss der Initiator mindestens 100 Unterschriften sammeln. Diese Unterschriften müssen von wahlberechtigten Bürgern stammen. 3. Ist das Bürgerbegehren zulässig und verstößt nicht gegen geltendes Recht, die Prüfung erfolgt durch den Kongress und final durch den Gouverneur, wird es der Öffentlichkeit zugänglich gemacht und es wird eine Frist für die Durchführung eines Bürgerentscheids festgelegt. 4. Der Bürgerentscheid findet in Form einer Abstimmung unter allen wahlberechtigten Bürgern statt. Das Ergebnis des Bürgerentscheids ist bindend und tritt unmittelbar am nächsten Werktag nach Verkündung in Kraft."},
{b:"SVerfG",p:"Art. 9",t:"Dekrete des Gouverneurs",x:"1. Der Gouverneur des Staates San Andreas kann während der Ausübung seines Amtes Dekrete erlassen, die selbige Wirkung haben wie geltende Gesetze. 2. Durch den Gouverneur erlassene Dekrete dürfen dabei maximal vier Wochen andauern und müssen dann in ein geltendes Gesetz umgewandelt werden, da sie ansonsten mit dem Ablauf der Frist automatisch an Gültigkeit verlieren. 3. Dekrete desselben Inhalts dürfen nicht unmittelbar aufeinanderfolgend und nach Ablauf der o.g. Frist erneut ausgestellt werden. 4. Der Gouverneur kann Beschuldigte und verurteilte Straftäter auf Gesuch derer selbst oder ihrer lizenzierten rechtlichen Vertreter begnadigen."},
{b:"SVerfG",p:"Art. 10",t:"Parteien",x:"1. Die Parteien wirken bei der politischen Willensbildung des Volkes mit. Ihre Gründung ist frei. Ihre innere Ordnung muss demokratischen Grundsätzen entsprechen. 2. Parteien, die nach ihren Zielen oder nach dem Verhalten ihrer Anhänger darauf ausgehen, die freiheitliche demokratische Grundordnung zu beeinträchtigen oder zu beseitigen oder den Bestand des Staates San Andreas zu gefährden, sind verfassungswidrig. Diese Parteien werden ex tunc als nichtig erklärt. 3. Der regierende Gouverneur des Staates San Andreas muss zwingend der gewählten Partei angehören. 4. Dem Gouverneur ist es nicht gestattet für den Wahlkampf seiner Person oder seiner Partei auf öffentliche Bank- oder Bargelder zuzugreifen."},
{b:"SVerfG",p:"Art. 11",t:"Kongress",x:"1. Der Kongress besteht aus den Leitern der Regierungsbehörden (GOV, FIB, LSPD, SAHP, NG, EMS und Lifeinvader) oder deren von der Geschäftsführung beratenen Vertretern. Nur diese haben Stimmrechte. 2. Der Kongress tritt einmal pro Woche zusammen, um über Anliegen abzustimmen und/oder den Rechtsrahmen zu ändern. Sitzungen können nur nach Absprache mit dem Gouverneur des Staates persönlich oder per Konferenz abgehalten werden. 3. Jede Kongresssitzung muss zwingend von einem Schriftführer protokolliert werden und das Protokoll in der Regierung sicher verwahrt werden. 4. Der Gouverneur kann eine außerordentliche Kongresssitzung einberufen. 5. Der Gouverneur kann im Falle wichtiger und die Sicherheit des Staates betreffender Themen die Vertreter des EMS sowie Lifeinvader aus der konkreten Kongresssitzung ausschließen. 6. Jedem Bürger ist es gestattet seine Anliegen und Vorschläge schriftlich über die Regierung einzureichen, oder - ebenfalls schriftlich - direkt einem Kongressabgeordneten vorzutragen oder zu übergeben. 7. Von Bürgern eingereichte Anliegen müssen binnen der nächsten zwei Kongresssitzungen in der jeweiligen Sitzung besprochen werden. 8. Eingereichte Anliegen an das Government können aufgrund objektiver Kriterien durch den Zuständigen der Regierung abgewiesen werden. Die Abweisung hat dringend schriftlich und ebenso öffentlich im Staatsforum zu erfolgen wie das Anliegen selbst. 9. Sofern ein Gesetzesentwurf oder eine Gesetzesänderung im Kongress besprochen wird und eine einfache Mehrheit erhält, wird der Gesetzesentwurf zur finalen Prüfung und Freigabe an das Büro des Gouverneurs übergeben. Nach erfolgter Revision wird der Gouverneur das Gesetz erlassen oder objektiv begründet und schriftlich ablehnen. 10. Im Falle einer Ablehnung erhält der Einreichende des Gesetzesentwurfes bzw. der Gesetzesänderung eine schriftliche Mitteilung inklusive Begründung über die Ablehnung öffentlich und per Textnachricht. 11. Gemäß diesem Artikel (des Gesetzes zur Erweiterung der Untersuchungsbefugnisse des Kongresses) kann der Kongress auch als Untersuchungsausschuss eingesetzt werden. Der Kongress hat das Recht, Untersuchungen zu bestimmten Angelegenheiten durchzuführen, die von öffentlichem Interesse sind und die das Funktionieren des Staates oder die Rechte der Bürger betreffen. Der Kongress ist befugt, Zeugen zu befragen, Beweise zu sammeln und über den Gouverneursrat Berichte zu erstatten, um die Ergebnisse seiner Untersuchungen der Öffentlichkeit zugänglich zu machen. 12. Gesetzesänderungen, die die Verfassung des Staates von San Andreas (SVerfG) betreffen, bedürfen der Zustimmung von mindestens 2/3 der Abgeordneten, sowie des Gouverneurs persönlich. 13. Eine Entziehung der Immunität und die Amtsenthebung einer leitenden Person obliegen ebenfalls einer Zustimmung von 2/3 der Stimmberechtigten. Sollte eine solche Mehrheit vorliegen, erfolgt eine letzte Prüfung durch den Gouverneur. Nach erfolgreicher Prüfung darf die jeweilige Maßnahme durchgeführt werden. 14. Sollte eine Amtsenthebung sich gegen den Gouverneur richten, obliegen die oben niedergeschriebenen Rechte aus Abs. 13 dem General of Army. 15. Alle Sitzungen des Kongresses sind zu protokollieren und die Protokolle müssen innerhalb von 48 Stunden nach der Sitzung für alle State Leader veröffentlicht werden. Des Weiteren muss eine Version, in der vertrauliche oder nicht für die Öffentlichkeit bestimmte Informationen geschwärzt sind, für alle Bürger zugänglich gemacht werden, genau so wie neu beschlossene Gesetze."},
{b:"SVerfG",p:"Art. 12",t:"Immunität",x:"1. Nach ihrer Vereidigung genießen die staatlichen Kongressabgeordneten (Leader- und Vizeleader) während ihrer Anstellung bei der Regierung absolute Immunität vor der Strafverfolgung. 2. Die Immunität eines jeden Abgeordneten oder Beamten kann durch den Gouverneur, in Rücksprache mit den Exekutivbehörden, mit sofortiger Wirkung aufgehoben werden, sofern der hinreichende Verdacht einer schweren Straftat im Raum steht. 3. Im selben Maße sind für Leiter und Vize-Leiter der jeweiligen Behörden die Personalakten zu klassifizieren."},
{b:"SVerfG",p:"Art. 13",t:"Rechtsanwälte im Staat",x:"1. Jeder Bürger hat gem. Art. 4 der Verfassung das Recht sich als lizenzierter Rechtsanwalt bei der Anwaltskammer registrieren zu lassen. 2. Der Registrierung als Rechtsanwalt geht dabei eine Anwaltsprüfung voraus (Staatsexamen), zu der sowohl die Entrichtung eines Entgeltes, sowie das Bestehen der Anwaltsprüfung gehören, die durch die Regierung gestellt wird. 3. Lizenzierte Rechtsanwälte haben straffrei zu handeln. Jedem Rechtsanwalt, der einer Straftat überführt und rechtmäßig verurteilt wird, wird unmittelbar die Anwaltslizenz entzogen. 4. Jedem durch seinen Mandanten beauftragten Rechtsanwalt ist es gestattet seinen Mandanten nach Inhaftierung in einer Gewahrsamszelle oder dem Staatsgefängnis für eine Dauer von maximal 15 Minuten zur Besprechung des juristischen Sachverhaltes zu besuchen, sofern es die jeweilige und momentane Sicherheitslage zulässt."},
{b:"SVerfG",p:"Art. 14",t:"Terror-Status",x:"1. Personengruppen oder Organisationen können mit Erhalt des Terror-Status durch den Gouverneur, in Absprache mit der Exekutive, zeitweilig Teile ihrer Grundrechte abgesprochen bekommen, wenn die öffentliche Sicherheit durch gewalttätige und unwillkürliche Handlungen stark gefährdet ist. 2. Die Dauer des Status wird von der Regierung festgelegt und kann unter besonderen Umständen verlängert werden. Für ein nachgewiesenes Mitglied einer solchen Organisation gilt Folgendes während des Status: 3. Zugehörige Personen können zu jeder Zeit und ohne konkreten Tatverdacht durch die Behörden durchsucht werden. 4. Unternehmen betreffender Personen können von der Regierung versiegelt werden. 5. Waffenschein- und Berufssperren können verhängt werden. 6. Keine Möglichkeit der Aussetzung eines Haftbefehls gegen Kaution."},
{b:"SVerfG",p:"Art. 15",t:"Schutz personenbezogener Daten",x:"1. Jede Person hat das Recht auf Schutz ihrer personenbezogenen Daten. 2. Daten dürfen nur mit ausdrücklicher Zustimmung der betroffenen Person verarbeitet werden, es sei denn, es besteht eine gesetzliche Grundlage dafür. 3. Der Staat verpflichtet sich, die Sicherheit und Integrität personenbezogener Daten zu gewährleisten."},
{b:"StPO",p:"§1",t:"Personen- und Sachbegriffe",x:"Behörden im Sinne der StPO sind: 1. GOV (Bundesbehörde, Government of San Andreas) 2. FIB (Bundesbehörde, Federal Investigation Bureau) 3. LSPD (Los Santos Police Department) 4. SAHP (San Andreas Highway Patrol) 5. NG (Nationalgarde) 6. EMS (Emergency Medical Services) Mitarbeiter der o.g. Behörden sind Amtsträger (Beamte). Staatliche Einrichtungen iSd StPO sind: 1. Alle Regierungsgebäude 2. Alle Polizeistationen 3. Alle Krankenhäuser 4. Das Fort Zancudo Der Einfachheit halber wird im gesamten Gesetzestext die männliche Form verwendet; die weibliche und diverse Form sind selbstverständlich eingeschlossen."},
{b:"StPO",p:"§2",t:"Beweispflicht bei Videoüberwachung",x:"1. Bodycams müssen für die Staatsanwaltschaft, Rechtsanwälte und den Eigentümer ersichtlich sein, verfügbar gemacht werden und von einem Staatsanwalt nach Gültigkeit überprüft werden, vor Gericht der vorsitzende Richter. Das Auswerten durch Exekutivbeamte ist unzulässig. 2. Als Auswertung einer Bodycam gilt die aktive Überprüfung von Inhalten dieser Bodycam."},
{b:"StPO",p:"§3",t:"Strafmaß und Anrechnung",x:"1. Der Grundsatz \"Im Zweifel für den Angeklagten\" gilt in allen Fällen. 2. Alle Vorwürfe gegen einen Beschuldigten sind entsprechend dem Ermessensspielraum der Staatsanwaltschaft zu berücksichtigen und in Bußgeld oder Haftstrafe umzusetzen. 3. Strafmilderungen oder Anpassungen durch Staatsanwälte oder Richter müssen in der Strafakte mit dem Hinweis \"(STA)\" vermerkt werden. 4. Dasselbe gilt für die Berechnung von Kautionen oder Ersatzstrafen. 5. Ordnungswidrigkeiten ergeben keine Hafteinheiten. 6. Wenn der Beschuldigte nicht bereit oder in der Lage ist, das Bußgeld zu zahlen, kann eine Ersatzfreiheitsstrafe verhängt werden. Pro angefangene 20.000$ Bußgeld entspricht das einer Hafteinheit. 7. Die maximale Strafe ist der schwerwiegendste Einzelstraftatbestand. 8. Wenn durch bereits vorhandene Wanteds bei der Strafaussetzung die Maximalgrenze an Wanteds überschritten wird, sind die, das Limit, überschreitenden Wanteds sofern möglich in ein Bußgeld umzuwandeln. Hierbei entspricht je 1 Wanted 20.000$ Bußgeld. 9. Automatisch vergebene Wanteds des staatlichen Überwachungssystems sind für Beamte verwertbar. 10. Ist ein Beschuldigter bereits mit jenen Wanteds belastet, hat dieser das Recht, sich bei einer Exekutivbehörde (LSPD, SAHP, FIB) an der Rezeption zu stellen. Bei Widerstand oder Wanteds, die gemäß Bußgeldkatalog anfallen, verfällt dieses Recht."},
{b:"StPO",p:"§4",t:"Staatsanwaltliche Vorladungen",x:"1. Jeder Beschuldigte, Zeuge oder Sachverständige muss einer Vorladung der Staatsanwaltschaft zur Vernehmung nachkommen. 2. Wenn jemand der Vorladung nicht folgt, kann die Staatsanwaltschaft seine Vorführung anordnen. Die Verhaftung und Vorführung können durch Haftbefehle (\"Hafteinheiten\") der Behörden durchgesetzt werden. 3. Das Nichtbefolgen einer Vorladung wird als Behinderung eines Ermittlungsverfahrens bestraft."},
{b:"StPO",p:"§6",t:"Umgang mit Beschuldigten",x:"1. Staatsanwälte und Exekutivbehörden dürfen nur dann in die Rechte einer Person eingreifen, wenn dies gesetzlich erlaubt und für die Ausübung ihrer Aufgaben notwendig ist. 2. Jeder Eingriff in Rechte muss in einem angemessenen Verhältnis zur Schwere der Straftat, dem Verdachtsgrad und dem angestrebten Ziel stehen. 3. Jeder Beschuldigte hat Anspruch auf Beendigung der Ermittlung innerhalb angemessener Frist. Ein eventuell notwendiges Verfahren ist stets zügig und ohne unnötige Verzögerung durchzuführen 4. Die Staatsanwaltschaft kann auf Verlangen an jedem Abhandlungsfall beteiligt sein oder in Zusammenarbeit die Führung übernehmen. § Befugnisse staatlicher Exekutivbehörden"},
{b:"StPO",p:"§7",t:"Die Regierung von San Andreas",x:"Die Regierung hat das Recht, Vorschriften für öffentliche und private Kontrollen zu erlassen (nicht mehr als 7 Kontrollen pro Woche, und nicht mehr als 2 Kontrollen einer Gruppierung pro Woche)."},
{b:"StPO",p:"§8",t:"United States Secret Service",x:"1. Haupttätigkeit des USSS ist der Personenschutz von Regierungsbeamten (insbesondere des Gouverneurs), sowie der Gebäude- und Objektschutz (z.B. Geldtransport) des Ministeriums und weiterer öffentlicher oder behördlicher Gebäude, wie z.B. der LifeInvader oder Krankenhäuser in San Andreas. 2. Dem USSS ist es gestattet an sämtlichen Szenarien und Events und der Abhandlung von Straftaten teilzunehmen, sofern die Unterstützung durch den Gouverneur oder den Direktor des Secret Service angeordnet wird, oder andere Exekutivbehörden um Unterstützung bitten. 3. Für den Personenschutz höherer Regierungsbeamter kann das USSS temporär die Weisungsbefugnis über Sicherheit und Ordnung in bestimmten Gebäuden und/oder an bestimmten Plätzen übernehmen. Dabei ist an den Kollegialitätsgrundsatz zu denken."},
{b:"StPO",p:"§9",t:"Federal Investigation Bureau",x:"1. Das FIB ist dazu verpflichtet die in dem offiziellen Bußgeldkatalog gelb und/oder mit einem Häkchen markierten Tatbestände zwingend an die jeweilige Behörde (Staatsanwaltschaft) weiterzugeben, des weiteren diese zur gemeinsamen Bearbeitung des Falles hinzuzuziehen. 2. Das Federal Investigation Bureau (FIB) darf Wanteds als sog. “Ortungs-Wanteds” vergeben, um in akuten Strafsachen oder bei Gefahr in Verzug Personen ausfindig zu machen. 3. Für die Vergabe von Wanteds zur Festnahme von Personen nach (Untersuchungs-)Haftbefehl oder staatsanwaltlichen Vorladungen sind entsprechende schriftliche Beschlüsse nötig."},
{b:"StPO",p:"§10",t:"Nationalgarde",x:"1. Die Nationalgarde (NG) ist dazu verpflichtet die in dem offiziellen Bußgeldkatalog gelb und/oder mit einem Häkchen markierten Tatbestände zwingend an die jeweilige Behörde (FIB oder Staatsanwaltschaft) weiterzugeben, bzw. diese zur gemeinsamen Bearbeitung des Falles hinzuzuziehen. 2. Die Nationalgarde untersteht dem direkten Befehl des obersten Befehlshabers der Streitkräfte und Exekutiven, dem Gouverneur von San Andreas. 3. Alle Mitarbeiter der Nationalgarde dürfen das Fort Zancudo während ihres Dienstes nicht verlassen. Ausnahme: Wenn der Vorgesetzte es erlaubt sowie Ausnahmen gem. MG. 4. Die Spezialabteilung der Nationalgarde kann gem. MG in San Andreas patrouillieren, um Straftaten zu verhindern."},
{b:"StPO",p:"§11",t:"LSPD und SAHP",x:"1. Das LSPD und SAHP sind dazu verpflichtet die in dem offiziellen Bußgeldkatalog gelb und/oder mit einem Häkchen markierten Tatbestände zwingend an die jeweilige Behörde (FIB oder Staatsanwaltschaft) weiterzugeben, bzw. diese zur gemeinsamen Bearbeitung des Falles hinzuzuziehen. 2. Das LSPD/SAHP darf Wanteds als sog. “Ortungs-Wanteds” vergeben, um in akuten Strafsachen oder bei Gefahr in Verzug Personen ausfindig zu machen. 3. Für die Vergabe von Wanteds zur Festnahme von Personen nach (Untersuchungs-)Haftbefehl oder staatsanwaltlichen Vorladungen sind entsprechende schriftliche Beschlüsse nötig. § Prozessuale Bestimmungen"},
{b:"StPO",p:"§12",t:"Festsetzung von Personen und Verdächtigen",x:"1. Beamte haben 25 Minuten Zeit, um eine Person ins Gefängnis oder zum Gerichtssaal der Regierung zu bringen, ab dem Moment, an dem der Tatverdächtige Handschellen angelegt bekommt. 2. Eine Verlängerung auf 120 Minuten erfolgt hier, wenn der Tatverdächtige in einen längeren Aufenthalt einwilligt (z.B. Hinzuziehen eines Anwalts, auch wenn keiner erreicht wird). Dabei kann der Beamte entscheiden, ob er den Tatverdächtigen in die Zellen des SAHP, LSPD, FIB, in das Staatsgefängnis oder zum Gerichtssaal der Regierung bringt. Sollte aus medizinischen Gründen das EMS dazugerufen werden, muss die Abhandlungszeit beim Fordern des EMS gestoppt werden und wird fortgesetzt, wenn das EMS seine Arbeit für beendet erklärt hat. 3. Die Demaskierung von Personen ist nur zur Identifizierung und weiteren Festnahme sowie zur Aufnahme einer Person in die staatliche Datenbank erlaubt. 4. Bei einer ausgeschriebenen Fahndung (Wanted) von mindestens 3 Wantedsternen darf das Privatgelände von Personen, aufgrund von Gefahr im Verzug, ohne Beschluss durch Beamte betreten werden, sofern mit an Sicherheit grenzender Wahrscheinlichkeit die jeweilige Person auf dem Gelände gesichtet worden ist. 5. Die Einzelhaft ist eine Maßnahme, die zur Aufrechthaltung der Ordnung im Staatsgefängnis nur zulässig ist, wenn der Grundsatz der Verhältnismäßigkeit ggü. dem Grundrechtseingriff beachtet wird. 6. Personen dürfen ohne entsprechenden Beschluss niemals aufgrund ihrer vermuteten Zugehörigkeit zu anderen kriminellen Gruppierungen oder Organisationen (z.B. gleiche Farbe der Kleidung o.ä.) festgesetzt oder durchsucht werden."},
{b:"StPO",p:"§13",t:"Identitätsfeststellungen",x:"1. Für die Identitätsfeststellung muss ein angemessener Grund vorliegen, da die Maßnahme sonst als Eingriff in die Privatsphäre zu werten ist und somit eine Straftat darstellt. 2. Um eine Identitätsfeststellung durchzuführen ist, bei gebotenem Anlass oder Widerstand der Person, diese auch unter Zwangsmaßnahmen möglich. 3. Beamten jeglicher Exekutivbehörden (inkl. USSS), sowie der NG auf dem eigenen Militärgelände und bei aktiven Einsätzen, ist es jederzeit gestattet Fahrzeuge im Straßenverkehr anzuhalten um die Identität einer Person festzustellen."},
{b:"StPO",p:"§14",t:"Durchsuchungen an der Person",x:"1. Durchsuchungen von privaten Taschen, Rucksäcken oder weiteren Kleidungsstücken sind durch Beamte ohne Beschluss nur bei dringendem Tatverdacht oder dem Betreten staatlicher Einrichtungen gestattet. 2. Dasselbe gilt für Fahr- und Flugzeuge sowie Boote aller Art. 3. Das Recht zur Durchsuchung obliegt nur der Orga, welche das Hausrecht besitzt und darf von dieser Organisation auch temporär übertragen werden. 4. Im SG hat jede staatliche Organisation im Sinne dieses Paragraphen Hausrecht."},
{b:"StPO",p:"§15",t:"Checkpoints",x:"1. Beamten der Exekutivbehörden ist es jederzeit und ohne vorherige Ankündigung gestattet Blitzer- sowie Laserzonen und Checkpoints einzurichten. 2. Bei einem eingerichteten Checkpoint dürfen Beamte alle Fahrzeuge und Insassen, die sich dem Kontrollpunkt nähern, diesen befahren, darin halten oder scheinbar umfahren wollen, zur Identitätsfeststellung anhalten und durchsuchen. 3. Checkpoints sind Mautstellen, Sicherheitskontrollen und ähnliche Anlagen, bei denen Beamte zur allgemeinen anwesenden Sicherheit des Volkes Kontrollen durchführen."},
{b:"StPO",p:"§16",t:"Strafanzeige",x:"1. Sogenannte “Antragsdelikte” (gem. StGB) erfordern, dass von der geschädigten Person, oder der Exekutivbehörde, eine Strafanzeige gegenüber dem Tatverdächtigen/Beschuldigten getroffen wird. 2. Die Anzeige einer Straftat kann bei der Staatsanwaltschaft und den Beamten des Polizeidienstes mündlich oder schriftlich angebracht werden. 3. Dem Verletzten ist auf Antrag der Eingang seiner Anzeige zu bestätigen. 4. Die Bestätigung soll eine kurze Zusammenfassung der Angaben des Verletzten zu Tatzeit, Tatort und angezeigter Tat enthalten. 5. Die Anzeige ist in kurzer Form intern bei der jeweiligen Behörde mit Antragstellern, Täter, Tat, Tatzeit und Tatort zu dokumentieren und mindestens 7 Tage aufzubewahren."},
{b:"StPO",p:"§17",t:"Einstweilige Anordnung",x:"1. Bei wiederholter Belästigung oder auch bei Bedrohungen oder Übergriffen besteht die Möglichkeit, eine einstweilige Anordnung bei der Justiz zu beantragen. 2. Diese einstweiligen Anordnungen können sich gegen einzelne Personen oder auch gegen Personengruppen wenden. 3. Ein Verstoß gegen diese Anordnung stellt ein Verbrechen nach StGB dar."},
{b:"StPO",p:"§18",t:"Platzverweise",x:"1. Die Behörden sind dazu berechtigt, temporäre Sperrzonen zu errichten, wenn andere Mittel ohne diese unausweichlich erscheinen. Das Errichten von temporären Sperrzonen kann bei Missachtung sowie willentlicher Durchbrechung dieser mit Schusswaffengebrauch geahndet werden, sofern es Teil der Bekanntmachung war. 2. Die temporäre Sperrzone ist entsprechend einer öffentlichen Mitteilung für alle Bürger erkenntlich zu machen. 3. Staatsbeamte haben jederzeit das Recht, Personen oder Personengruppen zeitliche und örtliche Zutrittsbeschränkungen zu erteilen, um allgemeine Gefahren zu vermeiden und um die Ordnung in einer Situation herzustellen, oder auch wiederherzustellen. 4. Platzverweise müssen immer eine zeitliche und örtliche Datierung besitzen und dürfen eine Dauer von 12 Stunden und einen Umkreis von 50 Metern nicht überschreiten. 5. Platzverweise dürfen lediglich von berechtigten Personen verteilt werden. 6. Auf Privatgelände sind Platzverweise nur dann zulässig, wenn die schwierige Einsatzlage dies erfordert (z.B. Razzia). 7. Bei Personen welche selbst Eigentümer des durch die Maßnahme betroffenen Geländes sind, ist ein Platzverweis von maximal 1 Stunde zulässig. 8. Zuwiderhandlungen können gem. StGB geahndet werden."},
{b:"StPO",p:"§19",t:"Vorstrafen, Verjährung und Löschung",x:"1. Straftaten verjähren in der Regel nach 14 Tagen. 2. Die Verjährung wird unterbrochen, wenn ein Revisionsantrag gestellt oder ein Gerichtstermin angesetzt wird. 3. Als vorbestraft gilt, wer entweder Haftstrafen in seiner Akte (\"Kürzliche Verbrechen\") eingetragen hat, die jünger als 15 Tage sind und/oder wer Geldstrafen in seiner Akte eingetragen hat, die mit der Vergabe von Haftstrafen verbunden sind/waren, die jünger als 15 Tage sind. 4. Eine Strafakte darf nur mit schriftlicher Genehmigung eines Richters gelöscht werden. Der Antrag muss schriftlich von einer Exekutivbehörde oder einem Anwalt eingereicht werden. 5. Wenn eine Akte (z.B. Haftbefehle, Geldstrafen, Lizenzentzug) fälschlicherweise ausgestellt wird, muss der Beamte den Vorfall dokumentieren und sofort seine Vorgesetzten oder die Justiz informieren."},
{b:"StPO",p:"§20",t:"Razzien und Durchsuchungen",x:"Eine Razzia verfolgt das Ziel, das entsprechende Gebiet (inkl. Häuser, Garagen, Nebenräume, Fahrzeuge etc.) zu durchsuchen, das einer kriminellen Organisation zugeordnet wird. 2. Razzien können auch aufgrund folgender Tatsachen durchgeführt werden: 1. Häufige Verstöße gegen Staatsgesetze durch Mitglieder krimineller Organisationen oder Banden. 2. Durchführung terroristischer Akte oder terroristischer Aktionen. 3. Geiselnahme von Mitarbeitern staatlicher Organisationen oder Zivilisten. 3. Jeder Razzia muss zwingend ein schriftlicher Antrag einer Exekutivbehörde sowie ein schriftlich ausgestellter Durchsuchungsbeschluss der Regierung vorausgehen. 4. An einer Razzia dürfen Exekutivbeamte aller Behörden teilnehmen (mindestens 20 Beamte). 5. Razzien dürfen nicht häufiger als einmal alle 48 Stunden pro Behörde durchgeführt werden. 6. Während einer Razzia dürfen Exekutivbeamte verdächtige Personen zum Schutz der eigenen Sicherheit und für weitere Ermittlungen festnehmen sowie deren Taschen und andere Gegenstände durchsuchen. Der Verdächtige muss sich im Gebiet des Beschlusses aufhalten. 7. Im Falle einer erfolgreichen Razzia werden 30% der Waffenbestände aus dem Lager der kriminellen Organisation konfisziert und entsorgt. 8. Mindestformvorschriften eines Razzia- oder Durchsuchungsbeschlusses sind: A. Die ermittelnde und Antragstellende Behörde,, B. Üblicher Name der Gruppierung, Organisation oder Personen (im Falle von Durchsuchungsbeschlüssen gegen Einzelpersonen) C. Festgestellte Gesetzesverstöße, D. Ort, an dem die Razzia durchgeführt werden darf F. Zeitraum, in dem die Razzia erfolgen darf, G. Angabe und Unterschrift des Ausstellers (Sachbearbeiter), H. Zeitpunkt der Ausstellung des Beschlusses. 9. Eine Revision ist nur dann zulässig, wenn eine der im Absatz 8 genannten Mindest Formvorschriften nicht eingehalten wurde, oder die Beweismittel der jeweiligen Akte nicht mit den vorgeworfenen Gesetzesverstößen vollständig übereinstimmen. Ebenfalls kann der Beschluss angefochten werden, wenn die Beweislage zum Aufenthaltsort der Gruppierung, Organisation oder der Wohnort der Person nicht zu genüge oder gar nicht in den Beweisen aufgeführt ist. Der Beschluss darf ausschließlich aufgrund dieser formellen Vorgaben angefochten werden. Eine Revision, die auf andere Gründe gestützt wird, ist unzulässig und unanfechtbar. Dies schließt jegliche Argumentation oder Anfechtung durch Rechtsanwälte gegen diese Bestimmungen aus. 10. Durchsuchungsbeschlüsse gegen Privatbesitz dürfen mündlich von der Justiz vor der schriftlichen Ausstellung an zuständige Beamte erteilt werden. Der Beschluss muss innerhalb von 24 Stunden schriftlich nachgereicht werden. Fahrzeuge, die einer Gruppierung zugeordnet werden können und gegen die konkrete Verdachtsmomente bestehen, sind im Rahmen eines Durchsuchungsbeschlusses zu durchsuchen."},
{b:"StPO",p:"§21",t:"Verdeckte Ermittler",x:"1. Ein verdeckter Ermittler (Undercover) ist ein Exekutivbeamter, welcher nach außen hin als Zivilperson auftritt und eine falsche Identität annimmt, um ungestört Ermittlungen durchführen zu können. Verdeckte Maßnahmen dürfen nur vom FIB durchgeführt werden. 2. Sie sind von der Kleiderordnung befreit. Sollten die verdeckten Ermittler in eine polizeiliche Maßnahme geraten, müssen sie sich erkenntlich machen. 3. Verdeckte Ermittler dürfen zur Aufklärung von Straftaten eingesetzt werden, wenn zureichende tatsächliche Anhaltspunkte dafür vorliegen, dass eine Straftat von erheblicher Bedeutung begangen wurde. 4. Soweit für den Aufbau oder die Aufrechterhaltung der Identität unerlässlich ist, dürfen entsprechende Dokumente / Personalien verändert werden. 5. Der verdeckte Ermittler muss immer fallbezogen sein und endet automatisch nach Abschluss der Ermittlung. 6. Verdeckte Ermittlungen müssen stets auf Anfrage des Justizministeriums oder des Gouverneursbüro offengelegt werden."},
{b:"StPO",p:"§22",t:"Kaution",x:"1. Jede Person kann den Vollzug einer Inhaftierung gegen eine Strafzahlung aussetzen. 2. Die Höhe der Strafzahlung, d.h. der Kaution, bemisst sich anhand der gesamten Haftstrafe und beträgt jeweils 200% der Wanteds (zzgl. der Gebühr, die direkt ggü. dem Wärter im SG zu entrichten ist). 3. Wenn besonders schwerwiegende Straftaten vorgeworfen werden (4 oder 5 Wanteds), ist eine Kaution nicht möglich. 4. Die Kaution ist in der jeweiligen Höhe als Geldstrafe in der Strafakte des Beschuldigten mit dem Vermerk \"(Kaution)\" zu hinterlegen. 5. Sofern das Bußgeld eines Beschuldigten voll ist, ist dieser für eine Kautionszahlung nicht qualifiziert. 6. Die Kaution ist nur durch einen Mitarbeiter des Justizministeriums zu bewilligen. 7. Der Inhaftierte ist ausschließlich durch einen Mitarbeiter des Justizministeriums aus der Haft zu entlassen."},
{b:"StPO",p:"§23",t:"Entschädigung",x:"1. Betroffene können eine Entschädigung für Dienstausfälle beantragen, die durch falsche Maßnahmen des Staates oder seiner Beamten verursacht wurden. 2. Die Entschädigung richtet sich nach der Dauer des Arbeitsverhältnisses und dem entgangenen Lohn. 3. Die Entschädigung bei Dienstausfällen beträgt pro Tag ohne ausreichende Begründung nicht mehr als $50.000 und darf ohne ausreichenden Grund eine Maximalsumme von $200.000 überschreiten. 4. Die Höhe der Entschädigung wird entgültig entweder durch ein Gerichtsurteil oder durch einen schriftlichen Antrag und richterlichen Beschluss festgelegt. 5. Dasselbe gilt für Entschädigungen bei Verfahrensfehlern oder einer Revision. Die Entschädigung basiert auf der ausgestellten Strafakte, wobei pro abgesessener Hafteinheit 25.000$ entschädigt werden, sowie die volle Geldstrafe und die Anwaltskosten nach AWO. 6. Die Entschädigung wird von der Regierung bezahlt."},
{b:"StPO",p:"§24",t:"Untersuchungshaft",x:"1. Die Untersuchungshaft ist die Inhaftierung einer Person, bei welcher auf den Täter vermutlich zutreffende Prüfungsmerkmale festgestellt wurden und deshalb der Tatverdächtige festgesetzt wird, um ihn oder andere Nichtverdächtige auszuschließen oder Personen festzustellen, die weitere für die Ermittlungen bedeutsame Prüfungsmerkmale erfüllen. 2. Die Maßnahme darf nur angeordnet werden, wenn die Erforschung des Sachverhalts oder die Ermittlung des Aufenthaltsortes des Täters auf andere Weise erheblich weniger erfolgversprechend oder wesentlich erschwert wäre. 3. Zweck und Begründung der Untersuchungshaft muss ein laufendes Ermittlungsverfahren sein. 4. Ein Untersuchungshaftbefehl muss immer schriftlich erfolgen und ist auf Verlangen dem Beschuldigten auszuhändigen. 5. Der Untersuchungshaftbefehl muss spätestens 1 Stunde nach Festnahme in Schriftform vorliegen. 6. Personen mit einem Fahndungsaufruf werden nach Ihrer Ergreifung ebenfalls in Untersuchungshaft genommen. Hierfür bedarf es keines schriftlichen Untersuchungshaftbefehls. 7. Die Untersuchungshaft darf eine Dauer von 25 Minuten nicht überschreiten."},
{b:"StPO",p:"§25",t:"Medizinische Gutachten",x:"1. Im Rahmen ihrer Tätigkeiten in einer Abhandlung sind die Mitarbeiter der Emergency Medical Services (EMS) dazu befugt, den Tatverdächtigen zu untersuchen und seine körperliche Unversehrtheit zu überprüfen. Sie dürfen in Schnellverfahren keine Gutachten erstellen, die eine Unzurechnungsfähigkeit diagnostiziert. 2. Das Ergebnis und die Inhalte eines psychologischen Gutachtens fallen unter die ärztliche Schweigepflicht und dürfen lediglich durch Zustimmung der betroffenen Person kundig gemacht werden. 3. Die Verwendung von Ergebnissen und Inhalten der psychologischen Gutachten ohne Zustimmung der betroffenen Person sind vor Gericht unzulässig. 4. Die Weitergabe von Ergebnissen und Inhalten der psychologischen Gutachten ohne Zustimmung der betroffenen Person durch Mitarbeiter des EMS stellen eine Straftat dar."},
{b:"StPO",p:"§26",t:"Beschlagnahmung und Sicherstellung",x:"1. Tatverdächtigen dürfen illegale Gegenstände im Sinne des StGB und WaffG abgenommen werden, sofern diese Personen ihre Strafen ausgestellt bekommen. 2. Sollte der Tatverdächtige aufgrund von vorliegenden Abhandlungsfehlern nicht verurteilt werden, muss ein Staatsanwalt über die Korrektheit der Polizeimaßnahme bestimmen und entscheiden, ob die Gegenstände abzunehmen sind, oder Moralische oder anderweitige Bedenken aufkommen könnten. 3. Ebenfalls dürfen Gegenstände konfisziert werden, die für eine Ermittlung oder Untersuchung als sehr wichtiger Beweis zu werten sein können. 4. Eine Konfiszierung kann freiwillig durch die eigenständige Abgabe oder zwanghaft durch eine Durchsuchung und Sicherstellung erfolgen. 5. Sollten Gegenstände fälschlicher weiße oder aus den falschen Beweggründen konfisziert worden sein, kann die geschädigte Person zusammen mit einem Rechtsanwalt Antrag auf Schadensersatz bei der Regierung stellen."},
{b:"StPO",p:"§27",t:"Ausweispflicht von Beamten",x:"1. Sollte sich eine Person in einer polizeilichen Diensthandlung befinden, dann hat diese das Recht einen Dienstausweis von dem Exekutivbeamten zu verlangen. 2. Das Vorzeigen des Dienstausweises ist nur dann nicht sofort zu tätigen, wenn die Beamten sich in Gefahr befinden. 3. Exekutivbeamte, welche in ziviler Kleidung unterwegs sind und Diensthandlungen tätigen, müssen der betroffenen Person vor der Maßnahme ihre behördliche Zugehörigkeit und ihren Dienstausweis vorzeigen und sich in Form einer Weste deutlich erkenntlich zeigen. 4. Gegenüber anderen Beamten ist man immer dazu verpflichtet , seinen Dienstausweis vorzulegen. 5. Jeder Beamte ist dazu verpflichtet, seinen Dienstausweis immer mit sich zu führen."},
{b:"StPO",p:"§28",t:"Entziehung von Lizenzen und Lizenzsperren",x:"1. Durch ein Gerichtsurteil oder eine richterliche, ersatzweise staatsanwaltliche Verfügung kann jede Art einer Lizenz auf unbestimmte Zeit entzogen werden. 2. Ist jemand rechtskräftig wegen einer Straftat gegen das Waffengesetz verurteilt worden, hat eine Straftat i.V.m. einer Waffe begangen, hat gegen die waffenrechtlichen Bestimmungen verstoßen oder ist seine Eignung in Frage zu stellen, so wird der Waffenschein durch die Behörden entzogen. 3. Bei im Bußgeldkatalog markierten StVO verstoßen sind der Führer-, Boots- und Flugschein durch die Behörden zu entziehen. 4. Zusätzlich zu einem Entzug durch Verfügung und ein Gerichtsurteil kann eine Sperrung eines weiteren Lizenzerwerbs für bis zu 14 Tage erfolgen."},
{b:"StPO",p:"§29",t:"Berufsverbot aufgrund Suspendierung",x:"1. Sollte ein Mitarbeiter von einer Behörde unter dringendem Tatverdacht stehen, eine Straftat begangen zu haben, dann darf dieser bis zur Beendigung der Ermittlungen oder des Verfahrens von der Leitung der Behörde, dem Justizministerium oder der Leitung der Korruptionsabteilung des FIB direkt suspendiert werden. 2. Die Suspendierung, sollte sie vom Justizministerium oder der FIB Abteilung ausgestellt werden, muss schriftlich mit einer ausreichenden Begründung der jeweiligen Organisationsleitung vorgelegt werden. 3. Die Suspendierung kann entweder durch die Einstellung des Verfahrens, einen Gerichtsprozess oder eben einer aus der Maßnahme resultierenden Kündigung aufgehoben werden. 4. Eine derartige Maßnahme darf ohne vorliegende Begründung eine Dauer von 72 Stunden nicht überschreiten. 5. Eine Suspendierung endet automatisch a. mit Einstellung des Ermittlungsverfahrens, b. mit Abschluss eines gerichtlichen Verfahrens, c. mit durch eine aus der Maßnahme resultierende rechtswirksame Kündigung. d. oder mit Ablauf der Frist."},
{b:"StPO",p:"§30",t:"Dienstaufsichtsbeschwerden",x:"1. Jeder Bürger hat das Recht, eine Dienstaufsichtsbeschwerde über einen Beamten der entsprechenden Dienststelle aufzugeben. 2. Dienstaufsichtsbeschwerden sind grundsätzlich durch die jeweilige Behörde selbst und intern zu sanktionieren, sofern kein strafbares Handeln gemäß dem StGB vorliegt, andernfalls über das FIB oder der Staatsanwaltschaft. 3. Der Beschwerdeführer (Antragsteller) hat kein Recht auf die Information über Art oder Umfang der Disziplinarmaßnahme oder Strafe gegenüber dem Beschuldigten."},
{b:"StPO",p:"§31",t:"Recht auf Verteidigung",x:"1. Der Beschuldigte kann bis zur Verkündung des Strafmaßes, spätestens jedoch kurz vor dem Eintragen der Straftaten ins Register, einen Rechtsanwalt fordern. 2. Die Beamten sind dazu verpflichtet mindestens fünf Anwälte aus der offiziellen Anwaltsliste anzurufen. 3. In den Fällen der sogenannten “notwendigen Verteidigung” ist dem Beschuldigten ein Pflichtverteidiger von Amts wegen zu bestellen, wenn der Beschuldigte noch über keinen von ihm gewählten Verteidiger verfügt. 4. Alle im Staat lizenzierten freien Rechtsanwälte sind dabei verpflichtet, auf Anruf eines Beamten als Pflichtverteidiger einzuspringen. 5. Rechtsanwälte verhandeln den Zahlbetrag mit ihrem Mandanten selber. Aufgrund dessen ist es dem Rechtsanwalt gestattet, nach der Inhaftierung seinen Mandanten in der Zelle zu besuchen."},
{b:"StPO",p:"§32",t:"Begnadigungsgesuche",x:"1. Begnadigung ist der Erlass, die Umwandlung, die Ermäßigung oder die Aussetzung einer rechtskräftig verhängten Strafe oder Geldbuße bei Ordnungswidrigkeiten. 2. Ein Begnadigungsgesuch ist schriftlich z.Hd. des Gouverneurs zu stellen. 3. Das Recht, Gnade zu gewähren, steht ausnahmslos dem Gouverneur höchstpersönlich zu."},
{b:"StPO",p:"§33",t:"V-Mann Tätigkeiten",x:"1. Höhere Exekutivbeamte können während Ihrer Dienstausübung, in vorheriger Rücksprache mit der jeweiligen Behördenleitung, Mitgliedern von Banden, Gangs, Familien oder krimineller Organisationen anbieten als sog. “V-Mann” (geschlechtsunabhängig) zu agieren. 2. Ein V-Mann gibt dabei sämtliche Arten von Informationen an die jeweilige Ermittlungs- bzw. Exekutivbehörde zur dienstlichen Verwertung weiter. 3. Die Tätigkeit des V-Mannes kann durch die jeweilige Exekutivbehörde für seine Kooperation vergütet werden. Die Höhe der Vergütung darf dabei nicht unverhältnismäßig hoch sein. 4. Im Falle einer Vergütung an den V-Mann ist zwingend und im Voraus die Staatsanwaltschaft in die V-Mann Tätigkeit zu involvieren und ihr sämtliche notwendigen Informationen zur Verfügung zu stellen. 5. Der V-Mann darf durch die jeweilige Behörde niemals anderweitige Vorteile genießen oder besser gestellt und/oder behandelt werden."},
{b:"StPO",p:"§34",t:"Rechtsbelehrung von Beschuldigten",x:"1. Einem Tatverdächtigen sind unverzüglich außerhalb der Gefahr für das Leben, spätestens aber fünf Minuten nach Anlegen der Handschellen die Rechte vorzulesen. 2. Die Rechtsbelehrung hat dabei sinngemäß wie folgt zu lauten: “Sie haben das Recht zu schweigen, alles, was sie sagen, kann und wird vor Gericht gegen sie verwendet. Sie haben das Recht, einen Rechtsanwalt zur Fallklärung hinzuzuziehen. Sollten sie sich keinen Rechtsanwalt leisten können, wird ihnen einer vom Staat gestellt.” 3. Nach der Rechtsverlesung ist der Tatverdächtige zu fragen, ob er diese verstanden hat und muss die Rechtsverlesung als verstanden anerkennen. Sollte er dies nicht nach der ersten Verlesung tun, sind die Rechte ein zweites Mal zu verlesen. Beim zweiten Mal gelten die Rechte automatisch als verstanden und akzeptiert. 4. Bei einer fehlenden Rechts-Belehrung dürfen Aussagen des Tatverdächtigen als Beweismittel erst ab dem Zeitpunkt gewertet werden, zu dem der Beschuldigte über seine Rechte belehrt wurde."},
{b:"StPO",p:"§35",t:"Verfahrens- und Abhandlungsfehler",x:"liegen vor, wenn: 1. Die Handschellenzeiten nicht bekannt oder nicht eingehalten worden sind (Kulanz 1 Minute) 2. Einem Tatverdächtigen seine Rechte verwehrt worden sind. Unter Rechte verwehrt fällt: a) Die Rechtsbelehrung nach §34 StPO wurde nicht rechtzeitig oder sinngemäß verlesen b) Verweigerung von Rechtsanwälten nach §31 StPO 3. Einem Tatverdächtigen wurde auf Anfrage sein Verhaftungsgrund nicht genannt . 4. Kein Datum, Uhrzeit, Paragrafen sowie Gesetzesbuchkürzel in der Akte vermerkt sind 5. Eine falsche Bestrafung gem. aktuellem Bußgeldkatalog erfolgt ist ( Ausnahmen, hierzu regelt StPO §3 Absatz 3) 6. Falsch ist eine Bestrafung, wenn die Höhe des Strafmaßes vom aktuell gültigen Bußgeldkatalog abweicht, die Ausschließung von Paragraphen nach diesem nicht eingehalten wurden, oder Strafen als Voraussetzung für sog. Qualifikationsdelikte (z.B. benötigt ein schweres Dienstvergehen eine Grundtat) nicht aufgeführt worden sind In den o.g. Fällen ist der Beschuldigte freizusprechen und freizulassen. Das Vorliegen eines Verfahrens- oder Abhandlungsfehlers muss durch einen Rechtsanwalt in Form einer Revision angezeigt werden. Die abhandelnde Exekutivbehörde kann mündlich bei der Justiz durch ihre Leitung ebenfalls einen von ihnen Begangenen Abhandlungsfehler zur Revision melden. Das Vorliegen eines Verfahrens- oder Abhandlungsfehlers darf ebenfalls mündlich im SG in Form eines Schnellverfahrens angezeigt werden."},
{b:"StPO",p:"§36",t:"Rechte eines Rechtsanwalts",x:"1. Ein Anwalt hat das Recht, Beweise gegen den Angeklagten einzusehen sowie ein generelles Akteneinsichtsrecht. Sein Antrag kann nicht abgelehnt werden, sofern es sich um keine Ermittlungsakten handelt. 2. Rechtsanwälte haben straffrei zu handeln, s. Art. 13 III. SVerfG. 3. Rechtsanwälte haben das Recht, einen Inhaftierten zu besuchen, s. Art. 13 IV. SVerfG."},
{b:"StPO",p:"§37",t:"Beweisführung und Ermittlung",x:"1. Strafrechtliche Ermittlungen werden eigenständig durch Beamte des LSPD, SAHP, FIB und der Staatsanwaltschaft oder auf dessen Anweisung durchgeführt. 2. Während des Ermittlungsverfahrens einer Behörde dürfen Mitarbeiter des Justizministeriums an den Ermittlungen selbst mit ausreichender Begründung Teilnehmen und insbesondere an Durchsuchungen, Razzien, Personensuchen usw. Teilnehmen. 3. Erlangt ein Beamter Informationen, die strafrechtlich relevant sind, so ist er dazu verpflichtet, diese Info an das Justizministerium oder seine Vorgesetzten weiterzuleiten. Diese kümmern sich um die Weiterleitung an die jeweilige Behörde, die ein Ermittlungsverfahren einleitet. 4. Bei angewiesenen Ermittlungen seitens der Justiz ist die ermittelnde Behörde verpflichtet, die Justiz selbstständig über den Ermittlungsstand zu informieren und ist an deren Weisung gebunden. 5. Zur Klärung der Beweislage, sind alle rechtlich geregelten Ermittlungsmaßnahmen zulässig. Als Beweise sind hierbei alle zur Überführung des Täters nützlichen Informationen zu werten, wie beispielsweise Zeugenaussagen, Geständnisse, als auch tatsächliche Beweismittel. 6. Beweismittel, die ohne Beschluss in Widerspruch zu Art. 5 SVerfG stehen (z.B. Aufnahmen von Drohnen, die sich über Privatgelände befinden) sind unzulässig. 7. Bei einem dringenden Tatverdacht und/oder einer besonderen Bedeutung der potentiellen Aussage eines Zeugen und/oder Tatverdächtigen, kann ein vorläufiger Haftbefehl durch einen Richter ausgestellt werden. 8. Bei der Strafakte \"Das größte Verbrechen\" ist die Aktenlage eindeutig und kann nicht angefochten werden. § Revision"},
{b:"StPO",p:"§38",t:"Anwendbarkeit der Revision",x:"Gegen die Urteile des Bezirksgerichts sowie polizeiliche Urteile ist die Revision zulässig. Ausgenommen davon sind Urteile des Obersten Gerichtshofes."},
{b:"StPO",p:"§39",t:"Revisionsgründe",x:"1. Die Revision kann nur darauf gestützt werden, dass das Urteil auf einer Verletzung des Gesetzes beruhe, inklusive Form- und Fristvorgaben der StPO (Verfahrens- bzw. Abhandlungsfehler). 2. Das Gesetz ist verletzt, wenn eine Rechtsnorm nicht oder nicht richtig angewendet worden ist."},
{b:"StPO",p:"§40",t:"Absolute Revisionsgründe",x:"1. Ein Urteil ist stets als auf einer Verletzung des Gesetzes beruhend anzusehen, 2. wenn bei dem Urteil ein Richter mitgewirkt hat, der von der Ausübung des Richteramtes kraft Gesetzes ausgeschlossen war oder 3. wenn bei dem Urteil ein Richter mitgewirkt hat, nachdem er wegen Besorgnis der Befangenheit abgelehnt war oder 4. Ausgenommen hiervon ist der Justizminister und dessen Vertretung, die die Akten an die Staatsanwälte weitergibt, und dadurch als nicht befangen anzusehen ist."},
{b:"StPO",p:"§41",t:"Form und Frist",x:"1. Die Revision muss binnen 72 Stunden ab dem Folgetag des Urteils schriftlich eingelegt werden. 2. Eine Revision muss eine gültige Unterschrift, wichtige fallspezifische Informationen (bspw. Name der abhandelnden Beamten + Organisation) und ein Aktenzeichen in der Akte beinhalten und dies nach folgender Vorlage: A-RA-NN-YYYY-XX. Das erste A steht für den fortlaufenden Wert, der alle 99 Zeichen erhöht wird, RA steht für die Art, im Falle Revisionsantrag, das NN steht für die Personenkennung des Rechtsanwalt (erster Buchstabe vor- sowie erster Buchstabe Nachname). YYYY steht für das aktuelle Jahr, XX steht für die Anzahl der bearbeiteten Dokumente der Person. 3. Der Verfasser der Revision muss darlegen, inwieweit die Revision eingereicht und begründet ist. Beweise müssen dabei in der Revision vorhanden sein und die exakte Begründetheit der Revision nachweisen."},
{b:"StPO",p:"§43",t:"Verspätete oder formwidrige Einlegung",x:"1. Wird die Revision nicht frist- und formgerecht (s. §41 ) eingereicht, so gilt diese als gegenstandslos. 2. Bei einen nicht formgerechten Revision bekommt der Beschuldigte eine einmalige Verlängerung von weiteren 48 Stunden, um eine formgerechte Revision einzureichen."},
{b:"StPO",p:"§44",t:"Gang der Revisionshauptverhandlung",x:"1. Bei frist- und formgerechten Revisionsantrag, wird ein Revisionsverhandlungstermin anberaumt. Die erneute Ladung der Staatsanwaltschaft, sowie des Verteidigers und des Angeklagten obliegt dem Revisionsrichter. Wird kein Revisionsverhandlungstermin anberaumt, so erfolgt die Prüfung der Stellungnahme und Revision schriftlich. 2. Die Hauptverhandlung beginnt mit dem Vortrag des Revisionsgrundes durch den Antragsteller. 3. Hierauf werden die Staatsanwaltschaft sowie der Angeklagte und sein Verteidiger mit ihren Ausführungen und Anträgen, und zwar der Beschwerdeführer zuerst, gehört."},
{b:"StPO",p:"§45",t:"Aufhebung des Urteils",x:"Soweit die Revision für begründet erachtet wird, ist das angefochtene Urteil aufzuheben. Gleichzeitig sind die dem Urteil zugrunde liegenden Feststellungen aufzuheben, sofern sie durch die Gesetzesverletzung betroffen werden, wegen deren das Urteil aufgehoben wird sowie eine Entschädigung gem. §23 StPO zu entrichten."},
{b:"StPO",p:"§46",t:"Urteilsverkündung",x:"Die Verkündung des Urteils erfolgt nach Maßgabe des §78 . § Verfahrenstechnische Bestimmungen"},
{b:"StPO",p:"§47",t:"Befugnisse des vorsitzenden Richters",x:"1. Der Richter hat das Hausrecht im Gericht. 2. Der Richter ist der Leiter der Verhandlung. 3. Er darf Personen des Saales verweisen, die den Ablauf des Verfahrens stören. 4. Der Richter darf zusätzliche Zeugen laden, die er für den Verlauf des Verfahrens für nötig hält. 5. Der Richter kann ein Ordnungsgeld verhängen, wenn eine Person sich nicht angemessen verhält. Ein einzelnes Ordnungsgeld darf maximal $100.000 betragen. 6. Ordnungsgelder können kumulativ verhängt werden. 7. Ordnungsgelder sind direkt vor Ort zu begleichen."},
{b:"StPO",p:"§48",t:"Öffentlichkeit von Gerichtsprozessen",x:"1. Gerichtsprozesse sind generell öffentlich, sofern diese nicht durch den vorsitzenden Richter ausdrücklich als “nicht öffentlich” bestimmt sind oder werden. 2. Gerichtsprozesse können nur als “nicht öffentlich” bestimmt werden, sofern 3. Minderjährige, 4. Mitarbeiter der Behörden deren Identität geheim zu halten ist oder 5. Beteiligte eines Zeugenschutzprogramms von dem Gerichtsprozess betroffen sind."},
{b:"StPO",p:"§49",t:"Ausschluss eines Richters",x:"Ein Richter ist von der Ausübung des Richteramtes kraft Gesetzes ausgeschlossen wenn: 1. er selbst der Geschädigte durch die Straftat ist oder 2. wenn er mit einer der beiden Parteien verwandt oder verschwägert ist bzw. war oder 3. wenn er in der Sache als Zeuge oder Sachverständiger vernommen wird. Wegen Besorgnis der Befangenheit findet die Ablehnung statt, wenn ein Grund vorliegt, der geeignet ist, Misstrauen gegen die Unparteilichkeit eines Richters zu rechtfertigen. Das Ablehnungsrecht steht dem Verteidigenden zu. Über die Zulassung der Ablehnung, und über die damit verbundenen Beweismittel, entscheidet nach Möglichkeit ein zweiter Richter; nur ansonsten die Staatsanwaltschaft. Der Beschluss, durch den die Ablehnung für begründet erklärt wird, ist nicht anfechtbar."},
{b:"StPO",p:"§50",t:"Zustellungen",x:"1. Die Zustellung von Entscheidungen und sonstigem Schriftverkehr ordnet der vorsitzende Richter an. Das Sekretariat des Justizministeriums ist dafür verantwortlich, die Zustellung umzusetzen. 2. Entscheidungen, die der Vollstreckung bedürfen, sind der Staatsanwaltschaft zu übergeben, die das Erforderliche veranlasst. Dies gilt nicht für Entscheidungen, welche die Ordnung in der Gerichtsverhandlung betreffen. 3. Das Absenden von Ladungen und Schriftstücken gelten zum selben Zeitpunkt des Absendens als zugestellt."},
{b:"StPO",p:"§51",t:"Zustellungsverfahren",x:"Zustellungen werden dem Adressaten via Verteiler (OOC: Discord) übermittelt, sofern die Kontaktdaten bekannt sind."},
{b:"StPO",p:"§52",t:"Ladung",x:"1. Der Termin zur Hauptverhandlung wird vom vorsitzenden Richter in Absprache mit Kläger und Verteidiger Seite besprochen. 2. Die Verteidigung und die Staatsanwaltschaft haben die Befugnis, ihre Zeugen und Sachverständige selbst zu laden 3. Zwischen der Zustellung der Ladung und der Hauptverhandlung muss eine Frist von mindestens 24 Stunden liegen.. 4. Die Verteidigung und die Staatsanwaltschaft haben dem vorsitzenden Richter eine verbindliche Liste ihrer geladenen Zeugen und Sachverständigen spätestens drei Stunden vor Beginn des Verfahrens schriftlich vorzulegen. Diese Liste ist durch den Vorsitzenden Richter der jeweils anderen Partei mindestens zwei Stunden vor Prozessbeginn offenzulegen. 5. Eine nachträgliche Ladung von Zeugen nach Beginn des Verfahrens ist unzulässig. Ausnahmen anzuordnen obliegt dem vorsitzenden Richter. 6. Sollte eine Person ihrer Ladung nicht nachkommen, darf sie exekutiv mit Suchwanteds gesucht werden und macht sich ohne Abmeldung der Behinderung von Ermittlungsverfahren strafbar, mit Ausnahme, sie kann ihr fernbleiben entschuldigen. 7. Aufgrund einer Vorladung ist jeder verpflichtet, zu dem genannten Termin zu erscheinen oder sich spätestens 24 Stunden vorher abzumelden. 8."},
{b:"StPO",p:"§53",t:"Berechnung von Fristen",x:"1. Bei der Berechnung einer Frist, die nach Tagen bestimmt ist, wird der Tag nicht mitgerechnet, auf den der Zeitpunkt oder das Ereignis fällt, nachdem der Anfang der Frist sich richten soll. 2. Eine Frist, die nach Wochen oder Monaten bestimmt ist, endet mit Ablauf des Tages der letzten Woche oder des letzten Monats, der durch seine Benennung oder Zahl dem Tag entspricht, an dem die Frist begonnen hat; fehlt dieser Tag in dem letzten Monat, so endet die Frist mit dem Ablauf des letzten Tages dieses Monats."},
{b:"StPO",p:"§54",t:"Wiedereinsetzung bei Fristversäumung",x:"Das Versäumnis muss vor dem Richter ausreichend entschuldigt werden. War jemand verhindert ohne Schuld an seinem Verhindern zu tragen, so gilt das Versäumnis als entschuldigt. Sollte das Versäumnis nicht ausreichend entschuldigt worden sein, gilt dies als Behinderung der Ermittlungsverfahren. Nach der Klärung des Versäumnisses wird ein neuer Termin ausgemacht."},
{b:"StPO",p:"§55",t:"Pflichten der Zeugen",x:"Wiedereinsetzung bei Fristversäumung 1. Zeugen sind verpflichtet, zu dem zu ihrer Vernehmung bestimmten Termin, vor dem Richter zu erscheinen. Sie haben die Pflicht auszusagen, wenn keine im Gesetz zugelassene Ausnahme vorliegt. 2. Die Ladung der Zeugen muss einen Hinweis enthalten, der den Zeugen, in seinem Interesse, über die möglichen rechtlichen Konsequenzen des Fernbleibens belehrt."},
