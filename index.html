{b:"StVO",p:"§9",t:"Halten und Parken",x:"Das Halten und Parken ist unzulässig: 1. an engen und an unübersichtlichen Straßenstellen, 2. im Bereich von scharfen Kurven, 3. auf Einfädelungs- und auf Ausfädelungsstreifen, 4. auf Bahnübergängen, 5. vor und in amtlich gekennzeichneten Feuerwehrzufahrten, 6. an rot gekennzeichneten Bürgersteigen, 7. vor und hinter Kreuzungen und Einmündungen bis zu je 5,00 m von den Schnittpunkten der Fahrbahnkanten, 8. gegen die Fahrbahn sowie Fahrbahnrichtung, 9. bei der Nutzung von mehreren Parkflächen gleichzeitig, 10. auf Behindertenparkplätzen ohne Behindertenausweis, 11. mit mindestens drei Reifen auf dem Bürgersteig, 12. auf privatem und gepachtetem Haus- sowie Unternehmensgrund (muss klar erkennbar und/oder abgegrenzt sein), ausgenommen ist das eigene Grundstück, 13. den Verkehr oder die Bevölkerung allgemein akut gefährdend, 15. oder auf Highways oder Freeways. 16. Wer länger als drei Minuten hält oder sich vom Fahrzeug entfernt, der parkt. 17. Zum Parken und Halten ist der rechte Seitenstreifen zu benutzen. Dazu gehören auch entlang der Fahrbahn angelegte Parkstreifen, wenn diese dazu ausreichend befestigt sind. Ansonsten ist an den rechten Fahrbahnrand heranzufahren. Beim Halten muss nicht zwingend auf einem Parkstreifen gehalten werden. 18. Sollte ein Fahrzeug gemäß § 9 StVO falsch geparkt sein, so kann die Exekutive eine Abschleppung des Fahrzeuges anordnen. Die Kosten hierfür können sich auf bis zu 20.000 $ belaufen. 19. Falschparker gemäß §9 Nr. 13 müssen durch den Mieter/Eigentümer des Grundstückes angezeigt und die Abschleppung angefordert werden. 20. Ausnahme zu §9 StVO bilden Fahrzeuge staatlicher Behörden mit aktiven Sondersignalen (Blaulicht)."},
{b:"StVO",p:"§10",t:"Entziehung der Fahrerlaubnis",x:"Erweist sich jemand als ungeeignet oder nicht befähigt zum Führen von Kraft-, Wasser-, oder Luftfahrzeugen, so kann ihm die Fahrerlaubnis gem. §28 II StPO entzogen werden, wenn eine der folgenden Voraussetzungen gegeben ist: 1. ein max. Promillewert von 0.0 wird überschritten, 2. Rückstände im Körper von Betäubungs- und/oder Berauschungsmitteln, 3. an einem verbotenen Kraftfahrzeugrennen wird teilgenommen, 4. wer sich unerlaubt vom Unfallort entfernt, obwohl der Verursacher weiß oder wissen kann, dass bei dem Unfall ein Mensch getötet wurde, nicht unerheblich verletzt worden ist oder an fremden Sachen bedeutender Schaden entstanden ist, 5. der Straftatbestand des gefährlichen Eingriffs in den Straßenverkehr vorliegt oder 6. eine Geschwindigkeitsüberschreitung von mehr als 200 km/h vorliegt."},
{b:"StVO",p:"§11",t:"Verhalten bei Verkehrsunfällen",x:"1. Wer an einem Verkehrsunfall beteiligt ist, hat unverzüglich zu halten und 2. bei geringfügigem Schaden an den Straßenrand zu fahren, 3. sich über die Unfallfolgen zu vergewissern, 4. den Verletzten zu helfen, 5. solange am Unfallort zu bleiben, bis zugunsten der anderen Beteiligten und Geschädigten die Feststellung der Person, der Fahrzeuge und der Art der Beteiligung durch eigene Anwesenheit ermöglicht wurde oder entsprechende Behörden einem die Weiterfahrt gewähren."},
{b:"StVO",p:"§12",t:"Halterhaftung",x:"1. Der Halter eines Fahrzeuges ist für sämtliche gesetzeswidrigen Tätigkeiten verantwortlich, welche mit dem Fahrzeug begangen werden. 2. Sollte das Fahrzeug verliehen oder gestohlen worden sein und der Fahrer ist eindeutig feststellbar, ist dieser entgegen § 12 Abs. 1 zur Rechenschaft zu ziehen."},
{b:"StVO",p:"§13",t:"Landung von Flugzeugen und Helikoptern",x:"1. Fluggeräte, insbesondere Flugzeuge und Helikopter jeder Bauart, sind ausschließlich auf dafür gekennzeichneten Flächen und/oder Landebahnen zu landen, sowie ausschließlich auf dafür gesperrten und Dritte nicht gefährdenden Flächen abzustellen und/oder zu parken. 2. Ebenfalls dürfen diese auf der Strandseite des Strandmarktes sowie auf Privatgrundstücken abgestellt werden. 3. Die Missachtung wird gemäß einem gefährlichen Eingriff in den Straßenverkehr geahndet. 4. Ausgenommen hiervon ist die Regierung, sowie sich im Einsatz befindliche Einheiten der Exekutivbehörden innerhalb ihrer dienstlichen Tätigkeiten."},
{b:"StVO",p:"§14",t:"Verkehrskontrollen",x:"1. Staatliche Behörden dürfen innerhalb ihres Zuständigkeitsbereiches allgemeine Verkehrskontrollen im öffentlichen Straßenverkehr bei jedem Verkehrsteilnehmer durchführen. Es handelt sich hierbei um eine präventive Maßnahme im Sinne der Sicherheit des Straßenverkehrs. 2. Kontrolliert werden dürfen hierbei die Lizenz des Fahrers, das Mitführen eines Reparatursatzes sowie Verbandskastens, als auch eine allgemeine Kontrolle der Personalien aller Insassen. 3. Ergibt sich im Laufe des Gesprächs ein dringender Tatverdacht, so sind die Beamten berechtigt, den Kofferraum sowie sämtliche Personen und ihre Taschen auf illegale Gegenstände zu kontrollieren."},
{b:"StVO",p:"§15",t:"Anti-Radar-Geräte",x:"1. Beschlagnahme von Fahrzeugen: Fahrzeuge, die über ein verbautes sogenanntes Anti-Radar verfügen, können beschlagnahmt und in die Verwahrstelle überführt werden. 2. Nutzungseinschränkung: Nach Auslösung aus der Verwahrstelle dürfen die Fahrzeuge bis zur Deaktivierung oder dem Ausbau des Anti-Radars nicht im Straßenverkehr eingesetzt werden. 3. Gewerbliche Nutzung: Die Nutzung von Anti-Radar-Geräten in gewerblichen Fahrzeugen, wie z. B. im Carsharing, wird mit einer deutlich höheren Geldstrafe geahndet. Bei Verstößen wird eine Geldbuße von mindestens 200.000 $ verhängt."},
{b:"StVO",p:"§16",t:"Missachtung polizeilicher Stopp-Anforderungen",x:"Sollte das Streifenfahrzeug eine nonverbale oder verbale Stopp-Anforderung für eine allgemeine Verkehrskontrolle zusenden, so ist dieser Folge zu leisten. Die Stopp-Anforderungen müssen begründet sein. Widerstand und Flucht sind strafbar."},
{b:"BGB",p:"§1",t:"Personen- und Sachbegriffe",x:"Behörden iSd BGB sind: 1. GOV (Bundesbehörde, Government of San Andreas), 2. FIB (Bundesbehörde, Federal Investigation Bureau), 3. LSPD (Los Santos Police Department), 4. SAHP (San Andreas Highway Patrol), 5. NG (Nationalgarde), 6. EMS (Emergency Services). Mitarbeiter der o.g. Behörden sind Amtsträger (Beamte). Staatliche Einrichtungen iSd BGB sind: 1. Alle Regierungsgebäude, 2. Alle Polizeistationen, 3. Alle Krankenhäuser, 4. Das Fort Zancudo."},
{b:"BGB",p:"§2",t:"Wohnsitz",x:"1. Wer sich an einem Ort ständig niederlässt oder aufhält, begründet an diesem Ort seinen Wohnsitz, dieser Wohnsitz darf kein öffentliches oder staatliches Gebäude sein. 2. Der Wohnsitz kann gleichzeitig an mehreren Orten bestehen."},
{b:"BGB",p:"§3",t:"Namensrecht",x:"1. Wird das Recht zum Gebrauch eines Namens dem Berechtigten von einem anderen bestritten oder wird das Interesse des Berechtigten dadurch verletzt, dass ein anderer unbefugt den gleichen Namen gebraucht, so kann der Berechtigte von dem anderen Beseitigung der Beeinträchtigung verlangen. Sind weitere Beeinträchtigungen zu besorgen, so kann er auf Unterlassung klagen. 2. Über die Unzulässigkeit entscheidet ausschließlich ein Gericht."},
{b:"BGB",p:"§4",t:"Tiere",x:"sind keine Sachen. Sie werden durch besondere Gesetze geschützt. Auf sie sind die für Sachen geltenden Vorschriften entsprechend anzuwenden, soweit nicht etwas anderes bestimmt ist."},
{b:"BGB",p:"§5",t:"Geschäftsfähigkeit",x:"1. Geschäftsfähig ist, wer die erste Visum Stufe vollendet hat und daher die Fähigkeit besitzt, rechtsgültige Verträge abzuschließen. 2. Personen, die die Geschäftsfähigkeit aufgrund eines Gerichtsurteils oder einer gerichtlichen Entscheidung verloren haben, sind nicht geschäftsfähig. 3. Geschäftsunfähig sind auch Personen, die aufgrund geistiger Krankheit oder körperlicher Gebrechen dauerhaft nicht in der Lage sind, die Bedeutung und Tragweite ihrer Handlungen zu verstehen."},
{b:"BGB",p:"§6",t:"Anfechtbarkeit wegen Irrtums",x:"Wer bei der Abgabe einer Willenserklärung über deren Inhalt im Irrtum war oder eine Erklärung dieses Inhalts überhaupt nicht abgeben wollte, kann die Erklärung anfechten, wenn anzunehmen ist, dass er sie bei Kenntnis der Sachlage und bei verständiger Würdigung des Falles nicht abgegeben haben würde."},
{b:"BGB",p:"§7",t:"Sittenwidrigkeit eines Rechtsgeschäfts",x:"1. Ein Rechtsgeschäft, das gegen die guten Sitten verstößt, ist nichtig. 2. Nichtig ist insbesondere ein Rechtsgeschäft, durch das jemand unter Ausbeutung der Zwangslage, der Unerfahrenheit, des Mangels an Urteilsvermögen oder der erheblichen Willensschwäche eines anderen sich oder einem Dritten versprechen oder gewähren lässt."},
{b:"BGB",p:"§8",t:"Vertretungsvollmacht",x:"1. Vollmachten zur Vertretung in rechtsgeschäftlichen Angelegenheiten können von natürlichen Personen oder juristischen Personen des Privatrechts ausgestellt werden. 2. Die Vollmacht muss schriftlich verfasst sein und die genauen Befugnisse des Bevollmächtigten klar definieren. 3. Die Ausstellung von Vertretungsvollmachten kann in Form eines notariell beglaubigten Dokuments oder durch einfache Schriftform erfolgen. 4. Der Aussteller der Vollmacht behält das Recht, die Vollmacht jederzeit zu widerrufen, sofern der Widerruf dem Bevollmächtigten rechtzeitig und in angemessener Form mitgeteilt wird."},
{b:"BGB",p:"§9",t:"Kaufvertrag",x:"1. Durch den Kaufvertrag wird der Verkäufer einer Sache verpflichtet, dem Käufer die Sache zu übergeben und das Eigentum an der Sache zu verschaffen. Der Verkäufer hat dem Käufer die Sache frei von Sach- und Rechtsmängeln zu verschaffen. 2. Der Käufer ist verpflichtet, dem Verkäufer den vereinbarten Kaufpreis zu zahlen und die gekaufte Sache abzunehmen. 3. Ein Kaufvertrag kann formlos abgeschlossen werden und ist gültig, wenn sich die Parteien über den Kaufgegenstand und den Kaufpreis einig sind. 4. Der Kaufvertrag kann mündlich, schriftlich oder durch konkludentes Verhalten abgeschlossen werden. 5. Bei Abschluss eines Kaufvertrags in schriftlicher Form sind die wesentlichen Vertragsbedingungen, einschließlich des Kaufgegenstands, des Kaufpreises, der Zahlungsmodalitäten und der Lieferbedingungen, klar und deutlich festzuhalten. 6. Ein mündlich abgeschlossener Kaufvertrag ist gültig, sofern die Parteien einig sind und die Kaufsache sofort übergeben und übernommen wird. 7. Konkludentes Verhalten kann als Abschluss eines Kaufvertrags interpretiert werden, wenn die Parteien durch ihre Handlungen eindeutig ihre Zustimmung zum Vertragsabschluss zum Ausdruck bringen, wie beispielsweise durch die Übergabe der Kaufsache und die Zahlung des Kaufpreises."},
{b:"BGB",p:"§10",t:"Mietvertrag",x:"1. Durch den Mietvertrag wird der Vermieter verpflichtet, dem Mieter den Gebrauch der Mietsache während der Mietzeit zu gewähren. Der Vermieter hat die Mietsache dem Mieter in einem zum vertragsgemäßen Gebrauch geeigneten Zustand zu überlassen und sie während der Mietzeit in diesem Zustand zu erhalten. Er hat die auf der Mietsache ruhenden Lasten zu tragen. 2. Der Mieter ist verpflichtet, dem Vermieter die vereinbarte Miete zu entrichten."},
{b:"BGB",p:"§11",t:"Gründung von Unternehmen und Büros",x:"1. Natürliche Personen und juristische Personen des Privatrechts haben das uneingeschränkte Recht, ein Unternehmen zu gründen, unabhängig von ihrer Staatsangehörigkeit, ihrem Wohnsitz oder ihrem Rechtsstatus. 2. Die Gründung eines Unternehmens oder Büros muss, sofern Umsatz erwirtschaftet wird, bei der Regierung beantragt bzw. angemeldet werden. 3. Die Beantragung bzw. Anmeldung hat schriftlich zu erfolgen. 4. Die Gründer eines Unternehmens sind für die Einhaltung der geltenden Gesetze und Vorschriften verantwortlich, insbesondere in Bezug auf Steuern, Arbeitsrecht und Unternehmensregistrierung. 5. Die Gründung eines Unternehmens kann von staatlicher Seite unterstützt und gefördert werden, um unternehmerische Initiative, Innovation und wirtschaftliches Wachstum zu fördern."},
{b:"BGB",p:"§12",t:"Eintragung von Marken und Rechten",x:"1. Natürliche Personen und juristische Personen des Privatrechts haben das Recht, ihre Markenrechte und andere schützenswerte geistige Eigentumsrechte bei der Regierung verbindlich eintragen zu lassen. 2. Die Eintragung kann für verschiedene Arten von Schutzrechten erfolgen, einschließlich, jedoch nicht beschränkt auf Marken, Patente, Urheberrechte, Designs, Geschmacksmuster und Handelsnamen."},

function migrate(d){
  if(!Array.isArray(d.werbung)) d.werbung=[];
  if(!Array.isArray(d.tasks)) d.tasks=[];
  d.settings=Object.assign({ravo:{}},d.settings||{});
  delete d.settings.discord;          /* fruehere Online-Anmeldung */
  d.settings.ravo=d.settings.ravo||{};
  d.tpl=d.tpl&&typeof d.tpl==="object"?d.tpl:{};
  /* frühere Kanzlei mit mehreren Anwälten: der aktive wird zum Profil */
  if(Array.isArray(d.lawyers)&&d.lawyers.length&&!(d.profile&&d.profile.name)){
    const akt=d.lawyers.find(l=>l.id===d.activeLawyer)||d.lawyers[0];
    d.profile={name:akt.name||"",phone:akt.phone||"",pass:akt.pass||"",kanzlei:akt.kanzlei||"",orga:akt.orga||""};
  }
  d.profile=Object.assign({name:"",phone:"",pass:"",kanzlei:"",orga:""},d.profile||{});
  delete d.lawyers; delete d.activeLawyer;
  /* Anträge auf Familienlizenz werden zu Schriftsätzen */
  d.docs=Array.isArray(d.docs)?d.docs:[];
  if(Array.isArray(d.licenses)&&d.licenses.length){
    d.licenses.forEach(l=>d.docs.push(Object.assign({},l,{type:"familie",signLawyer:l.signLawyer!==false})));
    delete d.licenses;
  }
  d.docs.forEach(x=>{ x.status=x.status||"entwurf"; x.fee=Number(x.fee)||0;
    x.type=x.type||"akte"; delete x.lawyerId;
    if(!Array.isArray(x.posten)) x.posten=[]; });
  (d.cases||[]).forEach(c=>{
    ["demand","final"].forEach(k=>{
      c[k]=c[k]||{};
      if(c[k].stars===undefined) c[k].stars=c[k].months||0;
      if(c[k].fine===undefined) c[k].fine=0;
      delete c[k].months;
    });
    c.charges=c.charges||[]; c.officers=c.officers||[];
    delete c.lawyerId;
    c.procedure=c.procedure||"polizei";
    if(c.procedure==="schnell") c.procedure="polizei";   /* fruehere eigene Verfahrensart */
    c.errors=c.errors||{};
    c.revision=c.revision||{filed:false,ref:"",result:""};
    /* altes Einzelfeld "fee" in eine RAVO-Position überführen */
    if(!Array.isArray(c.fees)){
      c.fees = c.fee ? [{id:uid(),type:"beratung",qty:1,amount:Number(c.fee)||0,paid:true,
                         date:c.date||"",desc:"übernommen aus früherer Version"}] : [];
    }
    delete c.fee;
  });
  /* die frühere Ingame-ID ist die Reisepassnummer */
  (d.clients||[]).forEach(c=>{ if(!c.pass&&c.gid) c.pass=c.gid; delete c.gid; });
  return d;
}

}

/* --- Strafmaß nach §7 StGB / §3 StPO: höchste Einzelstrafe, keine Summe --- */
/* Wie sich das Strafmaß bei mehreren Delikten bestimmt.
   Vorgabe ist §3 VII StPO: maßgeblich ist der schwerwiegendste Einzeltatbestand
   mit seinen eigenen Werten. Die StPO geht dem StGB nach §2 SVerfG vor.       */
const STRAFREGELN={
  schwerster:{lbl:"Schwerster Einzeltatbestand",ref:"§3 VII StPO",
    hint:"Es zählt ein Delikt – das mit der höchsten Haftstrafe – mit seinem eigenen Bußgeld."},
  getrennt:{lbl:"Höchstwerte getrennt",ref:"§7 StGB wörtlich",
    hint:"Höchstes Bußgeld und höchste Haftstrafe, auch aus verschiedenen Delikten."},
  summe:{lbl:"Alles addieren",ref:"vom Regelwerk nicht gedeckt",
    hint:"Nur einstellen, wenn die Behörden auf dem Server tatsächlich so rechnen."}
};
const strafRegel=()=>(DB.settings&&STRAFREGELN[DB.settings.strafmass])?DB.settings.strafmass:"schwerster";

function catSum(charges){
  const hits=(charges||[]).map(catFind).filter(Boolean);
  const unknown=(charges||[]).filter(c=>!catFind(c));
  const r={hits,unknown,fine:0,stars:0,sumFine:0,sumStars:0,maxFine:0,maxStars:0,top:null,
           regel:strafRegel(),fib:0,sta:0,bail:hits.length>0,conflicts:[],notes:[],owi:true};
  hits.forEach(h=>{
    r.maxFine=Math.max(r.maxFine,h.fine);
    r.maxStars=Math.max(r.maxStars,h.stars);
    r.sumFine+=h.fine; r.sumStars+=h.stars;
    /* schwerster Tatbestand: erst nach Hafteinheiten, bei Gleichstand nach Bußgeld */
    if(!r.top||h.stars>r.top.stars||(h.stars===r.top.stars&&h.fine>r.top.fine)) r.top=h;
    if(h.fib) r.fib++; if(h.sta) r.sta++;
    if(!h.bail) r.bail=false;
    if(h.stars>0) r.owi=false;               /* §3 V StPO: OWi ohne Haft    */
    if(h.note) r.notes.push(h.b+" "+h.p+": "+h.note);
  });
  if(r.regel==="summe"){ r.fine=r.sumFine; r.stars=r.sumStars; }
  else if(r.regel==="getrennt"){ r.fine=r.maxFine; r.stars=r.maxStars; }
  else if(r.top){ r.fine=r.top.fine; r.stars=r.top.stars; }
  hits.forEach(a=>exRefs(a).forEach(x=>{
    const other=hits.find(h=>h!==a&&h.b===x.book&&h.p.replace(/\s*\(\d\)/,"")===x.num);
    if(other&&!r.conflicts.some(c=>c.includes(other.p)&&c.includes(a.p)))
      r.conflicts.push(a.b+" "+a.p+" ("+a.t+") ↔ "+other.b+" "+other.p+" ("+other.t+")");
  }));
  /* §22 StGB ist Qualifikationsdelikt und braucht eine Grundtat */
  r.qualifOhneGrundtat = hits.some(h=>h.b==="StGB"&&h.p==="§22") && hits.length<2;
  /* §22 III StPO: ab 4 Hafteinheiten keine Kaution */
  r.bailByStars = r.stars<=KAUTION_MAX_HE;
  r.kaution = r.bailByStars ? r.stars*WANTED_WERT*KAUTION_FAKTOR : 0;
  return r;
}
/* Ersatzfreiheitsstrafe §3 VI StPO: je angefangene 20.000 $ = 1 Hafteinheit */
const ersatzHaft=fine=>Math.ceil(Math.max(0,Number(fine)||0)/WANTED_WERT);
/* Entschädigung §23 V StPO */
const entschaedigung=c=>(c.final?.stars||0)*ENTSCHAEDIGUNG_JE_HE+(c.final?.fine||0)+feeTotal(c);

/* --- RAVO §4: Höchstbetrag einer Leistungsposition --- */
/* Höchstsatz einer Leistung – eigene Werte aus den Einstellungen gehen vor (§4 IV RAVO) */
function ravoMaxOf(type){
  const r=RAVO[type]; if(!r) return 0;
  const own=DB.settings&&DB.settings.ravo?DB.settings.ravo[type]:undefined;
  return (own===undefined||own===null||own==="")?r.max:Number(own);
}
function ravoMax(type,qty){
  const r=RAVO[type]; if(!r) return 0;
  const max=ravoMaxOf(type);
  return r.per ? max*Math.max(1,Math.ceil(Number(qty)||1)) : max;
}

/* --- Fehlerprüfung §35 StPO: automatisch erkannte Punkte --- */
function autoErrors(c){
  const r=catSum(c.charges), out={};
  const fs=c.final?.stars||0, ff=c.final?.fine||0;
  if(r.hits.length && (fs>r.stars || ff>r.fine))
    out.penalty="Verhängt wurden "+fs+" ⭐ / "+money(ff)+", zulässig sind nach "+STRAFREGELN[r.regel].ref+" höchstens "+
      r.stars+" ⭐ / "+money(r.fine)+(r.top&&r.regel==="schwerster"?" (maßgeblich: "+r.top.b+" "+r.top.p+" "+r.top.t+")":"")+".";
  if(r.conflicts.length)
    out.penalty=(out.penalty?out.penalty+" ":"")+"Ausschlussparagraphen missachtet: "+r.conflicts.join("; ")+".";
  if(r.qualifOhneGrundtat)
    out.qualif="§22 StGB ist als Qualifikationsdelikt ohne aufgeführte Grundtat angeklagt.";
  const m=cuffMinutes(c);
  if(m!==null){
    const limit=(c.lawyerCalled?ABHANDLUNG_MIN_ANWALT:ABHANDLUNG_MIN)+KULANZ_MIN;
    if(m>limit) out.cuff="Abhandlung dauerte "+m+" Min., zulässig sind "+(limit-KULANZ_MIN)+" Min. (+"+KULANZ_MIN+" Min. Kulanz).";
  }
  if(c.belehrungMin!==""&&c.belehrungMin!==undefined&&c.belehrungMin!==null&&Number(c.belehrungMin)>BELEHRUNG_MIN)
    out.rights="Belehrung erst nach "+Number(c.belehrungMin)+" Min., zulässig sind "+BELEHRUNG_MIN+" Min. (§34 I StPO).";
  return out;
}
/* Dauer zwischen Handschellen und Abschluss in Minuten */
function cuffMinutes(c){
  if(!c.cuffAt||!c.endAt) return null;
  const [h1,m1]=c.cuffAt.split(":").map(Number), [h2,m2]=c.endAt.split(":").map(Number);
  if([h1,m1,h2,m2].some(isNaN)) return null;
  let d=(h2*60+m2)-(h1*60+m1);
  if(d<0) d+=1440;                       /* über Mitternacht */
  return d-(Number(c.emsPause)||0);      /* §12 II: EMS-Zeit wird gestoppt */
}
/* alle Fehler eines Falls: manuell angehakt + automatisch erkannt */
function allErrors(c){
  const auto=autoErrors(c), set={};
  FEHLER.forEach(f=>{ if(c.errors&&c.errors[f.k]) set[f.k]={manual:true,txt:""}; });
  Object.entries(auto).forEach(([k,v])=>{ set[k]=Object.assign(set[k]||{},{auto:true,txt:v}); });
  return set;
}
const errCount=c=>Object.keys(allErrors(c)).length;

/* --- Fristen --- */
/* §41 I StPO: 72 h ab dem Folgetag des Urteils */
function revisionDeadline(c){
  const base=c.verdictAt||c.date;
  if(!base) return null;
  const d=new Date(base+"T00:00:00");
  if(isNaN(d)) return null;
  d.setDate(d.getDate()+1);
  return new Date(d.getTime()+REVISION_FRIST_H*3600000);
}
function revisionStatus(c){
  if(c.revision&&c.revision.filed) return {s:"filed",lbl:"Revision eingereicht",cls:"ok"};
  const dl=revisionDeadline(c);
  if(!dl) return {s:"none",lbl:"",cls:""};
  const left=dl-Date.now();
  if(left<=0) return {s:"over",lbl:"Revisionsfrist abgelaufen",cls:"neutral"};
  const h=Math.floor(left/3600000);
  return {s:"open",lbl:"Revision noch "+(h>=24?Math.floor(h/24)+" Tage "+(h%24)+" Std.":h+" Std.")+" möglich",
          cls:h<24?"bad":"warn",hours:h};
}
/* §19 I StPO: Verjährung nach 14 Tagen */
function verjaehrung(c){
  if(!c.date) return null;
  const d=new Date(c.date+"T00:00:00");
  if(isNaN(d)) return null;
  d.setDate(d.getDate()+VERJAEHRUNG_TAGE);
  const left=Math.ceil((d-Date.now())/86400000);
  return {date:d,left};
}

/* =============================================================================
   6) Statistik-Kern
   ============================================================================= */
function stats(list){
  const s={n:list.length,freed:0,reduced:0,none:0,pending:0,open:0,savedS:0,savedF:0,fee:0,open$:0,
           demandS:0,finalS:0,demandF:0,finalF:0,errors:0,revisions:0};
  list.forEach(c=>{
    s[OUTCOMES[c.outcome]?c.outcome:"open"]++;
    s.savedS+=Math.max(0,(c.demand?.stars||0)-(c.final?.stars||0));
    s.savedF+=Math.max(0,(c.demand?.fine ||0)-(c.final?.fine ||0));
    s.fee+=feeTotal(c); s.open$+=feeOpen(c);
    s.demandS+=c.demand?.stars||0; s.finalS+=c.final?.stars||0;
    s.demandF+=c.demand?.fine ||0; s.finalF+=c.final?.fine ||0;
    if(errCount(c)) s.errors++;
    if(c.revision&&c.revision.filed) s.revisions++;
  });
  s.closed=s.freed+s.reduced+s.none;
  s.laufend=s.open+s.pending;          /* alles, was noch nicht entschieden ist */
  s.success=s.freed+s.reduced;
  s.rate=pct(s.success,s.closed);
  s.freeRate=pct(s.freed,s.closed);
  return s;
}
const saved=c=>({stars:Math.max(0,(c.demand?.stars||0)-(c.final?.stars||0)),
                 fine :Math.max(0,(c.demand?.fine ||0)-(c.final?.fine ||0))});
function reductionPct(c){
  const d=c.demand?.stars||0;
  return d?Math.max(0,Math.min(100,Math.round((d-(c.final?.stars||0))/d*100))):null;
}
function groupBy(list,field){
  const map=new Map();
  list.forEach(c=>{
    let v=c[field]; v=Array.isArray(v)?v:(v?[v]:[]);
    v.forEach(x=>{if(!map.has(x))map.set(x,[]);map.get(x).push(c);});
  });
  return [...map.entries()].map(([k,v])=>({key:k,list:v,s:stats(v)}));
}
/* alle Leistungspositionen als flache Liste (für RAVO-Nachweis) —
   aus Strafverfahren und aus Anträgen auf Familienlizenz                */
function allFees(){
  const out=[];
  DB.cases.forEach(c=>(c.fees||[]).forEach(f=>
    out.push({...f,src:"case",srcId:c.id,ref:c.caseNo||"",lawyerId:c.lawyerId,client:client(c.clientId)})));
  /* Rechnungen bleiben außen vor – sie fassen bereits erfasste Leistungen nur zusammen */
  DB.docs.forEach(l=>{ if(l.fee&&l.type!=="rechnung")
    out.push({id:l.id,src:"doc",srcId:l.id,ref:l.no||"",type:(TPL[l.type]||{}).fee||"antrag",qty:1,
              amount:l.fee,paid:!!l.paid,date:l.date||"",lawyerId:l.lawyerId,

              client:client(l.clientId)||{name:l.extName||"",phone:l.extPhone||"",pass:l.extPass||""}}); });
  return out.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
}

function monthChart(list){
  const now=new Date(), months=[];
  for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    months.push({k:d.toISOString().slice(0,7),lbl:d.toLocaleDateString("de-DE",{month:"short"})});}
  const data=months.map(m=>{const l=list.filter(c=>(c.date||"").slice(0,7)===m.k);return {...m,...stats(l),total:l.length};});
  const max=Math.max(1,...data.map(d=>d.total));
  const seg=(n,cls)=>n?'<div class="seg" style="height:'+(n/max*120)+'px;background:var(--'+cls+')"></div>':"";
  return '<div class="chart">'+data.map(d=>'<div class="col" title="'+d.lbl+': '+d.total+' Fälle">'+
      seg(d.none,"bad")+seg(d.reduced,"warn")+seg(d.freed,"ok")+seg(d.open,"neutral")+'</div>').join("")+'</div>'+
    '<div class="chart-x">'+data.map(d=>'<span>'+d.lbl+'</span>').join("")+'</div>'+legend();
}

/* Eingebaute Vorlagen plus eigene, jeweils mit den gespeicherten Änderungen */
function tplKeys(){
  const own=Object.keys(DB.tpl||{}).filter(k=>!TPL_STD[k]);
  return TPL_KEYS_STD.concat(own);
}
function tplOf(key){
  const base=TPL_STD[key], ov=(DB.tpl||{})[key];
  if(!base&&!ov) return null;
  const t=Object.assign({},base||{},ov||{});
  if(!t.fields) t.fields=[];
  if(!t.fee) t.fee="antrag";
  if(!t.kurz) t.kurz="XX";
  if(!t.ico) t.ico="📄";
  return t;
}

/* --- Platzhalter füllen -------------------------------------------------- */
function tplWerte(t,d,x){
  const c=x.c||{}, r=c.charges?catSum(c.charges):null, p=me();
  const v={
    mandant:x.name||"", reisepass:x.pass||"", telefon:x.phone||"",
    anwalt:p.name||"", anwaltpass:p.pass||"", anwalttelefon:p.phone||"", kanzlei:p.kanzlei||"",
    datum:d.date?dateDE(d.date):"", aktenzeichen:d.no||"",
    fallnr:c.caseNo||"", fall_kurz:c.caseNo?" – Vorgang "+c.caseNo:"",
    tatdatum:c.date?dateDE(c.date):"", behoerde:c.agency||"", sta:c.sta||"",
    beamte:(c.officers||[]).join(", "), vorwuerfe:(c.charges||[]).join("; "),
    verhaengt:c.final?((c.final.stars||0)+" Hafteinheiten und "+money(c.final.fine)):"",
    zulaessig:r&&r.hits.length?(r.stars+" Hafteinheiten und "+money(r.fine)):"",
    entschaedigung:c.id?money(entschaedigung(c)):"",
    gebuehr:d.fee?money(d.fee):"",
    faellig:d.zahlbar?"bis zum "+dateDE(d.zahlbar):"sofort",
    /* Pflichtverteidigung: steuert Empf\u00e4nger, Anrede und Textbausteine */
    pflicht:"", privat:"ja", rechnungsart:"Rechnung", bestellung:"",
    bis_text:d.bis?"bis zum "+dateDE(d.bis):"bis auf Widerruf"
  };
  /* Unternehmensanmeldung: Einzelfirma, Dachgesellschaft oder Tochter */
  if(t.fields&&t.fields.some(f=>f.k==="toechter")){
    const art=String(d.art||"");
    v.gruppe =/Dachgesellschaft mit/i.test(art)?"ja":"";
    v.tochter=/Tochterunternehmen einer/i.test(art)?"ja":"";
    v.anmeldeart=v.gruppe?"Anmeldung der Unternehmensgruppe"
                :v.tochter?"Anmeldung des Tochterunternehmens":"Anmeldung des Unternehmens";
    const tl=toechterListe(d);
    v.anzahl_toechter=tl.length?String(tl.length):"";
    /* Ein Schliessdienst beruehrt Paragraf 32 StGB - darauf geht der Antrag von selbst ein */
    const alles=[d.firma,d.zweck,d.toechter].join(" ");
    v.dietrich=/schl\u00fcssel|schliess|schlie\u00df|locksmith|schloss/i.test(alles)?"ja":"";
  }
  if(t.adrFeld){
    const gewaehlt=String(d[t.adrFeld]||"");
    const istPflicht=/Justiz|Pflicht/i.test(gewaehlt);
    v.pflicht=istPflicht?"ja":"";
    v.privat =istPflicht?"":"ja";
    v.rechnungsart=istPflicht?"Kostenrechnung der Pflichtverteidigung":"Rechnung";
    v.bestellung=[d.bestelltDurch?"durch "+d.bestelltDurch:"auf Anruf der abhandelnden Beh\u00f6rde",
                  c.date?"am "+dateDE(c.date):""].filter(Boolean).join(" ");
  }
  (t.fields||[]).forEach(f=>{
    let val=d[f.k];
    if(f.t==="date") val=val?dateDE(val):"";
    if(f.t==="check") val=val?"ja":"";
    v[f.k.toLowerCase()]=val===undefined||val===null?"":String(val);
  });
  return v;
}
/* {feld} einsetzen · {feld? Text mit {feld}} nur wenn gefüllt */
function fillTpl(str,v){
  let s=String(str||"");
  s=s.replace(/\{(\w+)\?([^{}]*(?:\{\w+\}[^{}]*)*)\}/g,(m,k,inner)=>
    v[k.toLowerCase()]?inner.replace(/\{(\w+)\}/g,(m2,k2)=>v[k2.toLowerCase()]||""):"");
  return s.replace(/\{(\w+)\}/g,(m,k)=>{
    const val=v[k.toLowerCase()];
    return val===undefined?m:(val===""?"—":val);
  });
}
/* Wie fillTpl, nur fürs Dokument: eingesetzte Angaben werden hervorgehoben,
   damit Name, Reisepassnummer und Co. sofort ins Auge fallen. Längere
   Freitexte bleiben normal gesetzt.                                        */
function fillTplHtml(str,v,t){
  const fliess=new Set((t&&t.fields||[]).filter(f=>f.t==="area").map(f=>f.k.toLowerCase()));
  const wert=k=>{
    const val=v[k.toLowerCase()];
    if(val===undefined) return null;
    const txt=esc(val===""?"—":val);
    return fliess.has(k.toLowerCase())?txt:'<b>'+txt+'</b>';
  };
  let s=String(str||"");
  /* bedingte Abschnitte zuerst, danach escapen wir nur den Vorlagentext */
  s=s.replace(/\{(\w+)\?([^{}]*(?:\{\w+\}[^{}]*)*)\}/g,(m,k,inner)=>
    v[k.toLowerCase()]?inner:"");
  const teile=s.split(/(\{\w+\})/);
  return teile.map(st=>{
    const m=/^\{(\w+)\}$/.exec(st);
    if(!m) return esc(st);
    const w=wert(m[1]);
    return w===null?esc(st):w;
  }).join("");
}

/* Forderung nach §23 V StPO: Haft, Geldstrafe, Anwaltskosten des Verfahrens
   und die Gebühr dieses Schriftsatzes, dazu ein etwaiger Dienstausfall.     */
function forderung(d,c){
  const he=(c&&c.final&&c.final.stars)||0, geld=(c&&c.final&&c.final.fine)||0;
  const eigen=+d.fee||0, tage=+d.tage||0;
  const posten=c?caseFees(c,d.id):[];
  const fall=summe(posten.filter(f=>f.src==="fall"));
  const rows=[];
  if(he)     rows.push([he+" abgesessene Hafteinheiten à "+money(ENTSCHAEDIGUNG_JE_HE), he*ENTSCHAEDIGUNG_JE_HE]);
  if(geld)   rows.push(["Rückerstattung der verhängten Geldstrafe", geld]);
  if(fall)   rows.push(["Anwaltskosten im Ausgangsverfahren", fall]);
  posten.filter(f=>f.src==="doc").forEach(f=>
    rows.push([f.desc+(f.date?" vom "+dateDE(f.date):""), +f.amount||0]));
  if(eigen)  rows.push(["Anwaltskosten für diesen Schriftsatz", eigen]);
  if(tage)   rows.push([tage+" Tage Dienstausfall à bis zu "+money(50000), tage*50000]);
  if(!rows.length) rows.push(["keine bezifferbare Forderung", 0]);
  return {rows, summe:rows.reduce((a,r)=>a+r[1],0)};
}
/* Antragskatalog – die einzelnen Anträge nummeriert, wie vor Gericht üblich */
function antragsKatalog(d,x){
  const c=x.c, wer=(x.name||"die Mandantschaft")+(x.pass?" (Reisepass-Nummer "+x.pass+")":"");
  const vor=(c&&(c.charges||[]).length)?(c.charges||[]).join(", "):"den erhobenen Vorwurf";
  const a=[];
  if(d.type==="revision"){
    a.push("festzustellen, dass im Verfahren gegen "+wer+" ein Abhandlungsfehler gemäß § 35 StPO vorliegt");
    a.push("die Verurteilung wegen "+vor+" aufzuheben und die Mandantschaft nach § 35 StPO freizusprechen und freizulassen");
    a.push("sämtliche aus dieser Verurteilung resultierenden Eintragungen aus der Strafakte zu entfernen (§ 19 Abs. 4 StPO)");
    if(d.entsch&&c) a.push("der Mandantschaft die nachstehende Gesamtforderung in Höhe von "+
                           money(forderung(d,c).summe)+" nach § 23 Abs. 5 StPO zu erstatten");
  }else if(d.type==="loeschung"){
    a.push("die Löschung des bezeichneten Eintrags aus der Strafakte von "+wer+" schriftlich zu genehmigen (§ 19 Abs. 4 StPO)");
    a.push("den Vollzug der Löschung schriftlich zu bestätigen");
    if(d.entsch&&c) a.push("der Mandantschaft die nachstehende Gesamtforderung in Höhe von "+
                           money(forderung(d,c).summe)+" nach § 23 Abs. 5 StPO zu erstatten");
  }else if(d.type==="entschaedigung"){
    a.push("festzustellen, dass die Maßnahme gegen "+wer+" fehlerhaft war");
    if(c) a.push("die nachstehende Gesamtforderung in Höhe von "+money(forderung(d,c).summe)+
                 " nach § 23 StPO festzusetzen und durch die Regierung auszahlen zu lassen (§ 23 Abs. 6 StPO)");
    if(d.loesch) a.push("sämtliche hieraus resultierenden Eintragungen aus der Strafakte zu entfernen (§ 19 Abs. 4 StPO)");
  }else if(d.type==="dienstaufsicht"){
    a.push("den geschilderten Vorgang dienstaufsichtlich zu prüfen");
    a.push("über den Stand der Bearbeitung binnen sieben Tagen Rückmeldung zu geben (§ 15 Abs. 3 BDG)");
    a.push("bei hinreichendem Verdacht ein Verfahren nach § 22 StGB einzuleiten (§ 15 Abs. 4 BDG)");
  }else if(d.type==="gnade"){
    a.push("im Wege der Gnade "+String(d.art||"eine Gnadenentscheidung").toLowerCase()+" zu gewähren (§ 32 StPO)");
  }
  (String(d.antraege||"").split(/\n+/).filter(z=>z.trim())).forEach(z=>a.push(z.trim().replace(/[,.]$/,"")));
  if(!a.length) return "";
  return '<ol class="gr">'+a.map((z,i)=>'<li>'+esc(z)+(i===a.length-1?".":",")+'</li>').join("")+'</ol>';
}

/* Sonderbausteine: nummerierte Liste, Tabelle, eidesstattliche Versicherung */
/* Zerlegt das Feld "toechter" in Name und Zweck */
function toechterListe(d){
  return String(d.toechter||"").split(/\n+/).map(z=>z.trim()).filter(Boolean).map(z=>{
    const m=/^(.+?)\s*[\u2013\u2014:-]\s*(.+)$/.exec(z);
    return m?{name:m[1].trim(),zweck:m[2].trim()}:{name:z,zweck:""};
  });
}
function tplBlock(zeile,d,x,v){
  let m=/^\{liste:(\w+)\}$/.exec(zeile);
  if(m){
    const items=String(d[m[1]]||"").split(/\n+/).filter(z=>z.trim());
    return items.length?'<ol class="gr">'+items.map(z=>'<li>'+esc(z)+'</li>').join("")+'</ol>':"";
  }
  if(/^\{antraege\}$/.test(zeile)) return antragsKatalog(d,x);
  m=/^\{eid:([\s\S]+)\}$/.exec(zeile);
  if(m) return oathBox(x.name,fillTplHtml(m[1],v,x.t));
  m=/^\{tabelle:(\w+)\}$/.exec(zeile);
  if(m==null) return null;
  if(m[1]==="posten"){
    const ps=Array.isArray(d.posten)?d.posten:[];
    const sum=ps.reduce((a,q)=>a+(+q.amount||0),0);
    return tblHtml(["Datum","Leistung","Umfang","Betrag"],
      ps.length?ps.map(q=>{const rr=RAVO[q.type]||{lbl:q.type,per:0};
        return [q.date?dateDE(q.date):"—",rr.lbl+(q.desc?" – "+q.desc:""),
                rr.per?((q.qty||1)+" × "+rr.per+" Min."):"Pauschale",money(q.amount)];})
       :[["—","keine Posten erfasst","—","—"]],
      ["","","Gesamtbetrag",money(sum)]);
  }
  /* Kurzer Steckbrief des Verfahrens - damit die Justiz sieht, wofuer
     abgerechnet wird, ohne die Akte danebenlegen zu muessen.            */
  /* Tochterunternehmen: je Zeile "Name - Zweck" */
  if(m[1]==="toechter"){
    if(!v||!v.gruppe) return "";          /* nur bei einer Dachgesellschaft */
    const tl=toechterListe(d);
    if(!tl.length) return '<p><i>Noch keine Tochterunternehmen benannt.</i></p>';
    return '<table class="pos vorgang"><thead><tr><th>Tochterunternehmen</th><th>Gesch\u00e4ftszweck</th></tr></thead><tbody>'+
      tl.map(q=>'<tr><td><b>'+esc(q.name)+'</b></td><td>'+esc(q.zweck||"\u2014")+'</td></tr>').join("")+'</tbody></table>';
  }
  /* Kurzuebersicht der Unternehmensdaten */
  if(m[1]==="firma"){
    const z=[];
    if(d.firma) z.push([v.gruppe?"Dachgesellschaft":v.tochter?"Tochterunternehmen":"Name des Unternehmens",d.firma]);
    if(v.tochter&&d.dach) z.push(["Dachgesellschaft",d.dach]);
    if(v.gruppe) z.push(["Tochterunternehmen",toechterListe(d).length+" Gesellschaften"]);
    if(d.sitz)  z.push(["Sitz",d.sitz]);
    z.push(["Inhaberin oder Inhaber",(x.name||"\u2014")+(x.pass?" (Reisepass-Nummer "+x.pass+")":"")]);
    if(x.phone) z.push(["Telefonnummer",x.phone]);
    if(d.start) z.push(["Geplanter Beginn",dateDE(d.start)]);
    z.push(["Anmeldung nach","\u00a7 11 Abs. 2 und 3 BGB"]);
    if(d.marke) z.push(["Markeneintragung","zugleich beantragt (\u00a7 12 BGB)"]);
    return '<table class="pos vorgang"><tbody>'+
      z.map(q=>'<tr><td>'+esc(q[0])+'</td><td>'+esc(q[1])+'</td></tr>').join("")+'</tbody></table>';
  }
  if(m[1]==="vorgang"){
    const c=x.c;
    if(!c) return "";
    const r=(c.charges||[]).length?catSum(c.charges):null;
    const rv=revisionStatus(c);
    const z=[];
    z.push(["Vorgang", (c.caseNo||"\u2014")+(c.date?" vom "+dateDE(c.date):"")]);
    if((c.charges||[]).length) z.push(["Tatvorwurf",(c.charges||[]).join("; ")]);
    if(c.cuffAt)  z.push(["Handschellen um",c.cuffAt+" Uhr"]);
    if(c.agency)  z.push(["Abhandelnde Beh\u00f6rde",c.agency]);
    if((c.officers||[]).length) z.push(["Festnehmende Beamte",(c.officers||[]).join(", ")]);
    z.push(["Staatsanwalt / Richter",c.sta||"nicht erreichbar gewesen"]);
    z.push(["Verfahrensart",PROCEDURES[c.procedure]||"\u2014"]);
    if(c.final&&(c.final.stars||c.final.fine))
      z.push(["Verh\u00e4ngtes Strafma\u00df",(c.final.stars||0)+" Hafteinheiten und "+money(c.final.fine||0)]);
    if(r&&r.hits.length)
      z.push(["Zul\u00e4ssiges H\u00f6chstma\u00df",r.stars+" Hafteinheiten und "+money(r.fine)+" ("+STRAFREGELN[r.regel].ref+")"]);
    z.push(["Ergebnis",outcomeInfo(c.outcome,c.procedure).lbl]);
    if(c.revision&&c.revision.ref) z.push(["Revision",c.revision.ref+(rv.lbl?" \u2013 "+rv.lbl:"")]);
    return '<h2 class="abschnitt">Zugrunde liegender Vorgang</h2>'+
      '<table class="pos vorgang"><tbody>'+
      z.map(p=>'<tr><td>'+esc(p[0])+'</td><td>'+esc(p[1])+'</td></tr>').join("")+
      '</tbody></table>';
  }
  if(m[1]==="entschaedigung"){
    const c=x.c;
    /* Hat die Vorlage ein Häkchen dafür, entscheidet dieses über die Aufstellung */
    if((x.t.fields||[]).some(f=>f.k==="entsch")&&!d.entsch) return "";
    if(!c) return tblHtml(["Position","Betrag"],[["kein Verfahren verknüpft","—"]]);
    const f=forderung(d,c);
    return tblHtml(["Position","Betrag"],f.rows.map(r=>[r[0],money(r[1])]),["Gesamtforderung",money(f.summe)]);
  }
  return "";
}

function docCheck(d){
  const t=tplOf(d.type)||tplOf("akte"), cl=client(d.clientId)||{}, p=me();
  const name =d.clientId?cl.name :d.extName;
  const pass =d.clientId?cl.pass :d.extPass;
  const phone=d.clientId?cl.phone:d.extPhone;
  const miss=[];
  if(!d.date)   miss.push("Datum des Schriftsatzes");
  if(!name)     miss.push("Name der Mandantschaft");
  if(!pass)     miss.push("Reisepassnummer der Mandantschaft");
  if(!phone)    miss.push("Telefonnummer der Mandantschaft (RAVO §3 V)");
  if(!p.name)   miss.push("Name des Anwalts");
  if(!p.pass)   miss.push("Reisepassnummer des Anwalts");
  if(!p.phone)  miss.push("Telefonnummer des Anwalts");
  (t.fields||[]).forEach(f=>{
    if(!f.req) return;
    const val=d[f.k];
    if(f.t==="posten"){ if(!Array.isArray(val)||!val.length) miss.push(f.l); }
    else if(!val) miss.push(f.l);
  });
  if(t.caseRef&&!d.caseId) miss.push("verknüpftes Verfahren");
  return {miss,name,pass,phone,ok:!miss.length,t};
}

/* --- Brief rendern ------------------------------------------------------- */
function docHtml(d){
  const x=docCheck(d), t=x.t, p=me();
  const c=d.caseId?DB.cases.find(k=>k.id===d.caseId):null;
  const ctx={...x,c};
  const v=tplWerte(t,d,ctx);
  const kopf=briefkopf();
  /* Vorlagen k\u00f6nnen Empf\u00e4nger und Anrede von einem Auswahlfeld abh\u00e4ngig machen */
  const wahl=t.adrFeld?String(d[t.adrFeld]||""):"";
  const anWahl=(t.anMap||{})[wahl], anredeWahl=(t.anredeMap||{})[wahl];
  const empf=String(d.eigenerEmpf||anWahl||t.an||"").split("\n").map(z=>esc(z)).join("<br>");
  const anrede=anredeWahl!==undefined?anredeWahl:(t.anrede!==undefined?t.anrede:"Sehr geehrte Damen und Herren,");
  const absender=[p.name,p.pass?"Reisepass-Nr. "+p.pass:"",p.phone?"Tel. "+p.phone:""].filter(Boolean).join(" · ");
  /* Ein für diesen Schriftsatz angepasster Text geht der Vorlage vor */
  const quelle=(typeof d.eigenerText==="string"&&d.eigenerText.trim())?d.eigenerText:t.text;
  const koerper=String(quelle||"").split(/\n\s*\n/).map(abs=>{
    const z=abs.trim(); if(!z) return "";
    const sonder=tplBlock(z,d,ctx,v);
    if(sonder!==null) return sonder;
    const html=fillTplHtml(z,v,t).trim();
    if(!html) return "";
    /* Kurze Zeilen in Großbuchstaben sind Abschnittsüberschriften – die bleiben
       beim Druck mit dem folgenden Absatz zusammen */
    const roh=html.replace(/<[^>]+>/g,"").trim();
    if(roh.length<=60&&/^[IVX]*\.?\s*[A-ZÄÖÜSS0-9 .,&–-]+$/.test(roh)&&/[A-ZÄÖÜ]{3}/.test(roh))
      return '<h2 class="abschnitt">'+html+'</h2>';
    return '<p>'+html.replace(/\n/g,"<br>")+'</p>';
  }).join("");
  return `<div class="doc">
    ${logoAlsWz()?'<div class="wz"><img src="'+esc(logoBild())+'" alt=""></div>':""}
    <div class="kopfblock">
      ${(kopf.length||logoImKopf())?(logoImKopf()
        ? '<div class="kanzleikopf'+(kopf.length?"":" nurlogo")+'"><img src="'+esc(logoBild())+'" alt="">'+
          (kopf.length?'<div class="kanzlei">'+kopf.map(z=>esc(z)).join("<br>")+'</div>':"")+'</div>'
        : '<div class="kanzlei">'+kopf.map(z=>esc(z)).join("<br>")+'</div>'):""}
      <div class="abs">${esc(absender)}</div>
      <div class="head2">
        <div class="empf">${empf||"&nbsp;"}</div>
        <div class="meta">
          <div>Los Santos, den ${d.date?dateDE(d.date):"—"}</div>
          <div class="az">Az.: ${esc(d.no||"—")}</div>
        </div>
      </div>
      <div class="betreff">${esc(fillTpl(d.eigenerBetreff||t.betreff||t.lbl,v))}</div>
      ${t.datenblock===false?"":datenBlock(d,ctx)}
      ${anrede?'<p class="anrede">'+esc(anrede)+'</p>':""}
    </div>
    ${koerper}
    <div class="schluss">
      <p class="gruss">Mit freundlichen Grüßen</p>
      <div class="sign">
        ${sigBlock(p.name,"Rechtsanwalt")}
        ${(t.oath||t.sign2)?sigBlock(x.name,"Mandantschaft"):""}
      </div>
    </div>
    <div class="fuss">
      Rechtsgrundlage: ${esc(t.ref||"—")}.${t.frist?" Frist: "+esc(t.frist)+".":""}
      ${t.noFee?"":" Gebühr für diesen Schriftsatz: "+(d.fee?money(d.fee):"—")+" (Höchstsatz "+money(ravoMaxOf(t.fee))+" nach "+esc(RAVO[t.fee].ref)+")."}
      ${kopf.length?" · "+esc(kopf[0]):""}
    </div>
  </div>`;
}
/* Briefkopf: frei bearbeitbar im Profil, eine Zeile je Textzeile.
   Solange nichts eingetragen ist, stehen dort Name und Ort.        */
function briefkopf(){
  const p=me();
  if(typeof p.briefkopf==="string")
    return p.briefkopf.split("\n").map(z=>z.trim()).filter(Boolean);
  return [p.kanzlei||p.name||"", "Los Santos City · San Andreas"].filter(Boolean);
}
const briefkopfText=()=>briefkopf().join("\n");

/* Kanzleilogo: liegt als Datenadresse im Profil, wird also mit exportiert
   und funktioniert ohne Netz. platz: aus | kopf | kopfwz | wz            */
const logoBild =()=>(me().logo||"");
const logoPlatz=()=>me().logoPlatz||"kopf";
const logoAn   =()=>!!logoBild()&&logoPlatz()!=="aus";
const logoImKopf=()=>logoAn()&&/^kopf/.test(logoPlatz());
const logoAlsWz =()=>logoAn()&&/wz$/.test(logoPlatz());
const LOGO_PLAETZE={
  kopf:  "Klein im Briefkopf",

  wz:    "Nur blass hinter dem Text",

};

/* Unterschrift: Namenszug in Schreibschrift über der Linie */
const sigBlock=(name,rolle)=>`<div class="sig">
  <span class="hand">${esc(name||"")}</span>
  <span class="line"></span>
  <span class="rolle">${esc(name||"")}${name?" · ":""}${esc(rolle)}</span></div>`;

function docText(d){
  const tmp=document.createElement("div");
  tmp.innerHTML=docHtml(d).replace(/<\/(h1|h2|p|tr|div|li)>/g,"\n").replace(/<td[^>]*>/g," | ").replace(/<br\s*\/?>/g,"\n");
  return tmp.textContent.split("\n").map(z=>z.replace(/[ \t]+/g," ").trim())
    .filter((z,i,a)=>z||(a[i-1]&&a[i-1].trim())).join("\n").trim();
}
function printDocument(id){
  const d=typeof id==="string"?DB.docs.find(x=>x.id===id):id;
  if(!d) return;
  const pd=document.getElementById("printDoc");
  pd.innerHTML=docHtml(d);
  const after=()=>{pd.innerHTML="";window.removeEventListener("afterprint",after);};
  window.addEventListener("afterprint",after);
  setTimeout(()=>window.print(),60);
}

/* Vorlagen nach Phase des Mandats, mit Hinweis wofür sie da sind */
function vorlagenRaster(kompakt){
  const rest=tplKeys().filter(k=>!PHASEN.some(p=>p.k===(tplOf(k).phase||"")));
  const gruppen=PHASEN.map(p=>({lbl:p.lbl,keys:tplKeys().filter(k=>(tplOf(k).phase||"")===p.k)}))
    .concat(rest.length?[{lbl:"Eigene Vorlagen",keys:rest}]:[])
    .filter(g=>g.keys.length);
  return gruppen.map(g=>`
    <div class="phase">
      <div class="phase-h">${esc(g.lbl)}</div>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(258px,1fr))">

              ${t.wann?'<div class="muted" style="font-size:12.5px;margin-top:6px;line-height:1.45">'+esc(t.wann)+'</div>':""}
            </div>
            <div class="tags" style="margin-top:9px;align-items:center">
              <span class="pill tag">${esc(t.ref||"")}</span>
              ${t.noFee?"":'<span class="pill tag">bis '+money(ravoMaxOf(t.fee))+'</span>'}
              ${t.frist?'<span class="pill warn" title="'+esc(t.frist)+'">Frist</span>':""}

  const form=document.getElementById("tplForm");
  /* Wurde die Vorlage einmal angepasst, fehlen ihr sp\u00e4ter erg\u00e4nzte
     Standardfelder \u2013 hier lassen sie sich nachziehen.                 */
  const fehlendeStd=()=>((TPL_STD[key]||{}).fields||[]).filter(f=>!felder.some(x=>x.k===f.k));
  const drawFields=()=>{
    const fehlt=fehlendeStd();
    form.querySelector("#tplStd").innerHTML=fehlt.length?`<div class="box warn">
      <b>Deiner Fassung fehlen Felder der Standardvorlage:</b>
      ${fehlt.map(f=>'<div style="margin-top:4px">\u2022 <b>'+esc(f.l)+'</b> <span class="mono muted">{'+esc(f.k)+'}</span></div>').join("")}
      <div style="margin-top:8px"><button type="button" class="btn sm" data-act="tplAddStd">Felder \u00fcbernehmen</button>
        <span class="muted" style="font-size:12px">\u2013 den passenden Textbaustein musst du unten selbst einf\u00fcgen</span></div>
    </div>`:"";
    form.querySelector("#tplFields").innerHTML=felder.length?`<div class="tblwrap"><table>
      <thead><tr><th>Platzhalter</th><th>Beschriftung</th><th>Art</th><th>Pflicht</th><th></th></tr></thead>
      <tbody>${felder.map((f,i)=>`<tr>
        <td class="mono">{${esc(f.k)}}</td><td>${esc(f.l)}</td>
        <td class="muted">${({text:"Textzeile",area:"Mehrzeilig",date:"Datum",num:"Zahl",check:"Häkchen",select:"Auswahl",posten:"Rechnungsposten"})[f.t]||f.t}</td>
        <td><button type="button" class="btn ghost sm" data-freq="${i}">${f.req?"✓ Pflicht":"optional"}</button></td>
        <td style="text-align:right"><button type="button" class="btn ghost sm" data-fdel="${i}">✕</button></td></tr>`).join("")}
      </tbody></table></div>`:'<div class="box info">Keine eigenen Eingabefelder – der Text nutzt nur die allgemeinen Platzhalter.</div>';
  };
  drawFields();
  const snap=()=>{
    const f=new FormData(form);
    /* alles, was der Editor nicht anzeigt (anMap, adrFeld, \u2026), bleibt erhalten */
    const o={...(tplOf(key)||{}),
      lbl:f.get("lbl").trim(),kurz:(f.get("kurz")||"XX").trim().toUpperCase(),ico:(f.get("ico")||"📄").trim(),
      an:f.get("an"),ref:f.get("ref").trim(),fee:f.get("fee"),frist:f.get("frist").trim(),
      betreff:f.get("betreff").trim(),anrede:f.get("anrede"),text:f.get("text"),hinweis:f.get("hinweis").trim(),
      caseRef:!!f.get("caseRef"),sign2:!!f.get("sign2"),datenblock:!!f.get("datenblock"),fields:felder};
    if(!o.frist) delete o.frist;
    return o;
  };
  form.addEventListener("click",e=>{
    const fr=e.target.closest("[data-freq]")||e.target.closest("[data-freq]");
    if(fr){const i=+fr.dataset.freq;felder[i].req=felder[i].req?0:1;return drawFields();}
    const fd=e.target.closest("[data-fdel]"); if(fd){felder.splice(+fd.dataset.fdel,1);return drawFields();}
    const a=e.target.closest("[data-act]"); if(!a) return;
    if(a.dataset.act==="tplAddStd"){
      e.preventDefault();
      const neu=fehlendeStd();
      felder=felder.concat(JSON.parse(JSON.stringify(neu)));
      drawFields();
      return toast(neu.length+(neu.length===1?" Feld":" Felder")+" \u00fcbernommen \u2013 noch speichern");
    }
    if(a.dataset.act==="tplAddField"){
      e.preventDefault();
      const k=form.querySelector("#nfK").value.trim().replace(/[^\w]/g,""),
            l=form.querySelector("#nfL").value.trim(), t2=form.querySelector("#nfT").value;
      if(!k||!l){toast("Feldname und Beschriftung angeben");return;}
      if(felder.some(x=>x.k===k)){toast("Dieses Feld gibt es schon");return;}
      felder.push({k,l,t:t2,req:0});
      form.querySelector("#nfK").value="";form.querySelector("#nfL").value="";
      drawFields();return;
    }
    if(a.dataset.act==="tplPreview"){
      e.preventDefault();
      const s=snap(); DB.tpl=DB.tpl||{}; const alt=DB.tpl[key]; DB.tpl[key]=s;
      const cl=DB.clients[0]||{name:"Mandant",pass:"000000",phone:"000-000"};
      const probe={type:key,no:"A-"+s.kurz+"-"+initials()+"-"+new Date().getFullYear()+"-01",date:today(),
                   clientId:cl.id||"",extName:cl.name,extPass:cl.pass,extPhone:cl.phone,
                   fee:ravoMaxOf(s.fee),posten:[]};
      (s.fields||[]).forEach(f=>{ probe[f.k]=f.t==="check"?true:f.t==="date"?today():f.t==="num"?1:"Beispieltext"; });
      const html=docHtml(probe);
      if(alt===undefined) delete DB.tpl[key]; else DB.tpl[key]=alt;
      openModal(`<div class="modal-h"><h3>Vorschau der Vorlage</h3><button type="button" class="x" data-act="editTpl" data-id="${key}">×</button></div>
        <div class="modal-b"><div class="hint" style="margin-bottom:10px">Beispielwerte – so sieht der fertige Schriftsatz aus.</div>
        <div class="docwrap">${html}</div></div>
        <div class="modal-f"><button class="btn primary" data-act="editTpl" data-id="${key}">Zurück zum Bearbeiten</button></div>`);
      return;
    }
  });
  form.onsubmit=e=>{
    e.preventDefault();
    DB.tpl=DB.tpl||{};
    DB.tpl[key]=snap();
    save();closeModal();render();toast("Vorlage gespeichert");
  };
}
function mTplNew(){
  const key="eigen_"+uid();
  DB.tpl=DB.tpl||{};
  DB.tpl[key]={lbl:"Eigene Vorlage",kurz:"EV",ico:"📄",an:"An die Justiz des Staates San Andreas",
    ref:"",fee:"antrag",betreff:"{mandant}",anrede:"Sehr geehrte Damen und Herren,",
    text:"hiermit beantrage ich für meine Mandantschaft {mandant}, Reisepass-Nummer {reisepass}, Telefon-Nummer {telefon}, …\n\nIch bitte um Rückmeldung.",
    hinweis:"",fields:[]};
  save(); mTplEdit(key);
}

/* --- Schriftsatz anlegen / bearbeiten --- */
function mDoc(id,type,preset){
  const d=id?DB.docs.find(x=>x.id===id):null;
  const tp=d?d.type:(type||"akte"), t=tplOf(tp)||tplOf("akte");
  const cur=Object.assign({type:tp,date:today(),status:"entwurf",clientId:"",caseId:"",fee:0,paid:false,
                           posten:[]},d||{},preset||{});
  let posten=JSON.parse(JSON.stringify(cur.posten||[]));
  const hatPosten=(t.fields||[]).some(f=>f.t==="posten");
  const feld=f=>{
    const v=cur[f.k]??(f.def??"");
    if(f.t==="check") return `<label class="chk"><input type="checkbox" name="${f.k}" ${v?"checked":""}>
      <div><div class="t">${esc(f.l)}${f.req?" *":""}</div>${f.hint?'<div class="s">'+esc(f.hint)+'</div>':""}</div></label>`;
    if(f.t==="posten") return `<div class="f"><span style="display:block;font-size:12px;color:var(--tx2);margin-bottom:5px">${esc(f.l)}${f.req?" *":""}</span>

      <div class="f-row four" style="margin-top:10px">
        <label class="f"><span>Leistung</span><select id="pType">
          ${Object.entries(RAVO).map(([k,r])=>'<option value="'+k+'">'+esc(r.lbl)+'</option>').join("")}</select></label>
        <label class="f"><span id="pQtyLbl">Einheiten</span><input type="number" id="pQty" min="1" step="1" value="1"></label>
        <label class="f"><span>Betrag ($)</span><div style="display:flex;gap:6px">
          <input type="number" id="pAmount" min="0" step="1000"><button type="button" class="btn sm" data-act="pMax">max</button></div></label>
        <label class="f"><span>Datum</span><input type="date" id="pDate" value="${today()}"></label>
      </div>
      <label class="f"><span>Bemerkung</span><input type="text" id="pDesc" placeholder="z. B. Beratung in der Zelle"></label>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <button type="button" class="btn" data-act="pAdd">＋ Posten hinzufügen</button>
        <button type="button" class="btn" data-act="pFromCase">⤵ Leistungen aus dem Verfahren übernehmen</button>
        <span class="hint" id="pHint" style="margin:0"></span></div>
      <div class="hint">${esc(f.hint||"")}</div></div>`;
    const inp=f.t==="area"?`<textarea name="${f.k}" rows="4" placeholder="${esc(f.hint||"")}">${esc(v)}</textarea>`
      :f.t==="select"?`<select name="${f.k}"><option value="">– wählen –</option>${(f.opts||[]).map(o=>'<option'+(v===o?" selected":"")+'>'+esc(o)+'</option>').join("")}</select>`
      :f.t==="num"?`<input type="number" name="${f.k}" min="0" step="1" value="${esc(v)}">`
      :f.t==="date"?`<input type="date" name="${f.k}" value="${esc(v)}">`
      :`<input type="text" name="${f.k}" value="${esc(v)}" placeholder="${esc(f.hint||"")}">`;
    return `<label class="f"><span>${esc(f.l)}${f.req?" *":""}</span>${inp}${f.hint&&f.t!=="text"?'<div class="hint">'+esc(f.hint)+'</div>':""}</label>`;
  };
  openModal(`<form id="docForm">
    <div class="modal-h"><h3>${t.ico} ${d?"Schriftsatz "+esc(d.no||""):esc(t.lbl)}</h3>
      <button type="button" class="btn ghost sm" data-act="editTpl" data-id="${tp}" title="Wortlaut dieser Vorlage bearbeiten">✎ Vorlage</button>
      <button type="button" class="x" data-act="close">×</button></div>
    <div class="modal-b">
      <div class="box info" style="margin-bottom:14px">${t.an?"<b>"+esc(t.an.replace(/\n/g," · "))+"</b> · ":""}${esc(t.ref||"")}
        ${t.frist?'<br><span class="warn-tx">Frist: '+esc(t.frist)+'</span>':""}
        ${t.hinweis?"<br>"+esc(t.hinweis):""}</div>
      <div class="f-row three">
        <label class="f"><span>Aktenzeichen</span>
          <div style="display:flex;gap:6px"><input type="text" name="no" value="${esc(cur.no||"")}" placeholder="A-${esc(t.kurz)}-XX-2026-01">
          <button type="button" class="btn sm" data-act="genDocRef" title="Aktenzeichen erzeugen">⟳</button></div></label>
        <label class="f"><span>Datum *</span><input type="date" name="date" value="${esc(cur.date||today())}"></label>
        <label class="f"><span>Status</span><select name="status">
          ${Object.entries(ANTRAG_STATUS).map(([k,v])=>'<option value="'+k+'"'+(cur.status===k?" selected":"")+'>'+v.lbl+'</option>').join("")}
        </select></label>
        <label class="f"><span>R\u00fccksprache mit der Mandantschaft</span><select name="rueck">
          ${Object.entries(RUECK).map(([k,v])=>'<option value="'+k+'"'+((cur.rueck||"")===k?" selected":"")+'>'+v.lbl+'</option>').join("")}
        </select>
        <div class="hint">\u201emuss besprochen werden\u201c erscheint als Aufgabe unter \u2705 Aufgaben.</div></label>
      </div>
      <div class="sec-title" style="margin-top:2px">Mandantschaft</div>
      ${pickerField("clientId","Aus der Kartei",mandantenPick(),cur.clientId,"leer lassen und Daten unten eintragen")}
      <div id="extBox" ${cur.clientId?"hidden":""}><div class="f-row three">
        <label class="f"><span>Name *</span><input type="text" name="extName" value="${esc(cur.extName||"")}"></label>
        <label class="f"><span>Reisepassnummer *</span><input type="text" name="extPass" value="${esc(cur.extPass||"")}"></label>
        <label class="f"><span>Telefonnummer *</span><input type="text" name="extPhone" value="${esc(cur.extPhone||"")}"></label>
      </div></div>
      <div id="cliBox" ${cur.clientId?"":"hidden"} class="box info" style="margin-bottom:12px"></div>
      <label class="f"><span>Betroffenes Verfahren${t.caseRef?" *":" (optional)"}</span>
        <div style="display:flex;gap:6px">
          ${pickerField("caseId","",faellePick(),cur.caseId,"Fallnummer oder Mandant …")}
          <button type="button" class="btn sm" data-act="fromCase" title="Angaben aus dem Verfahren übernehmen">⤵ übernehmen</button>
        </div></label>
      ${(t.fields||[]).length?'<div class="sec-title">Inhalt</div>':""}
      ${(t.fields||[]).map(feld).join("")}

      <div class="sec-title">Wortlaut
        <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400"> – nur für diesen Schriftsatz</span></div>
      <div id="wortlautBox"></div>
      ${t.noFee?"":'<div class="sec-title">Gebühr</div>'}
      ${t.noFee?`<div class="sec-title">Zahlung</div>
        <label class="chk"><input type="checkbox" name="paid" ${cur.paid?"checked":""}>
          <div><div class="t">bezahlt</div><div class="s">Die Summe ergibt sich aus den Posten oben.</div></div></label>`:`
      <div class="f-row three" style="margin-top:10px">
        <label class="f"><span>Gebühr ($)</span>
          <div style="display:flex;gap:6px"><input type="number" name="fee" min="0" step="1000" value="${cur.fee??""}">
          <button type="button" class="btn sm" data-act="docFeeMax">max</button></div></label>
        <label class="f" style="align-self:end"><span>&nbsp;</span>
          <label class="chk" style="margin:0"><input type="checkbox" name="paid" ${cur.paid?"checked":""}>
            <div><div class="t">bezahlt</div></div></label></label>
        <div class="f"><span style="display:block;font-size:12px;color:var(--tx2);margin-bottom:5px">Höchstsatz</span>
          <div class="mono" style="padding:8px 0"><b>${money(ravoMaxOf(t.fee))}</b>
            <a href="#" data-act="editRavo" class="muted" style="font-size:12px">ändern</a></div></div>
      </div>`}
      <div id="feeWarn"></div>
      <label class="f"><span>Interne Notizen (nicht im Schriftsatz)</span>
        <textarea name="note" placeholder="Rückmeldung, Termin, Aktenstand …">${esc(cur.note||"")}</textarea></label>
      <div class="sec-title">Vollständigkeit</div>
      <div id="docCheckBox"></div>
    </div>
    <div class="modal-f"><button type="submit" class="btn primary">Speichern</button>
      <button type="button" class="btn" data-act="docPreview">👁 Vorschau &amp; PDF</button>
      <button type="button" class="btn ghost" data-act="close">Abbrechen</button>
      ${d?'<button type="button" class="btn danger" style="margin-left:auto" data-act="delDoc" data-id="'+d.id+'">Löschen</button>':""}
    </div></form>`);

  const form=document.getElementById("docForm");
  const snap=()=>{
    const o={id:d?d.id:undefined,type:tp,no:form.no.value,date:form.date.value,status:form.status.value,
      clientId:form.clientId.value,extName:form.extName.value,extPass:form.extPass.value,extPhone:form.extPhone.value,
      caseId:form.caseId.value,
      fee:form.fee?(+form.fee.value||0):0,paid:form.paid?form.paid.checked:false,note:form.note.value,posten,
      rueck:form.rueck?form.rueck.value:(cur.rueck||"")};
    (t.fields||[]).forEach(f=>{
      if(f.t==="posten") return;
      const el=form[f.k]; if(!el) return;
      o[f.k]=f.t==="check"?el.checked:(f.t==="num"?(+el.value||0):el.value);
    });
    if(hatPosten) o.fee=posten.reduce((a,q)=>a+(+q.amount||0),0);
    if(eigenerText!==null){
      const tf=form.querySelector("#wlText"), bf=form.querySelector("#wlBetreff"), ef=form.querySelector("#wlEmpf");
      o.eigenerText   = tf?tf.value:eigenerText;
      o.eigenerBetreff= bf?bf.value:(eigenerBetreff||"");
      o.eigenerEmpf   = ef?ef.value:(eigenerEmpf||"");
    }
    return o;
  };
  /* Der Wortlaut lässt sich hier einmalig ändern, ohne die Vorlage anzufassen */
  let eigenerText=(typeof cur.eigenerText==="string")?cur.eigenerText:null;
  let eigenerBetreff=(typeof cur.eigenerBetreff==="string")?cur.eigenerBetreff:null;
  let eigenerEmpf=(typeof cur.eigenerEmpf==="string")?cur.eigenerEmpf:null;
  const drawWortlaut=()=>{
    const box=form.querySelector("#wortlautBox"); if(!box) return;
    const offen=eigenerText!==null;
    box.innerHTML=offen?`
      <div class="box warn" style="margin:0 0 10px">Dieser Schriftsatz hat einen eigenen Wortlaut. Die Vorlage
        <b>${esc(t.lbl)}</b> bleibt unverändert – andere Schriftsätze sind nicht betroffen.</div>
      <div class="f-row">
        <label class="f"><span>Betreff</span><input type="text" id="wlBetreff" value="${esc(eigenerBetreff!==null?eigenerBetreff:(t.betreff||""))}"></label>
        <label class="f"><span>Empfänger</span><textarea id="wlEmpf" rows="2">${esc(eigenerEmpf!==null?eigenerEmpf:(t.an||""))}</textarea></label>
      </div>
      <label class="f"><span>Text</span>
        <textarea id="wlText" rows="16" style="font-family:Consolas,monospace;font-size:12.5px">${esc(eigenerText)}</textarea>
        <div class="hint">Platzhalter wie <b>{mandant}</b> funktionieren weiter. Leerzeile = neuer Absatz.
        Sonderzeilen: <b>{liste:feld}</b>, <b>{antraege}</b>, <b>{tabelle:vorgang}</b>, <b>{tabelle:entschaedigung}</b>, <b>{tabelle:posten}</b>.</div></label>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button type="button" class="btn" data-act="wlReset">↺ Wortlaut der Vorlage</button>
        <button type="button" class="btn" data-act="editTpl" data-id="${tp}">✎ Stattdessen die Vorlage ändern</button>
      </div>`
    :`<div class="box info" style="margin:0">Der Schriftsatz verwendet den Wortlaut der Vorlage <b>${esc(t.lbl)}</b>.
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:9px">
          <button type="button" class="btn" data-act="wlEdit">✎ Text nur hier anpassen</button>
          <button type="button" class="btn ghost" data-act="editTpl" data-id="${tp}">Vorlage dauerhaft ändern</button>
        </div></div>`;
  };
  const drawPosten=()=>{
    const box=form.querySelector("#postenBox"); if(!box) return;
    const sum=posten.reduce((a,q)=>a+(+q.amount||0),0);
    box.innerHTML=posten.length?`<div class="tblwrap"><table>
      <thead><tr><th>Datum</th><th>Leistung</th><th>Umfang</th><th>Betrag</th><th>Höchstsatz</th><th></th></tr></thead>
      <tbody>${posten.map((q,i)=>{const r=RAVO[q.type]||{lbl:q.type,per:0},max=ravoMax(q.type,q.qty),ue=(+q.amount||0)>max;
        return `<tr><td class="mono">${dateDE(q.date)}</td>
          <td>${esc(r.lbl)}${q.desc?'<div class="muted" style="font-size:12px">'+esc(q.desc)+'</div>':""}</td>
          <td class="mono">${r.per?(q.qty||1)+" × "+r.per+" Min.":"Pauschale"}</td>
          <td class="mono ${ue?"bad-tx":""}"><b>${money(q.amount)}</b></td>
          <td class="mono muted">${money(max)}</td>
          <td><button type="button" class="btn ghost sm" data-pdel="${i}">✕</button></td></tr>`;}).join("")}
      </tbody><tfoot><tr><td colspan="3" class="muted">Gesamtbetrag</td><td class="mono"><b>${money(sum)}</b></td><td colspan="2"></td></tr></tfoot>
      </table></div>`:'<div class="box info">Noch keine Posten erfasst.</div>';
    const ty=form.querySelector("#pType").value, r=RAVO[ty];
    form.querySelector("#pQtyLbl").textContent=r.per?"Einheiten à "+r.per+" Min.":"Anzahl";
    form.querySelector("#pHint").innerHTML="Höchstsatz: <b>"+money(ravoMax(ty,form.querySelector("#pQty").value))+"</b> ("+esc(r.ref)+")";
  };
  const draw=()=>{
    const s=snap(), x=docCheck(s), cl=client(s.clientId);
    form.querySelector("#extBox").hidden=!!s.clientId;
    const cb=form.querySelector("#cliBox"); cb.hidden=!s.clientId;
    if(cl) cb.innerHTML=`Aus der Kartei: <b>${esc(cl.name)}</b> · Reisepass ${cl.pass?esc(cl.pass):'<span class="muted">nicht erfasst</span>'}
      · Telefon ${cl.phone?esc(cl.phone):'<span class="muted">nicht erfasst</span>'}
      ${(!cl.pass||!cl.phone)?'<br><a href="#" data-act="editClient" data-id="'+cl.id+'">Mandantendaten ergänzen</a>':""}`;
    form.querySelector("#docCheckBox").innerHTML=x.ok
      ? '<div class="box ok">Alle Pflichtangaben liegen vor – der Schriftsatz kann raus.</div>'
      : '<div class="box bad"><b>Noch unvollständig – es fehlen:</b><br>'+x.miss.map(m=>"• "+esc(m)).join("<br>")+'</div>';
    const fw=form.querySelector("#feeWarn");
    if(form.fee) fw.innerHTML = s.fee>ravoMaxOf(t.fee)
      ? '<div class="box bad">Die Gebühr überschreitet den Höchstsatz von '+money(ravoMaxOf(t.fee))+' ('+esc(RAVO[t.fee].ref)+
        '). Nach §4 III RAVO ist eine solche Vereinbarung unwirksam; §10 sieht bis zu '+money(RAVO_BUSSE_MAX)+' Geldbuße vor.</div>' : "";
    else fw.innerHTML = posten.some(q=>(+q.amount||0)>ravoMax(q.type,q.qty))
      ? '<div class="box bad">Mindestens ein Posten liegt über dem RAVO-Höchstsatz (§4 III RAVO: unwirksam).</div>' : "";
    drawPosten();
  };
  const fromCase=()=>{
    const c=DB.cases.find(k=>k.id===form.caseId.value);
    if(!c){toast("Bitte zuerst ein Verfahren auswählen");return;}
    const errs=allErrors(c), r=catSum(c.charges);
    if(form.tatDatum&&!form.tatDatum.value) form.tatDatum.value=c.date||"";
    if(form.gruende){
      const z=Object.entries(errs).map(([k,v])=>{const f=FEHLER.find(x=>x.k===k);
        return (f?f.t:k)+" – "+(f?f.s:"")+(v.txt?" "+v.txt:"");});
      if(r.conflicts.length) z.push("Ausschluss bei derselben Tat: "+r.conflicts.join("; ")+" (§35 Nr. 6 StPO)");
      form.gruende.value=z.length?z.join("\n"):"Das Urteil beruht auf einer Verletzung des Gesetzes (§39 StPO).";
    }
    if(form.beweise&&form.beweise.type!=="checkbox"&&!form.beweise.value.trim())
      form.beweise.value="Bodycam-Aufnahmen der abhandelnden Beamten ("+((c.officers||[]).join(", ")||"—")+
        "), Strafakte "+(c.caseNo||"")+", Aussage der Mandantschaft";
    if(form.sachverhalt&&!form.sachverhalt.value.trim())

      form.fehlbeweise.value="Bodycam-Aufnahmen des Vorfalls\nFotos oder Schadensmeldungen\nZeugen außerhalb der abhandelnden Behörde";

        ", zulässig nach §7 StGB waren "+r.stars+" Hafteinheiten und "+money(r.fine)+".";

    draw(); toast("Angaben übernommen");
  };
  draw(); drawWortlaut();
  form.addEventListener("input",e=>{
    /* Eingaben im Wortlaut nur merken, das Feld bleibt stehen */
    if(e.target.id==="wlText")    eigenerText=e.target.value;
    if(e.target.id==="wlBetreff") eigenerBetreff=e.target.value;
    if(e.target.id==="wlEmpf")    eigenerEmpf=e.target.value;
    if(!/^wl/.test(e.target.id||"")) draw();
  });
  form.addEventListener("change",draw);
  form.addEventListener("click",e=>{
    const del=e.target.closest("[data-pdel]");
    if(del){posten.splice(+del.dataset.pdel,1);return draw();}
    const a=e.target.closest("[data-act]"); if(!a) return;
    const act=a.dataset.act;
    if(act==="genDocRef"){e.preventDefault();form.no.value=makeRef(t.kurz,form.clientId.value);return;}
    if(act==="docFeeMax"){e.preventDefault();form.fee.value=ravoMaxOf(t.fee);draw();return;}
    if(act==="fromCase"){e.preventDefault();fromCase();return;}
    if(act==="docPreview"){e.preventDefault();mDocPreview(snap());return;}
    if(act==="pMax"){e.preventDefault();
      form.querySelector("#pAmount").value=ravoMax(form.querySelector("#pType").value,form.querySelector("#pQty").value);return;}
    if(act==="pAdd"){e.preventDefault();
      const amount=+form.querySelector("#pAmount").value||0;
      if(!amount){toast("Bitte einen Betrag eintragen");return;}
      posten.push({type:form.querySelector("#pType").value,qty:Math.max(1,+form.querySelector("#pQty").value||1),
        amount,date:form.querySelector("#pDate").value||today(),desc:form.querySelector("#pDesc").value.trim()});
      form.querySelector("#pAmount").value="";form.querySelector("#pDesc").value="";
      draw();return;}
    if(act==="wlEdit"){e.preventDefault();
      eigenerText=String(t.text||""); eigenerBetreff=t.betreff||""; eigenerEmpf=t.an||"";
      drawWortlaut(); toast("Wortlaut nur für diesen Schriftsatz"); return;}
    if(act==="wlReset"){e.preventDefault();
      if(!confirm("Eigenen Wortlaut verwerfen und wieder die Vorlage verwenden?")) return;
      eigenerText=null; eigenerBetreff=null; eigenerEmpf=null; draw(); drawWortlaut(); toast("Vorlage wird wieder verwendet"); return;}
    if(act==="pFromCase"){e.preventDefault();
      const c=DB.cases.find(k=>k.id===form.caseId.value);
      if(!c){toast("Bitte zuerst ein Verfahren auswählen");return;}
      const neu=caseFees(c,d&&d.id).filter(f=>!posten.some(q=>
        q.type===f.type&&(+q.amount||0)===(+f.amount||0)&&(q.date||"")===(f.date||"")&&(q.desc||"")===(f.desc||"")));
      neu.forEach(f=>posten.push({type:f.type,qty:f.qty||1,amount:f.amount,date:f.date,desc:f.desc}));
      if(!neu.length) toast(caseFees(c).length?"Alle Leistungen sind schon in der Rechnung":"Für dieses Verfahren sind keine Leistungen erfasst");
      else {draw(); toast(neu.length+" Position"+(neu.length>1?"en":"")+" übernommen");}
      return;}
  });
  form.onsubmit=e=>{
    e.preventDefault();
    const s=snap();
    if(!s.no) s.no=makeRef(t.kurz,s.clientId);
    if(eigenerText===null){ delete s.eigenerText; delete s.eigenerBetreff; delete s.eigenerEmpf; }
    if(d){
      Object.assign(d,s,{updated:new Date().toISOString()});
      if(eigenerText===null){ delete d.eigenerText; delete d.eigenerBetreff; delete d.eigenerEmpf; }
    }else DB.docs.push({...s,id:uid(),created:new Date().toISOString()});
    save();closeModal();render();toast(d?"Schriftsatz aktualisiert":"Schriftsatz gespeichert");
  };
}

/* Videobeweis: bekannte Anbieter werden abgespielt, alles andere verlinkt.
   Im PDF steht ohnehin nur die Adresse.                                    */
function videoEmbed(url){
  const u=String(url||"").trim();
  let m=/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/i.exec(u);
  if(m) return "https://www.youtube-nocookie.com/embed/"+m[1];
  m=/streamable\.com\/(?:e\/)?(\w+)/i.exec(u);
  if(m) return "https://streamable.com/e/"+m[1];
  m=/medal\.tv\/.*?clips\/([\w-]+)/i.exec(u);
  if(m) return "https://medal.tv/clip/"+m[1]+"/embed";
  return null;
}
function videoBox(url){
  const u=String(url||"").trim(); if(!u) return "";
  const e=videoEmbed(u);
  return `<div class="sec-title">Videobeweis</div>
    ${e?'<div class="videobox"><iframe src="'+esc(e)+'" allowfullscreen loading="lazy" referrerpolicy="no-referrer"></iframe></div>':""}
    <div class="hint" style="margin-top:6px"><a href="${esc(u)}" target="_blank" rel="noreferrer">${esc(u)}</a>
      ${e?"":" \u2013 dieser Anbieter l\u00e4sst sich nicht einbetten, der Link \u00f6ffnet im Browser."}</div>`;
}

/* =============================================================================
   Suchbare Auswahl - ersetzt lange Klapplisten. Der Wert liegt in einem
   versteckten Feld, damit alles Bestehende (form.clientId.value) weiterlaeuft.
   ============================================================================= */
const PICK={};                      /* name -> [{id,t,s}] fuer den offenen Dialog */
function pickerField(name,label,items,selId,leerText){
  PICK[name]=items;
  const sel=items.find(x=>x.id===selId);
  const kern=`<div class="picker" data-picker="${esc(name)}"${label?"":' style="flex:1"'}>
      <input type="hidden" name="${esc(name)}" value="${esc(selId||"")}">
      <input type="text" class="pin" autocomplete="off" spellcheck="false"
             placeholder="${esc(leerText||"tippen zum Suchen …")}" value="${esc(sel?sel.t:"")}">
      ${sel?'<button type="button" class="pclear" title="Auswahl aufheben">×</button>':""}
      <div class="plist" hidden></div>
    </div>`;
  return label?`<label class="f"><span>${esc(label)}</span>${kern}</label>`:kern;
}
function pickerListe(box,q){
  const name=box.dataset.picker, items=PICK[name]||[];
  const s=(q||"").trim().toLowerCase();
  const treffer=(s?items.filter(x=>(x.t+" "+(x.s||"")).toLowerCase().includes(s)):items).slice(0,40);
  const liste=box.querySelector(".plist");
  liste.innerHTML=treffer.length
    ? treffer.map((x,i)=>`<div class="prow${i===0?" on":""}" data-pid="${esc(x.id)}">
        <div class="pt">${esc(x.t)}</div>${x.s?'<div class="ps">'+esc(x.s)+'</div>':""}</div>`).join("")
    : '<div class="empty muted">kein Treffer</div>';
  liste.hidden=false;
  liste.scrollIntoView({block:"nearest"});   /* der Dialogrumpf scrollt jetzt selbst */
}
function pickerWaehle(box,id){
  const items=PICK[box.dataset.picker]||[], x=items.find(y=>y.id===id);
  const hid=box.querySelector('input[type="hidden"]'), pin=box.querySelector(".pin");
  hid.value=x?x.id:"";
  pin.value=x?x.t:"";
  box.querySelector(".plist").hidden=true;
  const alt=box.querySelector(".pclear");
  if(x&&!alt){ pin.insertAdjacentHTML("afterend",'<button type="button" class="pclear" title="Auswahl aufheben">×</button>'); }
  if(!x&&alt) alt.remove();
  hid.dispatchEvent(new Event("change",{bubbles:true}));
}
/* ein Satz Handler fuer alle Auswahlfelder, egal in welchem Dialog */
document.addEventListener("input",e=>{
  if(!e.target||!e.target.closest) return;
  const pin=e.target.closest(".picker .pin"); if(!pin) return;
  pickerListe(pin.closest(".picker"),pin.value);
});
document.addEventListener("focusin",e=>{
  if(!e.target||!e.target.closest) return;
  const pin=e.target.closest(".picker .pin"); if(!pin) return;
  pin.select(); pickerListe(pin.closest(".picker"),"");
});
document.addEventListener("mousedown",e=>{
  if(!e.target||!e.target.closest) return;
  const row=e.target.closest(".prow");
  if(row){ e.preventDefault(); return pickerWaehle(row.closest(".picker"),row.dataset.pid); }
  const clear=e.target.closest(".pclear");
  if(clear){ e.preventDefault(); const b=clear.closest(".picker"); pickerWaehle(b,""); b.querySelector(".pin").focus(); return; }
  if(!e.target.closest(".picker")) document.querySelectorAll(".plist").forEach(l=>l.hidden=true);
});
document.addEventListener("keydown",e=>{
  if(!e.target||!e.target.closest) return;
  const pin=e.target.closest(".picker .pin"); if(!pin) return;
  const box=pin.closest(".picker"), liste=box.querySelector(".plist");
  if(e.key==="Escape"){ liste.hidden=true; return; }
  const rows=[...liste.querySelectorAll(".prow")];
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){
    e.preventDefault();
    if(liste.hidden){ pickerListe(box,pin.value); return; }
    const i=rows.findIndex(r=>r.classList.contains("on"));
    const n=e.key==="ArrowDown"?Math.min(rows.length-1,i+1):Math.max(0,i-1);
    rows.forEach(r=>r.classList.remove("on"));
    if(rows[n]){ rows[n].classList.add("on"); rows[n].scrollIntoView({block:"nearest"}); }
    return;
  }
  if(e.key==="Enter"){
    const on=liste.hidden?null:liste.querySelector(".prow.on");
    if(on){ e.preventDefault(); pickerWaehle(box,on.dataset.pid); }
  }
});
/* Verlaesst man das Feld ohne Auswahl, steht wieder der gewaehlte Name drin */
document.addEventListener("focusout",e=>{
  if(!e.target||!e.target.closest) return;
  const pin=e.target.closest(".picker .pin"); if(!pin) return;
  setTimeout(()=>{
    const box=pin.closest(".picker"); if(!box) return;
    box.querySelector(".plist").hidden=true;
    const id=box.querySelector('input[type="hidden"]').value;
    const x=(PICK[box.dataset.picker]||[]).find(y=>y.id===id);
    pin.value=x?x.t:"";
  },120);
});

/* =============================================================================

function taskZiel(t){
  if(t.docId){  const d=DB.docs.find(x=>x.id===t.docId);   if(d) return {art:"doc",id:d.id,txt:(tplOf(d.type)||{}).lbl+" "+(d.no||"")}; }
  if(t.caseId){ const c=DB.cases.find(x=>x.id===t.caseId); if(c) return {art:"case",id:c.id,txt:"Fall "+(c.caseNo||"")}; }
  if(t.clientId){const k=client(t.clientId);               if(k) return {art:"client",id:k.id,txt:k.name}; }
  return null;
}
/* Was die Akte selbst an Arbeit vorgibt - nicht gespeichert, immer aktuell */
function taskAuto(){
  const out=[];
  const add=(k,txt,ziel,dring)=>out.push({k,txt,ziel,dring});
  DB.docs.forEach(d=>{
    const t=tplOf(d.type)||{}, cl=client(d.clientId);
    if(d.rueck==="offen")
      add("r"+d.id,"Mit "+(cl?cl.name:"der Mandantschaft")+" besprechen: "+t.lbl+(d.no?" "+d.no:""),
          {art:"doc",id:d.id,txt:d.no||t.lbl},true);
    if((d.status||"entwurf")==="entwurf")
      add("e"+d.id,"Entwurf fertigstellen: "+t.lbl+(d.no?" "+d.no:""),{art:"doc",id:d.id,txt:d.no||t.lbl},false);
    if(d.fee&&!d.paid&&d.type!=="rechnung")
      add("g"+d.id,"Geb\u00fchr offen: "+money(d.fee)+" f\u00fcr "+t.lbl+(d.no?" "+d.no:""),{art:"doc",id:d.id,txt:d.no||t.lbl},false);
  });
  DB.cases.forEach(c=>{
    const cl=client(c.clientId), r=revisionStatus(c);
    if(r.s==="open"&&c.outcome!=="freed"&&c.outcome!=="pending")
      add("f"+c.id,"Revisionsfrist l\u00e4uft: "+(c.caseNo||"")+" \u00b7 "+(cl?cl.name:"?"),{art:"case",id:c.id,txt:c.caseNo||""},true);
    if(errCount(c)&&c.outcome!=="freed")
      add("x"+c.id,"Abhandlungsfehler pr\u00fcfen: "+(c.caseNo||"")+" \u00b7 "+(cl?cl.name:"?"),{art:"case",id:c.id,txt:c.caseNo||""},true);
    const off=feeOpen(c);
    if(off) add("h"+c.id,"Honorar offen: "+money(off)+" \u00b7 "+(c.caseNo||""),{art:"case",id:c.id,txt:c.caseNo||""},false);
  });
  DB.clients.forEach(k=>{
    if(!k.phone||!k.pass)
      add("m"+k.id,"Mandantendaten erg\u00e4nzen: "+k.name+(k.phone?"":", Telefon")+(k.pass?"":", Reisepass"),
          {art:"client",id:k.id,txt:k.name},false);
  });
  return out;
}

function mWerbung(){

  };
  openModal(`<div class="modal-h"><h3>📣 Werbesprüche</h3>

    <div class="modal-b">

      </div>

        <b>{anwalt}</b>, <b>{telefon}</b>, <b>{reisepass}</b>, <b>{kanzlei}</b>, <b>{datum}</b>.
        Geschrieben wird direkt in die Kartei – gespeichert wird beim Tippen.</div>
    </div>`,"narrow");
  zeichne();
  const host=document.querySelector(".modal");
  host.addEventListener("input",e=>{
    const i=e.target.dataset.wtext;
    if(i===undefined) return;
    DB.werbung[+i]=e.target.value; save();       /* kein Neuzeichnen beim Tippen */
  });
  host.addEventListener("click",e=>{
    const b=e.target.closest("[data-act]"); if(!b) return;
    const i=+b.dataset.i;
    if(b.dataset.act==="wAdd"){ DB.werbung.push(""); save(); zeichne();
      const ta=host.querySelector('[data-wtext="'+(DB.werbung.length-1)+'"]'); if(ta) ta.focus(); return; }
    if(b.dataset.act==="wDel"){ DB.werbung.splice(i,1); save(); zeichne(); return; }
    if(b.dataset.act==="wCopy"){
      const txt=fillTpl(DB.werbung[i]||"",werbeWerte()).replace(/—/g,"");
      if(!txt.trim()) return toast("Der Spruch ist leer");
      copyText(txt,"Spruch kopiert"); return;
    }
  });
}

function mRavo(){
  const regel=strafRegel();
  openModal(`<form id="ravoForm">

      Einzeltatbestand mit seinen eigenen Werten. Beispiel: §28 StGB (45.000 $ / 1 ⭐) und §5.1 WaffG (30.000 $ / 2 ⭐)
      ergeben <b>30.000 $ und 2 ⭐</b> – der Waffenparagraph wiegt schwerer und bringt sein eigenes Bußgeld mit.
      Rechnen die Behörden auf deinem Server anders, stell es hier um.</div>
      ${Object.entries(STRAFREGELN).map(([k,v])=>`
        <label class="chk ${regel===k?"on":""}" style="${regel===k?"border-color:var(--acc);background:var(--acc-dim)":""}">
