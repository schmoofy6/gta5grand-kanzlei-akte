{b:"StPO",p:"§56",t:"Folgen des Ausbleibens eines",x:"Zeugen 1. Erscheint ein ordnungsgemäß geladener Zeuge unentschuldigt nicht, so kann gegen ihn ein Bußgeld oder Ordnungshaft verhängt werden. Auch ist die zwangsweise Vorführung des Zeugen durch Beamte zulässig. 2. Eine Entschuldigung hat spätestens 2 (zwei) Stunden vor Prozessbeginn schriftlich bei dem Richter einzugehen. 3. Wird der Zeuge nachträglich genügend entschuldigt, so werden die getroffenen Anordnungen aufgehoben."},
{b:"StPO",p:"§57",t:"Vernehmung von hohen Staatsbeamten",x:"Hohe Beamte können auf Entscheidung des Richters auch außerhalb der Gerichtsverhandlung vernommen werden. Das Protokoll über ihre richterliche Vernehmung ist in der Hauptverhandlung zu verlesen."},
{b:"StPO",p:"§58",t:"Zeugnisverweigerungsrecht der Angehörigen",x:"Zur Verweigerung des Zeugnisses sind berechtigt: 1. der Ehepartner des Beschuldigten. 2. wer mit dem Beschuldigten in gerader Linie verwandt oder verschwägert ist."},
{b:"StPO",p:"§59",t:"Zeugnisverweigerungsrecht der Berufsgeheimnisträger",x:"1. Zur Verweigerung des Zeugnisses sind ferner Ärzte berechtigt. 2. Außerdem Anwälte und/oder Psychologen, die eine Schweigepflicht dem Angeklagten gegenüber eingegangen sind.Aussage 3. Ausgenommen von dem Zeugnisverweigerungsrecht sind Beamte während ihrer Dienstzeit oder vor Gericht in dienstlicher Angelegenheit."},
{b:"StPO",p:"§60",t:"Auskunftsverweigerungsrecht",x:"Jeder Zeuge kann die Auskunft auf solche Fragen verweigern, deren Beantwortung ihm selbst oder einem der in §58 bezeichneten Angehörigen wegen einer Straftat oder einer Ordnungswidrigkeit verfolgt zu werden. Der Zeuge ist über sein Recht zur Verweigerung der Auskunft, im Vorhinein, zu belehren"},
{b:"StPO",p:"§61",t:"Belehrung",x:"Eine Aussage unter Eid ist eine Vernehmung, die durch einen Schwur wahrheitsgemäß erfolgen muss. Vor der Vernehmung werden die Zeugen zu wahrheitsgemäßen Aussagen ermahnt mit dem genauen Wortlaut: “Schwören sie die ganze Wahrheit und nichts als die Wahrheit zu sagen” darauf antwortet die zu vernehmende Person mit “Ich Schwöre”. Sie werden ebenfalls darauf aufmerksam gemacht, dass sie sich bei einer Falschaussage des Meineids strafbar machen. Eine Aussage unter Eid darf lediglich in einem Verfahren mit Zustimmung und Anwesenheit eines vollwertigen Justizmitarbeiters oder von einem Rechtsanwalt im Zuge eines Antrags auf Familienlizenz vorgenommen werden."},
{b:"StPO",p:"§62",t:"Beschränkung zur Vernehmung;",x:"Zeugenschutz 1. Die Vernehmung beginnt damit, dass der Zeuge über Vornamen, Nachnamen, Geburtsnamen, Alter, Beruf und Wohnort befragt wird. Ein Zeuge, der Wahrnehmungen in amtlicher Eigenschaft gemacht hat, kann statt des Wohnortes den Dienstort angeben. 2. Besteht ein begründeter Anlass zu der Besorgnis, dass durch die Offenbarung der Identität oder des Wohn- oder Aufenthaltsortes Leben, Leib oder Freiheit des Zeugen oder einer anderen Person gefährdet wird, so kann ihm gestattet werden, Angaben zur Person zu verweigern. Er hat jedoch in der Hauptverhandlung auf Befragen anzugeben, in welcher Eigenschaft ihm die Tatsachen, die er beschreibt, bekannt geworden sind."},
{b:"StPO",p:"§63",t:"Übermittlung und Inhalt der Anklageschrift",x:"Die Anklageschrift ist dem Beschuldigten, bzw. seinem rechtlichen Vertreter in der Form zukommen zu lassen, als dass sie den genauen Tatvorwurf (Zeitraum, Ort, Tat), sowie die rechtlichen Tatbestände enthält."},
{b:"StPO",p:"§64",t:"Bestimmung eines Termins zur Hauptverhandlung",x:"Der Termin zur Hauptverhandlung wird von dem Vorsitzenden des Gerichtes anberaumt."},
{b:"StPO",p:"§65",t:"Ladungsfrist",x:"Zwischen der Zustellung der Ladung und der Hauptverhandlung muss eine Frist von mindestens 48 (achtundvierzig) Stunden liegen."},
{b:"StPO",p:"§66",t:"Ununterbrochene Gegenwart",x:"Die Hauptverhandlung erfolgt in ununterbrochener Gegenwart der zur Urteilsfindung berufenen Personen sowie der Staatsanwaltschaft."},
{b:"StPO",p:"§67",t:"Mehrere Staatsanwälte und Verteidiger",x:"1. Es können zwei Beamte der Staatsanwaltschaft und zwei Verteidiger beim Schnellverfahren sowie in der Hauptverhandlung mitwirken. 2. Beide Verteidiger werden separat bezahlt. 3. Sollten zwei Verteidiger auf längere Zeit zusammenarbeiten, besteht die Möglichkeit eine Kanzlei anzumelden, allerdings keine Pflicht."},
{b:"StPO",p:"§68",t:"Aussetzung und Unterbrechung",x:"Über die Aussetzung einer Hauptverhandlung oder deren Unterbrechung entscheidet das Gericht. Kürzere Unterbrechungen ordnet der Vorsitzende an."},
{b:"StPO",p:"§69",t:"Ausbleiben des Angeklagten",x:"Gegen einen ausgebliebenen Angeklagten findet eine Hauptverhandlung nicht statt. Ist das Ausbleiben des Angeklagten nicht genügend entschuldigt, so ist die Vorführung anzuordnen oder ein Haftbefehl zu erlassen, soweit dies zur Durchführung der Hauptverhandlung geboten ist."},
{b:"StPO",p:"§70",t:"Anwesenheitspflicht des Angeklagten",x:"Der erschienene Angeklagte darf sich aus der Verhandlung nicht entfernen. Entfernt der Angeklagte sich unerlaubt der Verhandlung, so kann dieser in seiner Abwesenheit zu Ende geführt werden."},
{b:"StPO",p:"§71",t:"Verbindung mehrerer Strafsachen",x:"Das Gericht kann im Falle eines Zusammenhangs zwischen mehreren bei ihm anhängigen Strafsachen ihre Verbindung zum Zwecke der gleichzeitigen Verhandlung anordnen."},
{b:"StPO",p:"§72",t:"Verhandlungsleitung",x:"Die Leitung der Verhandlung, die Vernehmung des Angeklagten und die Aufnahme der Beweise erfolgt durch den Vorsitzenden."},
{b:"StPO",p:"§73",t:"Zeugenvernehmung",x:"Die Vernehmung von Zeugen der jeweils anderen Partei, Staatsanwaltschaft und Verteidigung, ist gestattet."},
{b:"StPO",p:"§74",t:"Gang der Hauptverhandlung",x:"1. Die Hauptverhandlung beginnt mit dem Aufruf der Sache. Der Vorsitzende stellt die Anwesenheiten, sowie die persönlichen Informationen des Angeklagten fest. 2. Die Staatsanwaltschaft verliest die Anklageschrift. 3. Die Verteidigung verliest ihr Plädoyer. 4. Der Angeklagte wird über sein Zeugnisverweigerungsrecht aufgeklärt. Ist der Angeklagte zur Äußerung bereit, so wird er zur Sache vernommen. 5. Die Vernehmung der geladenen Zeugen. 6. Ggf. erfolgt eine weitere Beweisaufnahme. 7. Es erfolgt ein Schlussplädoyer beider Seiten. 8. Das Gericht zieht sich zur Beratung zurück und verkündet final das Urteil."},
{b:"StPO",p:"§75",t:"Beweisaufnahme",x:"Als erstes wird der Angeklagte und danach der Kläger im Zeugenstand vernommen. Danach werden alle weiteren geladenen Zeugen im Wechsel in den Zeugenstand gerufen und einzeln vernommen. Die Vernehmung von Zeugen der jeweils anderen Partei, Staatsanwaltschaft und Verteidigung, ist gestattet."},
{b:"StPO",p:"§76",t:"Befragung des Angeklagten",x:"Auf Verlangen ist auch dem Staatsanwalt und dem Verteidiger nach der Vernehmung des Angeklagten und nach jeder einzelnen Beweiserhebung Gelegenheit zu geben, Fragen zu stellen."},
{b:"StPO",p:"§77",t:"Schlussvorträge, Recht des letzten Wortes",x:"1. Nach dem Schluss der Beweisaufnahme erhalten der Staatsanwalt und sodann der Angeklagte zu ihren Ausführungen und Anträgen das Wort. 2. Dem Angeklagten gebührt das letzte Wort. 3. Der Angeklagte ist, auch wenn ein Verteidiger für ihn gesprochen hat, um sein letztes Wort zu erfragen."},
{b:"StPO",p:"§78",t:"Urteil",x:"1. Das Urteil ergeht im Namen des Volkes. 2. Die Hauptverhandlung schließt mit der auf die Beratung folgenden Verkündung des Urteils. 3. Die Urteilsformel gibt die rechtliche Bezeichnung der Tat an, deren der Angeklagte schuldig gesprochen wird. Wird eine Geldstrafe verhängt, so ist der Betrag in die Urteilsformel aufzunehmen. Bei der Verkündung des Urteils muss die Begründung des Urteils näher erklärt werden."},
{b:"StPO",p:"§79",t:"Hauptverhandlungsprotokoll",x:"In der Hauptverhandlung muss ein ausführliches Protokoll angefertigt werden, das von dem Vorsitzenden unterzeichnet wird. Das Hauptverhandlungsprotokoll muss folgendes beinhalten: 1. den Ort, die Zeit und den Tag der Verhandlung 2. alle anwesenden Personen, die aktiv an der Verhandlung mitwirken. 3. die Straftaten laut Anklage. 4. Angaben zum Verlauf der Verhandlung. 5. Das Urteil."},
{b:"StPO",p:"§80",t:"Inhalt des Hauptverhandlungsprotokolls",x:"1. den Ort und den Tag der Verhandlung 2. alle anwesenden Personen 3. die Straftaten laut Anklage 4. Angaben zum Verlauf der Verhandlung"},
{b:"StPO",p:"§81",t:"Nebenklagebestimmung",x:"Die Nebenklage, beschreibt eine Klage, mit der sich jemand als Betroffener dem öffentlichen, durch das von der Staatsanwaltschaft eingeleiteten Strafverfahren anschließt, um somit seine Interessen zu vertreten."},
{b:"StPO",p:"§82",t:"Anspruch auf eine Nebenklage",x:"Jede Person, welche physisch oder psychisch verletzt wurde, hat das Recht sich der erhobenen öffentlichen Klage der Staatsanwaltschaft mit der Nebenklage anzuschließen, wenn dies aus besonderen Gründen, insbesondere wegen der schweren Folgen der Tat zur Wahrnehmung seiner Interessen geboten erscheint."},
{b:"StPO",p:"§83",t:"Pflicht eines Prozessbevollmächtigten",x:"Jede Person, welche ein Anrecht auf eine Nebenklage hat, benötigt einen lizenzierten Rechtsanwalt. Dieser ist für eine Anschlusserklärung und für die Vertretung vor Gericht zuständig."},
{b:"StPO",p:"§84",t:"Anschlusserklärung",x:"Der Antrag auf eine Nebenklage muss dem Gericht schriftlich mit einer Begründung zugesandt werden."},
{b:"StPO",p:"§85",t:"Haftbefehle und Beschlüsse",x:"1. Ein Antrag auf Haftbefehl oder eine Vorladung muss von einem Staatsanwalt bearbeitet und unterschrieben werden (alternativ auch Richterschaft oder Justizministerium).Beschlüsse dürfen nur von der Richterschaft, den Justizministern und dem Gouverneursbüro unterschrieben werden. 2. Jeder Haftbefehl muss zusätzlich, sollte ein Antragsteller vorhanden sein, die Unterschrift eines Richters oder Justizministers tragen. 3.Haftbefehle dürfe nur von der Richterschaft, dem Justizministern oder dem Gouverneursbüro bearbeitet werden Der Haftbefehl muss folgendes beinhalten: a) Die Organisation des Antragstellers b) Das Aktenzeichen c) Den Sachbearbeiter d) Das aktuelle Datum e) Den Tatort sowie die Tatzeit f) Die Tatvorwürfe g) Das Strafmaß h) Den Tathergang i) Das Fazit. 4. Die fertigen Haftbefehle werden für die Organisationsleiter der Behörden öffentlich gemacht. Diese können die Haftbefehle dann an ihre Mitarbeiter zur Ausführung aushändigen. 5. Ein Haftbefehl oder Beschluss muss von der Justiz widerrufen werden, sofern gegen einen der o.g. Absätze des §85 verstoßen wird. 6. Haftbefehle oder Beschlüsse sind ab dem Zeitpunkt der Ausstellung 14 Tage lang gültig. 7. Eine Verlängerung eines Haftbefehls darf nur von einem Bundesrichter, Justizminister oder dem Gouverneur oder seiner direkten Stellvertretung erfolgen. 8. Ein Beschluss kann ein Bußgeld, einen Lizenzentzug sowie eine interne Disziplinarstrafe enthalten. 9. Jeder Beklagte sowie der Rechtsanwalt haben das Recht, seinen Haftbefehl oder Beschluss auf Anfrage einzusehen"},
{b:"StPO",p:"§86",t:"Aktenzeichen",x:"1. Akten dürfen von jeder staatlichen Organisation erstellt und unterschrieben werden. 2. Diese werden zur Weiterbearbeitung (Haftbefehle, Vorladungen oder Beschlüsse) an das Justizministerium weitergeleitet. 3. Akten beinhalten mindestens: a) Den Sachbearbeiter. b) Das Datum. c) Die Unterschrift des Sachbearbeiters. d) Das Aktenzeichen. e) Eine Erklärung im Sachzusammenhang zur Akte."},
{b:"StPO",p:"§87",t:"Sammelrevisionen für Bürgerinnen und Bürger",x:"Sammel Revisionen für Bürgerinnen und Bürger 1. Zulässigkeit der Sammelrevision: Eine Sammelrevision ist zulässig, wenn mehrere Personen nachweislich an derselben Tat beteiligt waren und die zugrunde liegenden Tatsachen und rechtlichen Fragestellungen identisch sind. Sammelrevisionen sind unter folgenden Bedingungen möglich: Alle Antragsteller wurden im Zusammenhang mit demselben Vorfall oder Tatkomplex verurteilt. Die rechtlichen Gründe für die Revision sind für alle Antragsteller gleich. 2. Notwendige Nachweise für eine Sammelrevision: Um eine Sammelrevision zu beantragen, müssen die Beteiligten konkrete Nachweise erbringen, die ihre gemeinsame Tatbeteiligung belegen. Diese Nachweise umfassen: a) Gemeinsame Anklage oder Urteil: Es muss eine Strafakte oder ein Akteneintrag vorliegen, in dem alle beteiligten Personen als Tatverdächtige oder als straffällig anzusehen sind und die Tatvorwürfe auf demselben Sachverhalten beruhen. Alternativ können gesonderte Anträge auf Revisionen eingereicht werden, wenn diese nachweislich auf denselben Tatkomplex bezogen sind. b) Identische Beweismittel: Es muss nachgewiesen werden, dass die für die ursprünglichen Akten- und Strafeinträge herangezogenen Beweise, wie z.B. Videoaufnahmen, Zeugenaussagen oder verwertbare Bodycams, die für alle Beteiligten identisch sind. Gemeinsame Beweisstücke (z.B. Zeugenaussagen) oder gemeinsame Beweisvorlagen (Bodycams, Dokumente) müssen eingereicht werden. c) Tatzeit und Tatort: Die Revisionsteilnehmer müssen nachweisen, dass sie sich zur gleichen Zeit am gleichen Tatort befanden. Hierfür können: Polizeiberichte, Vernehmungsprotokolle, Bodycams oder andere nachweisbare Ortungsdaten genutzt werden. d) Zeugenaussagen oder eidesstattliche Erklärungen: Zeugen, die in der ursprünglichen Verhandlung Aussagen gemacht haben, können durch eidesstattliche Erklärungen bestätigen, dass die Antragsteller an derselben Tat beteiligt waren. Ergänzend können von den Antragstellern selbst eidesstattliche Erklärungen über die gemeinsame Tatbeteiligung abgegeben werden. 3. Form und Ablauf der Einreichung: Eine Sammelrevision muss von einem gemeinsamen Vertreter (Anwalt oder autorisierte Vertretung) eingereicht werden. Die Einreichung erfolgt schriftlich und umfasst:Die vollständigen Namen aller Antragsteller, Eine klare Darlegung der gemeinsamen Tatvorwürfe und der identischen Rechtsgründe, Alle relevanten Nachweise zur gemeinsamen Beteiligung (siehe Punkt 2). 4. Prüfung der Nachweise: Das Gericht wird die Nachweise auf formelle Richtigkeit und inhaltliche Übereinstimmung prüfen. Eine Sammelrevision wird abgelehnt, wenn: Die Nachweise unzureichend oder widersprüchlich sind, Einzelne Antragsteller abweichende oder zusätzliche Tatvorwürfe haben, Nicht ausreichend belegt wird, dass die Antragsteller zur gleichen Zeit am gleichen Tatort beteiligt waren. 5. Verfahrensverlauf: Die Sammelrevision wird in einem gemeinsamen Verfahren verhandelt. Die Beweisaufnahme und Anhörung erfolgen einheitlich für alle Antragsteller. Jede Entscheidung des Gerichts gilt für alle Antragsteller gleichermaßen.. 6. Folgen einer erfolgreichen Sammelrevision: Wenn die Sammelrevision erfolgreich ist, werden die Urteile für alle Antragsteller gleichermaßen aufgehoben oder abgeändert. Eventuelle Entschädigungszahlungen werden ebenfalls einheitlich festgelegt. 7. Ausschluss der Sammelrevision: Eine Sammelrevision ist ausgeschlossen, wenn: Einzelne Antragsteller abweichende oder zusätzliche Vorwürfe oder Beweise haben, Die Revisionsthemen nicht für alle Antragsteller gleich sind. 8. Fristen und Formalitäten: Der Antrag auf Sammelrevision muss innerhalb von 72 Stunden eingereicht werden. Die Einhaltung der formellen Voraussetzungen ist zwingend."},
{b:"StPO",p:"§88",t:"Kronzeugenregelung",x:"1. Wer als Beschuldigter oder Angeklagter einer Straftat durch freiwillige Offenbarung seines Wissens wesentlich dazu beiträgt, eine Straftat aufzuklären oder zu verhindern, kann eine Strafmilderung erhalten. 2. Über die Gewährung einer Strafmilderung oder Straffreiheit entscheidet die Staatsanwaltschaft in Rücksprache mit dem zuständigen Richter. Die Strafmilderung kann bis zur Hälfte des vorgesehenen Strafmaßes betragen. In besonders schwerwiegenden Fällen, in denen die Aussage des Kronzeugen maßgeblich zur Aufklärung oder Verhinderung einer Straftat beiträgt, kann vollständige Straffreiheit gewährt werden. 3. Die Kronzeugenregelung findet keine Anwendung bei: a) Terroristischen Akten gem. §49 StGB. b) Mord gem. §25 StGB. c) Hochverrat gem. §45 StGB. 4. Die Aussage des Kronzeugen muss wahrheitsgemäß erfolgen. Wird eine falsche Aussage nachgewiesen, entfällt die Strafmilderung rückwirkend und es wird zusätzlich gem. §27 StGB (Meineid) bestraft."},
{b:"RAVO",p:"§1",t:"Gebote",x:"Machen Sie sich selbst nicht strafbar und verstoßen Sie nicht gegen die RAVO (es folgt der Entzug der Anwaltszulassung sowie eine Berufssperre von bis zu 14 Tagen). Kennen und verstehen Sie das geltende Recht. Verhalten Sie sich stets professionell und vorbildlich. Pflegen Sie einen guten Umgang zu Kollegen, der Justiz und den Exekutiven. Vertreten Sie Ihre Mandanten nach bestem Wissen und Gewissen. Wichtig: Eine Tätigkeit bei einer Behörde zusätzlich zu Ihrer Anwaltstätigkeit ist nicht möglich, Sie können jedoch als sog. Organisationsanwalt fungieren. Als Orgaanwalt dürfen Sie nur staatliche Organisationen kostenfrei vertreten, eine Ausnahme bildet das Ausstellen eines Antrags auf eine Familienlizenz, welche ein Orgaanwalt gegen Gebühr auch an Bürger ausstellen darf. Die Gesetze sowie den Bußgeldkatalog lesen und verstehen. Als Orgaanwalt dürfen Sie nur staatliche Organisationen vertreten (s. §8)."},
{b:"RAVO",p:"§2",t:"Aufnahme in die Anwaltskammer",x:"Um als lizenzierter Rechtsanwalt tätig sein zu können, sind Sie dazu verpflichtet, bei der Anwaltskammer ein Staatsexamen abzulegen. Die Staatsexamensprüfung können Sie im Ministerium bei der Justiz beantragen. Bei Fragen wenden Sie sich direkt an die Justizmitarbeiter am Regierungsgebäude. Nach bestandener Prüfung erfolgt Ihre Eintragung in die offizielle Anwaltsliste, die für einen Zeitraum von 30 Tagen gültig ist. Danach müssen Sie Ihre Eintragung/Verlängerung bei der Justiz neu beantragen. Jeder Rechtsanwalt, Orgaanwalt und vollwertige Justiz-Mitarbeiter muss zwingend eine Anwaltslizenz besitzen. Dauer der Staatsexamensprüfungen: ca. 60 Minuten. Prüfungsgebühren: 100.000$ pro bestandenem Staatsexamen. Ausstellung der Lizenz: 100.000$ bei Bestehen der Prüfung. Dauer Auffrischung der Anwaltszulassung: nur 1x alle 30 Tage. Gebühren: 100.000$."},
{b:"RAVO",p:"§3",t:"Pflichten eines Rechtsanwalts",x:"(1) Rechtsanwälte sind verpflichtet, das geltende Recht zu kennen und ihre Tätigkeit gewissenhaft, professionell und sachlich auszuüben. (2) Organisationsanwälte gelten während der Ausübung ihrer Tätigkeit innerhalb der jeweiligen staatlichen Organisation als Amtsträger im Sinne der geltenden Gesetze. (3) Rechtsanwälte haben gegenüber Gerichten, der Justiz sowie staatlichen Institutionen ein sachliches und professionelles Verhalten zu wahren. (4) Organisationsanwälte dürfen im Rahmen ihrer Tätigkeit behördliche Wappen, Zeichen sowie offizielle Dokumentenvorlagen der jeweiligen staatlichen Organisation verwenden. Nichtorganisationsanwälten ist die Nutzung behördlicher Hoheitszeichen oder offizieller Organisationskennzeichnungen untersagt. (5) Rechtsanwälte sowie Organisationsanwälte sind verpflichtet, sämtliche anwaltlichen Leistungen nachvollziehbar zu dokumentieren. Die Dokumentation hat mindestens zu enthalten: a) den Namen des Mandanten und Telefonnummer, b) die erbrachte Leistung, c) das Datum der Leistungserbringung, d) die verlangte bzw. vereinbarte Gebühr. (6) Das Justizministerium, die Rechtsanwaltskammer sowie das Gouverneursbüro sind berechtigt, durch Beschluss Einsicht in die Dokumentationen gemäß Abs. 5 zu verlangen, soweit dies zur Prüfung möglicher Verstöße gegen geltendes Recht, gegen die RAVO oder zur Überprüfung der ordnungsgemäßen Berufsausübung erforderlich ist, dabei dürfen nur die letzten 14 Tage beachtet werden. (7) Die fehlende, unvollständige oder bewusst fehlerhafte Dokumentation anwaltlicher Leistungen kann berufsrechtliche Maßnahmen nach dieser Verordnung zur Folge haben. (8) Anwälte sind dazu verpflichtet, eine Tätigkeit bei einer Behörde vorher bei der Anwaltskammer anzumelden."},
{b:"RAVO",p:"§4",t:"Gebührenordnung",x:"(1) Rechtsanwälte sind verpflichtet, sich an die durch diese Verordnung festgelegte Gebührenordnung zu halten. Die festgelegten Höchstbeträge dürfen nicht überschritten werden. Ein Verstoß gegen die Gebührenordnung stellt einen Verstoß gegen die RAVO dar. (2) Die nachfolgenden Gebühren stellen die maximal zulässigen Vergütungen für anwaltliche Tätigkeiten dar: a) Beratung eines Mandanten: maximal 25.000 $ pro angefangener viertel Stunde. b) Verteidigung vor ordentlichem Gericht sowie vor dem Revisionsgericht: maximal 115.000 $ pro angefangener halber Stunde. c) Schriftlicher Revisionsantrag: maximal 125.000 $. d) Schriftlicher Antrag auf Familiengründung: maximal 75.000 $. e) Sonstige schriftliche Anträge: maximal 100.000 $. f) Verteidigung im Schnellverfahren: maximal 125.000 $ pro angefangener halber Stunde. (3) Vereinbarungen und Verträge, welche die zulässigen Höchstbeträge überschreiten, sind unwirksam. (4) Die Regierung ist berechtigt, die Gebührenordnung jederzeit anzupassen, sofern dies zur Wahrung der Verhältnismäßigkeit, Transparenz oder des öffentlichen Interesses erforderlich ist."},
{b:"RAVO",p:"§5",t:"Anwaltsgeheimnis",x:"Sie sind während der Vertretung Ihres Mandanten sowie darüber hinaus zur Verschwiegenheit verpflichtet. Ein Verstoß gegen Ihre Verschwiegenheitspflicht wird strafrechtlich belangt."},
{b:"RAVO",p:"§6",t:"Entlassung auf Kaution",x:"Es ist jedem Anwalt strengstens untersagt, Straftäter ohne vorausgegangene Erlaubnis durch ein Gericht oder das Justizministerium aus der Haft zu entlassen. Bei Nichtbeachtung erfolgt eine Bestrafung gem. §§22a, 30, 37 StGB."},
{b:"RAVO",p:"§7",t:"Beurkundungen (Familienlizenz)",x:"1. Um im Staate von San Andreas eine Familie gründen zu können, ist zuvor eine entsprechende Familienlizenz zu erwerben. 2. Um diese Familienlizenz erwerben zu können, ist es verpflichtend, sich einen Antrag durch einen lizenzierten Rechtsanwalt oder Orgaanwalt erstellen zu lassen, dieser muss folgendes beinhalten: a) Überschrift, welche lautet Antrag auf eine Familienlizenz, b) Datum, c) persönliche Daten des Antragstellers (Name, Reisepassnummer, Telefonnummer), d) persönliche Daten des Anwalts (Name, Reisepassnummer, Telefonnummer), e) Name der zukünftigen Familie, f) Hausnummer der zukünftigen Familie, g) eidesstattliche Versicherung darüber, dass die Familie rein zu legalem Zwecke dient, h) Unterschrift des Mandanten, i) Unterschrift des Anwalts. 3. Nach Einreichung Ihres Antrags wird die Anfrage Ihres Mandanten durch Angestellte der Justiz geprüft. Sie erhalten sodann Rückmeldung über Genehmigung oder Ablehnung der Anfrage und können diese dann Ihrem Mandanten mitteilen. 4. Ihr Mandant kann die Abholung der Familienlizenz sodann persönlich durchführen. 5. Der Familienname darf keine eindeutige oder direkte Assoziation mit kriminellen Aktivitäten in San Andreas haben. Kulturelle oder geografische Assoziationen, die außerhalb von San Andreas bestehen, dürfen nicht zur Ablehnung der Lizenz führen."},
{b:"RAVO",p:"§8",t:"Organisationsanwälte",x:"1. Ein Rechtsanwalt kann entweder als Organisationsanwalt oder als Waffenträger tätig sein – eine gleichzeitige Ausübung beider Funktionen ist nicht zulässig. 2. Wer einmal als Organisationsanwalt tätig ist, bleibt dies so lange, wie er Teil der Organisation ist und über eine gültige Anwaltslizenz verfügt. Beim Verlassen der Organisation ist die Lizenz im Vorfeld bei der Justiz abzugeben. 3. Es ist einem Organisationsanwalt untersagt, über die Dauer der Anwaltslizenz eine Waffe mitzuführen. Dies gilt uneingeschränkt, auch zum Eigenschutz. Ein Organisationsanwalt wird nicht als Waffenträger eingestuft. 4. Organisationsanwälte dürfen nur staatliche Beamte vertreten. Die Vertretung von Zivilisten ist ihnen strengstens untersagt. 5. Wer als Organisationsanwalt tätig werden möchte, muss eine schriftliche Bestätigung des Leaders oder Vize-Leaders im Vorfeld der jeweiligen staatlichen Organisation bei der Justizverwaltung einreichen. Ohne diese Bestätigung ist die Zulassung zum Examen als auch die Ausübung der Tätigkeit als Organisationsanwalt nicht gestattet."},
{b:"RAVO",p:"§9",t:"Vereidigung",x:"Jeder Rechtsanwalt ist verpflichtet, einen Eid zu leisten, in dem er schwört, die verfassungsmäßige Ordnung zu wahren und die Pflichten seines Berufsstandes gewissenhaft zu erfüllen."},
{b:"RAVO",p:"§10",t:"Berufsrechtliche Sanktionen",x:"(1) Verstöße gegen die Rechtsanwaltsverordnung können berufsrechtlich geahndet werden. (2) Mögliche Maßnahmen sind insbesondere: a) Verwarnung, b) Geldbuße, c) befristete Berufssperre (maximal 14 Tage), d) Entzug der Anwaltszulassung (gemäß §28 d. StPO). (3) Die Höhe einer Geldbuße beträgt je nach Schwere des Verstoßes bis zu 300.000 $. (4) Zuständig für berufsrechtliche Maßnahmen ist das Justizministerium beziehungsweise die Leitung der Rechtsanwaltskammer sowie das Gouverneursbüro. (5) Organisationsanwälte können zusätzlich wegen eines Dienstvergehens belangt werden."},
{b:"StGB",p:"§1",t:"Personen- und Sachbegriffe",x:"Behörden iSd StGB sind: 1. GOV (Bundesbehörde, Government of San Andreas), 2. FIB (Bundesbehörde, Federal Investigation Bureau), 3. LSPD (Los Santos Police Department), 4. SAHP (San Andreas Highway Patrol), 5. NG (Nationalgarde), 6. EMS (Emergency Services). Mitarbeiter der o.g. Behörden sind Amtsträger (Beamte). Staatliche Einrichtungen iSd StGB sind: 1. Alle Regierungsgebäude, 2. Alle Polizeistationen, 3. Alle Krankenhäuser, 4. Das Fort Zancudo. Der Einfachheit halber wird im gesamten Gesetzestext die männliche Form verwendet; die weibliche und diverse Form sind selbstverständlich eingeschlossen."},
{b:"StGB",p:"§2",t:"Keine Strafe ohne Gesetz",x:"Eine Tat kann nur bestraft werden, wenn die Strafbarkeit gesetzlich bestimmt war, bevor die Tat begangen wurde."},
{b:"StGB",p:"§4",t:"Versuch und Rücktritt",x:"1. Jede Straftat ist im Versuch bereits strafbar und wird gleich der vollendeten Tat bestraft. 2. Ein strafrechtlicher Rücktritt vom Versuch ist gegeben, wenn ein Täter freiwillig eine weitere Ausführung seiner Tat aufgibt oder deren Vollendung verhindert. 3. Ein Rücktritt kann sich haftmildernd auswirken."},
{b:"StGB",p:"§5",t:"Vorsatz, Fahrlässigkeit, Unterlassung",x:"1. Fahrlässig handelt, wer die im Verkehr objektiv erforderliche Sorgfalt außer Acht lässt. 2. Vorsätzlich handelt, wer in Wissen und/oder Wollen über die Tatbestandsverwirklichung handelt. 3. Wer es unterlässt, einen Erfolg eines Tatbestandes aufzuhalten oder unmöglich zu machen, wenn er rechtlich dafür einzustehen hat, macht sich durch seine Unterlassung strafbar."},
{b:"StGB",p:"§6",t:"Beihilfe, Mittäterschaft, Anstiftung",x:"1. Unter Beihilfe ist jeder Tatbeitrag zu verstehen, der die Haupttat entweder ermöglicht oder erleichtert hat. 2. Mittäterschaft ist die gemeinschaftliche Begehung einer Straftat durch bewusstes und/oder gewolltes Zusammenwirken. Die Mittäterschaft wird der Haupttat gleich bestraft. 3. Kann gemäß aller objektiver Tatbestände davon ausgegangen werden, dass ein Dritter dem Täter Beihilfe geleistet und/oder dieser beigewohnt hat und nichts gegen den Versuch bzw. die Tat selbst unternommen hat, gilt ebenfalls als Mittäter. 4. Anstifter ist, wer vorsätzlich einen anderen zu dessen vorsätzlich begangener rechtswidriger Tat bestimmt hat, über die nicht er selbst, sondern der andere die Tatherrschaft hatte. Die Anstiftung wird der Haupttat gleich bestraft."},
{b:"StGB",p:"§7",t:"Tateinheit und Tatmehrheit",x:"1. Tateinheit: Verletzt der Täter durch dieselbe Handlung mehrere Strafgesetze oder dasselbe Strafgesetz mehrmals, so ist das höchste Bußgeld und die höchste Haftstrafe aller verwirklichten Tatbestände zu verhängen. 2. Tatmehrheit: Verletzt der Täter durch mehrere getrennte Handlungen mehrere Strafgesetze oder dasselbe Strafgesetz mehrmals, so ist das höchste Bußgeld und die höchste Haftstrafe aller verwirklichten Tatbestände zu verhängen."},
{b:"StGB",p:"§8",t:"Hausfriedensbruch",x:"1. Wer in die Wohnung, Häuser, Lagerräume, in die Geschäftsräume oder in das befriedete Besitztum eines anderen oder in abgeschlossene Räume widerrechtlich eindringt, oder wer auf die Aufforderung des Berechtigten sich nicht entfernt, wird bestraft. 2. Die Tat wird nur auf Antrag verfolgt."},
{b:"StGB",p:"§9",t:"Beleidigung",x:"1. Wer einen anderen beschimpft, verspottet oder Äußerungen tätigt, die seine Ehre verletzen, wird bestraft. 2. Die Tat wird nur auf Antrag verfolgt."},
{b:"StGB",p:"§10",t:"Üble Nachrede / Verleumdung",x:"1. Wer wider besseres Wissen in Beziehung auf einen anderen eine unwahre Tatsache behauptet oder verbreitet, welche denselben verächtlich zu machen oder in der öffentlichen Meinung herabzuwürdigen geeignet ist, wird bestraft. 2. Die Tat wird nur auf Antrag verfolgt."},
{b:"StGB",p:"§11",t:"Sachbeschädigung",x:"1. Eine Sachbeschädigung begeht, wer eine fremde Sache willentlich und/oder wissentlich beschädigt oder zerstört. 2. Die Tat wird nur auf Antrag verfolgt."},
{b:"StGB",p:"§12",t:"Körperverletzung",x:"1. Eine Körperverletzung begeht, wer eine andere Person körperlich misshandelt oder an der Gesundheit schädigt. 2. Wenn eine Körperverletzung fahrlässig begangen wird, so ist dies als minder schwerer Fall der Körperverletzung zu werten. 3. Die Tat wird nur auf Antrag verfolgt."},
{b:"StGB",p:"§13",t:"Freiheitsberaubung",x:"1. Eine Freiheitsberaubung begeht, wer einen Menschen einsperrt oder auf andere Weise der Freiheit beraubt."},
{b:"StGB",p:"§14",t:"Geiselnahme",x:"Eine Geiselnahme verübt, wer einen Menschen entführt oder sich eines Menschen bemächtigt, um ihn oder einen Dritten durch die Drohung mit dem Tod oder einer Körperverletzung (§ 12 f.) des Opfers oder mit dessen Freiheitsentziehung zu einer Handlung, Duldung oder Unterlassung zu nötigen, oder wer die von ihm durch eine solche Handlung geschaffene Lage eines Menschen zu einer solchen Nötigung ausnutzt."},
{b:"StGB",p:"§15",t:"Bildung bewaffneter Gruppen",x:"Wer eine Gruppe von min. 3 Personen, die über Waffen oder andere gefährliche Werkzeuge verfügt, für eine strafbare Handlung bildet oder dabei befehligt oder wer sich einer solchen Gruppe anschließt, sie mit Waffen oder Geld versorgt oder sonst unterstützt, wird bestraft."},
{b:"StGB",p:"§16",t:"Erpressung",x:"1. Eine Erpressung begeht, wer einen Menschen rechtswidrig mit Gewalt oder durch Drohung mit einem empfindlichen Übel zu einer Handlung, Duldung oder Unterlassung nötigt und dadurch dem Vermögen des Genötigten oder eines anderen Nachteil zufügt, um sich oder einen Dritten zu Unrecht zu bereichern."},
{b:"StGB",p:"§17",t:"Diebstahl",x:"1. Diebstahl liegt vor, wenn jemand eine fremde Sache wegnimmt, um sie sich oder einem Dritten rechtswidrig anzueignen. Gleiches gilt bei dem Entwenden von Gegenständen aus Geschäften oder Geldautomaten, sofern keine Gewalt gegen Personen angewendet wird. 2. Das Gleiche gilt, wenn eine gestohlene oder rechtswidrig angeeignete Sache gekauft, weiterverkauft oder einem Dritten verschafft wird, um sich oder einen Dritten zu bereichern. 3. Die Tat wird nur auf Antrag verfolgt."},
{b:"StGB",p:"§17a",t:"Fahrzeugdiebstahl",x:"1. Wer ein fremdes Auto, Motorrad, Flugzeug oder einen Helikopter entwendet, macht sich strafbar."},
{b:"StGB",p:"§18",t:"Raub",x:"Wer eine fremde bewegliche Sache einem anderen unter Anwendung von Gewalt gegen eine Person oder durch Drohung mit gegenwärtiger Gefahr für Leib oder Leben in der Absicht wegnimmt, sich selbst oder einen Dritten rechtswidrig zu bereichern, wird bestraft. In minder schweren Fällen kann die Haftstrafe auf ein einzelnes Bußgeld umgewandelt werden. Ein minder schwerer Fall greift dann, wenn 1. keine dritten Personen in Gefahr gebracht, 2. sich der Festnahme nicht mit exzessiver Gewalt entzogen, 3. keine Mittel, die bei Anwendungen gegen Personen gefährliche oder tödliche Wunden hervorrufen, sichergestellt wurden."},
{b:"StGB",p:"§19",t:"Betrug und Computerbetrug",x:"1. Betrüger ist, wer durch Vorspiegelung falscher Tatsachen einen Irrtum herbeiführt oder hält. 2. Betrüger ist auch, wer in der Absicht sich oder einem Dritten einen rechtswidrigen Vermögensvorteil zu verschaffen, das Vermögen eines anderen dadurch beschädigt, dass er durch Vorspiegelung falscher Tatsachen einen Irrtum herbeiführt oder hält. 3. Betrüger ist auch, wenn der Täter einen rechtmäßig durch einen Richter geschlossenen Vertrag bricht."},
{b:"StGB",p:"§21",t:"Urkundenfälschung",x:"1. Wer zur Täuschung im Rechtsverkehr eine unechte Urkunde herstellt oder eine echte Urkunde verfälscht, wird bestraft. 2. Urkundencharakter haben dabei auch durch Unternehmen und staatliche Organisationen ausgestellte öffentliche Papiere, wie z.B. Lieferscheine, Aufträge und Verträge."},
{b:"StGB",p:"§22",t:"Dienstvergehen",x:"1. Ein Dienstvergehen ist eine schuldhafte Verletzung der Dienstpflichten eines Beamten. Folgende Beispiele fallen unter ein Dienstvergehen: a) Die unterlassene Hilfeleistung als Beamter (Garantenstellung). b) Bestechung iSd Annahme größerer Geschenke von Dritten. c) Untätigkeiten und dem öffentlichen Bild des Staates schädigendes Verhalten während der Dienstausübung. d) Das Veräußern von Staatseigentum an unbefugte Dritte. e) Die Weitergabe und Veröffentlichung von internen und/oder geheimen Informationen der Behörden. 2. Dienstvergehen gem. §22 StGB können, entschieden durch einen voll ausgelernten Mitarbeiter der Justiz, auch straffrei und in Form eines internen Disziplinarverfahrens geahndet werden. Mögliche Disziplinarverfahren: a) Herstellung von Medikamenten im Human Labs, b) Hofwache im Staatsgefängnis, c) Torwache bei der Nationalgarde, d) Wachdienste im Krankenhaus, e) Geldstrafen, f) Suspendierungen, g) Kündigungen."},
{b:"StGB",p:"§23",t:"Unterlassene Hilfeleistung",x:"1. Wer bei Unglücksfällen oder gemeiner Gefahr oder Not nicht Hilfe leistet, obwohl dies erforderlich und ihm den Umständen nach zuzumuten, insbesondere ohne erhebliche eigene Gefahr und ohne Verletzung anderer wichtiger Pflichten möglich ist, macht sich strafbar. 2. Ebenso wird bestraft, wer in diesen Situationen eine Person behindert, die einem Dritten Hilfe leistet oder leisten will."},
{b:"StGB",p:"§24",t:"Totschlag",x:"Wer einen Menschen tötet, ohne Mörder zu sein, wird als Totschläger bestraft."},
{b:"StGB",p:"§25",t:"Mord",x:"Mörder ist, wer 1. aus Mordlust, 2. aus Habgier oder 3. um eine andere Straftat zu ermöglichen oder zu verdecken, einen Menschen tötet."},
{b:"StGB",p:"§26",t:"Falsche Verdächtigung",x:"Wer einen anderen bei einer Behörde wider besseres Wissen einer rechtswidrigen Tat oder der Verletzung einer Dienstpflicht in der Absicht verdächtigt, ein behördliches Verfahren oder andere behördliche Maßnahmen gegen ihn herbeizuführen oder fortdauern zu lassen, wird bestraft. Die Tat wird nur auf Antrag verfolgt."},
{b:"StGB",p:"§27",t:"Meineid",x:"1. Wer vor Gericht oder vor einer anderen zur Abnahme von Eiden zuständigen Stelle falsch schwört, wird bestraft. 2. Wer gemäß §27 i.V.m. §22a seinen Diensteid bricht, kann nach beiden Paragraphen gesamt bestraft werden."},
{b:"StGB",p:"§28",t:"Widerstand gegen Vollstreckungsbeamte",x:"1. Widerstand leistet, wer sich einem Amtsträger (Beamten), der zur Vollstreckung von Gesetzen, Rechtsverordnungen, Urteilen, Gerichtsbeschlüssen oder Verfügungen berufen ist, bei der Vornahme einer solchen Diensthandlung mit Gewalt oder durch Drohung mit Gewalt widersetzt. 2. Die Tat ist nicht nach dieser Vorschrift strafbar, wenn die Diensthandlung nicht rechtmäßig ist. Dies gilt auch dann, wenn der Täter irrtümlich annimmt, die Diensthandlung sei rechtmäßig. 3. Rein passives Verhalten wie Schweigen, Wegsehen oder das bloße Nichtbefolgen einer Anweisung ohne aktiven Widerstand stellt keinen Widerstand im Sinne dieses Paragraphen dar. Die Nichtbefolgung einer rechtmäßigen Anweisung kann jedoch nach anderen Vorschriften geahndet werden."},
{b:"StGB",p:"§29",t:"Tätlicher Angriff auf Vollstreckungsbeamte",x:"Wer einen Amtsträger (Beamten), der zur Vollstreckung von Gesetzen, Rechtsverordnungen, Urteilen, Gerichtsbeschlüssen oder Verfügungen berufen ist, bei einer Diensthandlung tätlich angreift, wird bestraft."},
{b:"StGB",p:"§30",t:"Gefangenenbefreiung",x:"1. Wer einen Gefangenen aus dem Gewahrsam befreit, ihn zum Entweichen verleitet oder dabei fördert, wird bestraft. 2. Als Gewahrsam gelten dabei a) Fahrzeuge der Behörden, b) alle Polizeidienststellen, c) sämtliche Gewahrsamszellen, d) das Staatsgefängnis. 3. Ebenfalls macht sich jener der Gefangenenbefreiung strafbar, der einem Tatverdächtigen die Handschellen löst und ihm somit zur Flucht der ihm bevorstehenden Strafe verhilft."},
{b:"StGB",p:"§31",t:"Gefangenenmeuterei",x:"1. Gefangenenmeuterei begeht, wer sich in Gewahrsam gem. §30 II. mit anderen Gefangenen zusammenrottet um: a) einen Beamten oder einen Dritten zu nötigen oder tätlich anzugreifen, b) gewaltsam auszubrechen, c) sich selbst oder einem anderen Gefangenen zum Ausbruch verhilft."},
{b:"StGB",p:"§32",t:"Besitz illegaler Gegenstände",x:"1. Wer illegale Gegenstände besitzt oder diese in einem Fahrzeug oder Haus lagert, wird bestraft. 2. Unter illegale Gegenstände fallen: USB-Stick mit einem Virus, Motorblocker, Anti-Radar, Panzerplatten, Fahrzeugscanner, Personenscanner, Dietrich/Schlüsselsatz, Suchbasis-Hack, Geldpapier/Falschgeld, gefälschte (Exekutiv-)Papiere, Zutaten für Kokain, Satellitenschüssel, Untermodule (AR-Patrone, Marihuana, Kokain). 3. Es ist verboten sämtliche illegalen Gegenstände zu veräußern. 4. Für Beamte im Dienst sind aus der Liste folgende Einsatzmittel im Dienst zulässig: a) Dietrich/Schlüsselsatz, b) Motorblocker."},
{b:"StGB",p:"§33",t:"Besitz von staatlichem Eigentum",x:"1. Wer nicht erwerbbare Mittel des Polizeidienstes oder weiterer Behörden besitzt, oder diese in einem Fahrzeug oder Haus lagert, wird bestraft. 2. Unter Mittel des Polizeidienstes fallen: a) Kleidung mit amtlichem/hoheitlichem Abzeichen, b) Waffen mit amtlichem/hoheitlichem Abzeichen/Symbol, c) Balaclava, d) amtliche Schutzwesten, e) Schlagstöcke, f) Tazer, g) Tazer Munition, h) Fahrzeuge mit behördlichen Kennzeichen."},
{b:"StGB",p:"§34",t:"Sexuelle Belästigung",x:"1. Wer eine andere Person in sexuell bestimmter Weise körperlich berührt und dadurch belästigt, oder die Person durch sexuell bestimmte Inhalte verbal nötigt, wird bestraft. 2. Wer mehrfach anzügliche Kommentare gegenüber einer Person macht, die diese als störend und verwerflich empfindet, wird ebenfalls bestraft. 3. Die Tat wird nur auf Antrag verfolgt."},
{b:"StGB",p:"§35",t:"Sicherheitsbereiche (Landfriedensbruch)",x:"1. Wer behördliche oder staatliche Sicherheitsbereiche oder Grundstücke widerrechtlich betritt, in behördliche oder staatliche Einrichtungen widerrechtlich eindringt oder wer auf die Aufforderung des Berechtigten sich nicht entfernt, wird bestraft. 2. Sicherheitsbereiche: Alle behördlichen Bereiche, welche durch Türen oder Tresen gekennzeichnet sind, außer die Eingangsbereiche der staatlichen Gebäude, sowie alle sonstigen durch Zäune oder andere Absperrungen gekennzeichneten Orte. 3. Ein besonders schwerer Fall liegt bei dem Betreten des Fort Zancudo, dem Staatsgefängnis, dem Flugzeugträger, den Sperrzonen des Regierungsgebäudes (Ministerium) sowie temporär ausgerufenen Sperrzonen in San Andreas vor. 4. In Eingangsbereichen und auf dem Gelände sämtlicher Behörden darf sich nur aufgehalten werden, sofern konkrete und sachliche Anliegen verfolgt werden. 5. Wer sich an Gewalttätigkeiten, die aus einer Menschenmenge in einer die öffentliche Sicherheit gefährdenden Weise mit vereinten Kräften begangen werden, als Täter oder Teilnehmer beteiligt oder wer auf die Menschenmenge einwirkt, um ihre Bereitschaft zu solchen Handlungen zu fördern, wird bestraft."},
{b:"StGB",p:"§36",t:"Ruhezone",x:"1. Alle Bereiche der staatlichen Organisationen, der LifeInvader und die Bars Bahama Mamas, Tequi-la-la sowie Yellow Jack sowie Veranstaltungen, die bei der Regierung angemeldet wurden, gelten im Umkreis von 100m, sowie das Unicorn im Umkreis von 50m als Ruhezone. 2. Wer Menschen, insbesondere aber die Mitarbeiter des LSMD erheblich in ihrer Arbeit belästigt oder beeinträchtigt oder in der Ruhezone die Ruhe zur Erholung der Patienten stört, beeinträchtigt oder öffentlich ein Ärgernis erregt, macht sich strafbar. 3. Wer das Geschehen einer Veranstaltung erheblich stört, beeinträchtigt, öffentlich ein Ärgernis erregt, macht sich strafbar."},
{b:"StGB",p:"§37",t:"Amtsanmaßung",x:"Wer sich unbefugt mit der Ausübung eines öffentlichen (behördlichen) Amtes befasst oder eine Handlung vornimmt, welche nur kraft eines öffentlichen Amtes vorgenommen werden darf, wird bestraft."},
{b:"StGB",p:"§38",t:"Amtsmissbrauch",x:"1. Jeder Beamte, der gegen seine übertragenen dienstlichen Rechte (BDG) und Pflichten (Dienstanweisungen) im Sinne der Gesetze des Staates Los Santos verstößt, macht sich des Amtsmissbrauchs schuldig. Die dienstlich übergebenen Mittel dürfen weder für persönliche noch private Zwecke genutzt werden. 2. Amtsmissbrauch im Zusammenhang mit §22 StGB kann ausschließlich durch die Staatsanwaltschaft verfolgt und zur Anklage gebracht werden. 3. Amtsmissbrauch gem. §38 StGB kann, nach Entscheidung der Staatsanwaltschaft, von einer strafrechtlichen Verfolgung abgesehen und stattdessen im Wege eines internen Disziplinarverfahrens geahndet werden."},
{b:"StGB",p:"§39",t:"Nötigung, Bedrohung, Belästigung",x:"1. Eine Bedrohung begeht, wer einen Menschen rechtswidrig mit Gewalt oder durch Drohung mit einem empfindlichen Übel bedrängt. 2. Eine Nötigung begeht, wer einen Menschen rechtswidrig mit Gewalt oder durch Drohung mit einem empfindlichen Übel zu einer Handlung, Duldung oder Unterlassung nötigt. 3. Eine Belästigung begeht, wer eine Person durch unerwünschtes, wiederholtes oder aufdringliches Verhalten belästigt. 4. Die Tat wird nur auf Antrag verfolgt."},
{b:"StGB",p:"§40",t:"Missbräuchlicher Notruf",x:"Wer die Notruffunktion oder die Notruf-Telefonnummer einer Behörde, ohne sich in einer Notsituation zu befinden, verwendet, wird bestraft."},
{b:"StGB",p:"§41",t:"Vermummung und Identitätsfeststellung",x:"Das Tragen einer Gesichtsvermummung in der Öffentlichkeit sowie in staatlichen Gebäuden, insbesondere bei der Polizei und vor Gericht, ist verboten. Eine Bestrafung erfolgt erst nach einer nicht befolgten Aufforderung zur Abnahme der Vermummung durch einen Beamten. Ausnahmen gelten für Exekutivbeamte in bestimmten Fällen. Jeder Bürger ist verpflichtet, sich jederzeit ausweisen zu können. Voll-Exekutivbehörden dürfen mit einem hinreichenden Tatverdacht Identitätsfeststellungen durchführen und die Person so lange festhalten, wie es zur Feststellung der Identität erforderlich ist, unter Beachtung der StPO §12 Abs."},
{b:"StGB",p:"§43",t:"Bestechung",x:"1. Eine Bestechung begeht, wer einem Amtsträger (Beamten) einen Vorteil für diesen oder einen Dritten als Gegenleistung dafür anbietet, verspricht oder gewährt, dass er eine Diensthandlung vorgenommen hat, künftig vornehme oder unterlasse und dadurch seine Dienstpflichten verletzt hat oder verletzen würde."},
{b:"StGB",p:"§44",t:"Tierquälerei",x:"1. Wer ein Tier ohne triftigen Grund (Selbstverteidigung, Notwehr) tötet oder erhebliche Schmerzen oder Leiden zufügt, macht sich strafbar. 2. Ausnahmen bilden Tötungen von Nutz- und Wildtieren aufgrund von Schlachtung und Jagd."},
{b:"StGB",p:"§45",t:"Hochverrat",x:"1. Hochverrat begeht, wer als Amtsträger (Beamter) 2. derartig wichtige und geheime Informationen an Dritte weitergibt, dass durch deren Veröffentlichung die Sicherheit des Staates gefährdet sein könnte oder 3. durch Gewalt oder Androhung eines erheblichen Übels versucht, oder wem dies zeitweise gelingt, die Leitung einzelner Behörden oder der Regierung zu stürzen oder zu übernehmen. 4. Wer als Amtsträger (Beamter) und Führungskraft einer Behörde gegen durch den Gouverneur erlassene Dekrete gem. § 9 SVerfG wirkt oder handelt. 5. Wer als direkter Vertreter des Volkes (ziviler Kongressabgeordneter) unerlaubt Informationen aus den Kongresssitzungen an Dritte weiter trägt, macht sich des Hochverrats schuldig."},
{b:"StGB",p:"§46",t:"Stalking",x:"1. Wer einer Person in einer Weise unbefugt stalkt, die geeignet ist, deren Lebensgestaltung nicht unerheblich zu beeinträchtigen, indem er wiederholt 2. die Nähe der Person aufsucht, 3. unter Verwendung von Mobiltelefonen oder sonstigen Mitteln direkt oder über Dritte versucht Kontakt herzustellen, 4. unter missbräuchlicher Verwendung personenbezogene Daten der Person weitergibt, macht sich strafbar. 5. Die Tat wird nur auf Antrag verfolgt."},
{b:"StGB",p:"§47",t:"Behinderung von Ermittlungsverfahren",x:"Wer polizeiliche oder staatsanwaltschaftliche Maßnahmen verzögert oder ohne triftigen Grund eine rechtmäßige Zeugenaussage verweigert, macht sich strafbar."},
{b:"StGB",p:"§48",t:"Erregung öffentlichen Ärgernisses",x:"Wer öffentlich sexuelle Handlungen (z.B. Masturbation) vornimmt und dadurch absichtlich ein Ärgernis erregt, macht sich strafbar."},
{b:"StGB",p:"§49",t:"Terroristischer Akt",x:"1. Einen terroristischen Akt begeht, wer es unternimmt, mit Gewalt oder durch Drohung mit erheblicher Gewalt 2. den Bestand des Staates San Andreas zu beeinträchtigen oder 3. die auf der Verfassung des Staates San Andreas beruhende verfassungsmäßige Ordnung zu ändern oder 4. den Ablauf einer offiziellen Wahl stört oder verhindert oder 5. einen bewaffneten Angriff auf eine staatliche Einrichtung gem. §1 und/oder die sich darin befindlichen Beamten durchführt oder 6. eine Geiselnahme an einem leitenden Beamten durchführt. 7. Wer einzelnen Personen, Banden oder kriminellen Organisationen (auch legale) Vermögenswerte zur Ausführung eines terroristischen Aktes gem. §30 zur Verfügung stellt, finanziert terroristische Handlungen und wird gleich dem Täter bestraft. 8. Die Finanzierung illegaler Aktivitäten einzelner Personen, Banden oder krimineller Organisationen kann mit einer Schließung von Geschäften und Unternehmen des bzw. der Finanziers geahndet werden."},
{b:"StGB",p:"§50",t:"Inverkehrbringen von medizinischen Mitteln",x:"1. Wer medizinische Mittel wie Verbandskästen, Tabletten, oder medizinische Masken gegen Geld veräußert oder öffentlich anbietet, wird bestraft. 2. Ausgenommen sind die Mitarbeiter des EMS innerhalb ihrer dienstlichen Tätigkeit. Diese dürfen medizinische Mittel über die Organisation verkaufen."},
{b:"StGB",p:"§51",t:"Erschleichen von Leistungen",x:"1. Wer öffentliche (staatliche) Leistungen in Anspruch nimmt oder Gegenstände bei einer Behörde erwirbt und für diese nicht das zu entrichtende Entgelt bezahlt, kann mit einer Geldstrafe bestraft werden. Der Staat hat das Recht seinen monetären Ausfall vom Täter einzufordern. 2. Gleiches gilt für das nicht-vergüten anwaltlicher Dienstleistungen. 3. Die Tat wird nur auf Antrag der Ermittlungsbehörden oder Anwälten verfolgt."},
{b:"StGB",p:"§52",t:"Unerlaubte Veranstaltung eines Glücksspiels",x:"1. Wer ohne behördliche Erlaubnis öffentlich ein Glücksspiel bewirbt, veranstaltet oder hält oder die Einrichtungen hierzu bereitstellt, wird bestraft."},
{b:"StGB",p:"§53",t:"Beteiligung am unerlaubten Glücksspiel",x:"Wer sich an einem unerlaubten Glücksspiel gem. §52 beteiligt, wird bestraft."},
{b:"StGB",p:"§54",t:"Wahlbehinderung",x:"1. Die Wahl eines Einzelnen behindert, wer mit Gewalt oder durch Drohung mit Gewalt eine Wahl oder die Feststellung ihres Ergebnisses verhindert oder stört. 2. Wer einen Menschen rechtswidrig mit Gewalt oder durch Drohung mit einem empfindlichen Übel zu einer Handlung, Duldung oder Unterlassung nötigt, wird bestraft."},
{b:"StGB",p:"§56",t:"Missachtung gerichtlicher/richterlicher Anordnungen",x:"1. Wer einer rechtmäßigen und bindenden Anordnung/Verfügung der Justiz, z.B. eines Richters oder eines Staatsanwaltes, nicht Folge leistet, wird bestraft. 2. Bei dem Strafmaß ist individuell zu gestalten und Verhältnismäßigkeit zur Situation und der Tat zu wahren. 3. Das Strafmaß sowie die Verhältnismäßigkeit einer solchen Anordnung regelt im Zweifel das Gericht."},
{b:"StGB",p:"§57",t:"Lizenzhandel",x:"1. Ein Waffenschein und eine Anwaltslizenz darf lediglich von Mitarbeitern des Gouvernements über deren internes System verkauft werden und auch nur über dieses gekauft werden. Jede andere Art von dem Erwerb einer der beiden Lizenzen ist illegal. Die Tat wird nur auf Antrag verfolgt."},
{b:"WaffG",p:"§1",t:"Personen- und Sachbegriffe",x:"Behörden iSd WaffG sind: 1. GOV (Bundesbehörde, Government of San Andreas), 2. FIB (Bundesbehörde, Federal Investigation Bureau), 3. LSPD (Los Santos Police Department), 4. SAHP (San Andreas Highway Patrol), 5. NG (Nationalgarde), 6. EMS (Emergency Services). Mitarbeiter der o.g. Behörden sind Amtsträger (Beamte). Staatliche Einrichtungen iSd WaffG sind: 1. Alle Regierungsgebäude, 2. Alle Polizeistationen, 3. Alle Krankenhäuser, 4. Das Fort Zancudo."},
{b:"WaffG",p:"§2",t:"Werkzeuge und Waffen",x:"1. Ein Werkzeug ist ein für bestimmte Zwecke geformter Gegenstand, mit dessen Hilfe etwas [handwerklich] bearbeitet oder hergestellt wird. 2. Ein Sportgerät ist ein Gegenstand, welcher in seiner Existenz dazu gedacht ist für die Ausübung einer Sportart genutzt zu werden. 3. Waffen sind Gegenstände, die in ihrem Wesen dazu geschaffen sind, Personen zu verletzen oder zu töten. 4. Werkzeuge und Sportgeräte sind Gegenstände, die man immer frei mit sich führen darf. Für Waffen gelten Einschränkungen, welche in den unten niedergeschriebenen Paragraphen festgelegt sind."},
{b:"WaffG",p:"§3",t:"Waffenerwerb",x:"Eine Waffe kann legal nur bei den Mitarbeitern von Waffenläden (nicht den Besitzern) mit entsprechender Lizenz erworben werden. Der Waffenerwerb kann vom Staat reguliert werden."},
{b:"WaffG",p:"§4",t:"Waffenscheine",x:"1. Um Waffen zu besitzen oder sie zu führen, ist ein Waffenschein nötig. Sie müssen ein gültiges psychologisches Gutachten haben. Dieses Gutachten wird durch das LSMD ausgestellt und ist ab Ausstellungsdatum 30 Tage lang für die hinterlegte Reisepassnummer eines Bürgers gültig. Sobald das Gutachten abgelaufen ist, muss es erneuert werden. Die Regierung stellt den Waffenschein nur einmal in 30 Tagen aus. Hierbei ist eine Kulanz von bis zu 5 Tagen vor Ablauf möglich, wenn der alte Waffenschein vor den Augen eines Regierungsmitarbeiters entsorgt wird. Wer eine Straftat begangen hat und wegen dieser rechtskräftig verurteilt wurde, ist vom Erwerb eines Waffenscheines ausgeschlossen und kann erst wieder einen bekommen, sobald er nicht mehr als vorbestraft gilt. 2. Der Waffenschein kann gem. §28 StPO eingezogen werden. 3. Ein Waffenverbot ist das generelle Verbot, Waffen sowie Munition zu erwerben oder zu besitzen. Es wird durch ein Gericht aufgezwungen und zeitlich begrenzt."},
{b:"WaffG",p:"§5",t:"Legale und illegale Waffen",x:"sind Gegenstände, die in ihrem Wesen dazu geschaffen sind, Personen zu verletzen oder zu töten, daher gelten für Gegenstände nach diesem Wesen Einschränkungen. Für den Besitz sowie das Führen der folgenden Waffen wird ein Waffenschein benötigt: Normale Pistole/Vintage Pistole/Panzerbrechende Pistole/Pistole 50/Leuchtpistole, Revolver, normale Schrotflinte, alle Maschinenpistolen (inkl. SMG/PDW). Für den Besitz sowie das Führen der folgenden Gegenstände wird kein Waffenschein benötigt, es handelt sich um Werkzeuge oder Sportgeräte: Golfschläger, Hammer, Rollgabelschlüssel, Taschenlampe, Baseballschläger, Messer. 1. Der Besitz von Waffen, welche nicht explizit durch §5 Waffengesetz als legal eingestuft worden sind, ist verboten. Ausnahmen für Beamte bildet das BDG. 2. Schusswaffen ohne gültige Seriennummer gelten als illegal. a) Der Besitz legaler Waffen ohne Seriennummer gilt als Ordnungswidrigkeit. Das Führen und/oder benutzen solcher Waffen (legale Waffen nach WaffG §5) ist mit einem Bußgeld zu bestrafen. b) Waffen, welche nicht in §5 aufgezählt sind, sind demzufolge illegale Waffen. c) Waffen, die nach §5 WaffG als legal gelten, verlieren diese Gültigkeit nicht dadurch, dass die Seriennummer übersprüht wurde. 3. Wer eine legale Waffe, ohne den dazu nötigen Waffenschein besitzt, handelt rechtswidrig. 4. Der Besitz von Munition unterliegt ebenfalls einer Waffenscheinpflicht. Hier gilt, um Munition eines bestimmten Typs zu besitzen, muss eine Lizenz zum Führen der zugehörigen Waffe vorliegen. Ist dies nicht der Fall, handelt man rechtswidrig. 5. Ebenfalls als illegale Waffen zählen Waffen mit einer Modifikation (z.B. den Lauf absägen). Eine Ausnahme bildet die Modifizierung einer Waffe durch das Lackieren."},
{b:"WaffG",p:"§6",t:"Mitführen und Einsatz von Waffen",x:"1. In staatlichen Gebäuden dürfen keine Waffen getragen werden, ausgenommen von Beamten der Voll- oder Teil-Exekutiven oder von dort angestellten Sicherheitsleuten, solange diese im Dienst sind. Um dies durchzusetzen, darf jede Person, außer dort Angestellten, innerhalb dieses Gebäudes von der Strafverfolgung oder der örtlichen Security durchsucht werden. Personen die bewaffnet sind, müssen das Gebäude verlassen und können strafrechtlich belangt werden. 2. Die Nutzung einer Waffe ist lediglich in Notsituationen, auf dafür vorgesehenen Geländen oder auf dem Privatgelände, sollten dadurch keine Personen außerhalb des Privatgeländes gefährdet werden, zulässig. Die Nutzung ist das Abfeuern der Waffe, das Laden der Waffe und das offene Tragen der Waffe. 3. Das Mitführen einer Waffe bei einer Straftat gemäß StGB, auch wenn diese nicht aktiv benutzt wird, führt zur Beschlagnahmung der Waffe."},
{b:"WaffG",p:"§7",t:"Veräußerung von Waffen",x:"1. Es ist untersagt, Waffen an andere Stellen oder Personen, als denen durch den Staat dazu befugten, in §3 definierten zu kaufen, zu verkaufen oder weiterzugeben. 2. Der Verkauf von Waffen ohne gültige Seriennummer, sowie der Verkauf von Waffen außerhalb der definierten legalen Waffen iSd §5 Abs. I ist untersagt."},
{b:"WaffG",p:"§8",t:"Auskunftspflichten",x:"Besitzer einer Waffe sind verpflichtet, den Besitz dieser Waffe bei einer polizeilichen Kontrolle der kontrollierenden Behörde mitzuteilen sowie die Waffenlizenz vorzulegen."},
{b:"WaffG",p:"§9",t:"Besitz von Waffenteilen",x:"Wer Waffenteile besitzt, die zur Herstellung benutzt werden können, mit Ausnahme von Metallschrott, macht sich strafbar."},
{b:"BtMG",p:"§1",t:"Personen- und Sachbegriffe",x:"Behörden iSd BtMG sind: 1. GOV (Bundesbehörde, Government of San Andreas), 2. FIB (Bundesbehörde, Federal Investigation Bureau), 3. LSPD (Los Santos Police Department), 4. SAHP (San Andreas Highway Patrol), 5. NG (Nationalgarde), 6. EMS (Emergency Services). Mitarbeiter der o.g. Behörden sind Amtsträger (Beamte). Staatliche Einrichtungen iSd BtMG sind: 1. Alle Regierungsgebäude, 2. Alle Polizeistationen, 3. Alle Krankenhäuser, 4. Das Fort Zancudo."},
{b:"BtMG",p:"§2",t:"Arten von Betäubungsmitteln",x:"1. Betäubungsmittel iSd BtMG sind: 2. Kokain, 3. Marihuana/Cannabis (Drogen), 4. Halluzinogene Pilze."},
{b:"BtMG",p:"§3",t:"Anbau von Betäubungsmitteln",x:"1. Wer Betäubungsmittel jeglicher Art unerlaubt anbaut, wird bestraft. 2. Der Anbau von Marihuana/Cannabis ist unter folgenden Bedingungen erlaubt: a) Nach Besitz eines anerkannten Gutachtens des EMS, welches den Anbau von zwei medizinischen Drogen (Marihuana/Cannabis) gleichzeitig für den Eigengebrauch erlaubt. b) Der Anbau muss auf dem eigenen Grundstück erfolgen. Das Grundstück muss bei Beantragung des Gutachtens angegeben werden. Bei Umzügen oder Namensänderungen muss ein neues Gutachten beantragt werden. c) Pro Grundstück kann nur ein Gutachten eingetragen werden. d) Pro Person ist nur ein Gutachten zulässig und muss alle 7 Tage erneuert werden. e) Jeder Beamte ist verpflichtet, vor einer Beschlagnahmung von Drogen auf einem Grundstück zu prüfen, ob ein Gutachten vorliegt, falls ein Gutachten für 2 Pflanzen vorliegt und auf dem Grundstück mehr vorgefunden werden sollten, die Überschüsse zu vernichten. Eine Ermittlung kann nur angestrebt werden, wenn zweifelsfrei der Besitzer der Pflanzen ermittelt wurde."},
{b:"BtMG",p:"§4",t:"Besitz von Betäubungsmitteln",x:"1. Wer unerlaubt Betäubungsmittel jeglicher Art und Menge besitzt, wird bestraft. Strafbar und illegal sind ebenso die unmittelbaren Rohstoffe zur Herstellung von Betäubungsmitteln. 2. Als geringe, nicht zu ahndende Menge werden folgende Betäubungsmittel betrachtet. Der Eigenbedarf entfällt, wenn die zulässige Menge überschritten wird. a) Marihuana/Cannabis (Anzahl: 18 Drogen und 4 Samen). 3. Ausgenommen hiervon (nur Cannabis) ist das EMS in Bezug auf entsprechende behandlungsbedürftige Bürger mit entsprechendem Attest und Rezept. 4. Der Erwerb durch die Leitung/Vize-Leitung des LSMD von medizinischem Cannabis zur Verwendung durch medizinisches Fachpersonal an behandlungsbedürftigen Bürgern, außerhalb der Krankenhäuser, ist straffrei. 5. Eine Ausnahme stellen außerdem angemeldete und geprüfte Unternehmen dar, die eine gültige Erlaubnis/Bescheinigung des Gouverneurs vorweisen können. Alle Unternehmen die Betäubungsmittel aus BtMG §2 verkaufen, müssen diese protokollieren. 6. Diese Unternehmen sind darüber hinaus dazu befugt in einem geschlossenen Gebiet unter strenger Aufsicht bis zu 5 Pflanzen gleichzeitig zu pflanzen. 7. Voraussetzung für eine solche Erlaubnis des Gouverneurs ist ein regelmäßiger Gesundheitscheck einmal in der Woche sowie ein aktives psychologisches Gutachten."},
{b:"BtMG",p:"§5",t:"Handel mit Betäubungsmitteln",x:"Unter Handeltreiben ist jedes eigennützige Bemühen zu verstehen, das darauf gerichtet ist, den Umsatz von Betäubungsmitteln zu ermöglichen oder zu fördern."},
{b:"BtMG",p:"§6",t:"Konsum von Betäubungsmitteln",x:"Der Konsum von Betäubungsmitteln ist straffrei."},
{b:"BDG",p:"§1",t:"Personen- und Sachbegriffe",x:"Behörden iSd BDG sind: 1. GOV (Bundesbehörde, Government of San Andreas), 2. FIB (Bundesbehörde, Federal Investigation Bureau), 3. LSPD (Los Santos Police Department), 4. SAHP (San Andreas Highway Patrol), 5. NG (Nationalgarde), 6. EMS (Emergency Services). Mitarbeiter der o.g. Behörden sind Amtsträger (Beamte). Staatliche Einrichtungen iSd BDG sind: 1. Alle Regierungsgebäude, 2. Alle Polizeistationen, 3. Alle Krankenhäuser, 4. Das Fort Zancudo, 5. Das Staatsgefängnis (SG)."},
{b:"BDG",p:"§2",t:"Anwendungsbereich",x:"1. Das Beamtendienstgesetz ist für jeden Beamten bindend. 2. Verstöße gegen das Beamtendienstgesetz werden, sofern es nicht durch ein anderes Strafgesetz näher definiert wird, gem. §22 StGB geahndet."},
{b:"BDG",p:"§3",t:"Exekutivbeamte",x:"1. Als Exekutivbeamte werden Beamte der folgenden Behörden behandelt: FIB, LSPD, SAHP, GOV, NG. 2. Mit Ausnahme des GOV sowie der NG verfügen o.g. Behörden über volle Exekutivrechte gemäß StPO. Beamten der NG ist es erlaubt, volle Exekutivrechte bei der Ausübung ihrer Dienste auf dem Gelände des Fort Zancudo sowie bei der Begleitung der Voll-Exekutivbeamten bei deren Amtsausübung anzuwenden. 3. Bundesbehörden (für das GOV nur die Special Operations Division) können städtischen Polizeibehörden Dienstanweisungen erteilen. 4. Alle staatlichen Behörden und deren Beamte dürfen im Dienst keine Maske tragen. 5. Ausgenommen hiervon sind die Spezialeinheiten der folgenden Behörden: FIB, LSPD, SAHP, GOV, NG - die im Dienst nur die im Lager ihrer Behörden verfügbaren Masken verwenden dürfen."},
{b:"BDG",p:"§4",t:"Die Nationalgarde / Fort Zancudo",x:"1. Mitarbeiter der Nationalgarde sind auf Zuruf des Gouverneursbüros oder anderer Exekutivbehörden dazu befugt im aktiven (Streifen-)Dienst, bei vorheriger Erlaubnis durch den General der NG, zu unterstützen. 2. Sämtliche Gesetze, die sonst im Staate von San Andreas gelten, haben auch auf dem Gelände des Fort Zancudo Geltung. 3. Exekutivrechte auf dem Gelände des Fort Zancudo hat jedoch lediglich die Nationalgarde inne. Exekutivrechte aller allgemeinen Exekutivbehörden gelten unter Verbotsvorbehalt (Exekutivrechte, sofern die NG diese nicht temporär entzieht)."},
{b:"BDG",p:"§5",t:"Spezialeinheiten",x:"1. Jeder Behörde ist jeweils nur 1 Spezialeinheit vorbehalten. 2. Mitglieder dieser Spezialeinheiten sind befugt in speziellen Situationen in Absprache mit ihrer Abteilungsleitung sämtliche LMG und die Heavy Sniper zu benutzen. Ebenfalls dürfen diese in speziellen Diensthandlungen eine Balaclava tragen. 3. Jede weitere Spezialeinheit muss unter den Kriterien Konzept, Waffennutzungsliste, Wirksamkeit und Mannstärke bei der Regierung beantragt und durch den Gouverneur, in seiner Abwesenheit durch den Vize, angenommen und in eine Liste aufgenommen werden. 4. Alle Behörden haben der Regierung unaufgefordert ihre Spezialeinheit mit Einsatzzweck, Namen der Angehörigen sowie Dienstnummer schriftlich vorzulegen. Alle Änderungen müssen unverzüglich bekannt gegeben werden."},
{b:"BDG",p:"§6",t:"Kleiderordnung",x:"1. Balaclavas dürfen von den Spezialeinheiten nur getragen werden, solange sie sich in einer entsprechenden Diensthandlung befinden. 2. Ein Beamter darf nicht gegen die Kleiderordnung verstoßen. 3. Beamte sind dazu angehalten, sich im Dienst professionell und ihrem behördlichen Auftreten entsprechend zu kleiden. 4. Die Spezialeinheiten der Behörden können zivile Undercoverstreifen für entsprechende verdeckte Ermittlungen bilden. 5. Zivil- und Undercoverstreifen sind ausschließlich vereinzelt und nach jeweiliger Freigabe durch die jeweilige Abteilungsleitung oder Direktion zu besetzen. 6. Undercoverstreifen sind ausschließlich zu Ermittlungszwecken vorgesehen; es dürfen dabei keine Dienstmittel mit sich geführt werden (Dienstwaffen, Westen, etc.) - lediglich private Bewaffnung gem. WaffG."},
{b:"BDG",p:"§7",t:"Dienst Definitionen",x:"1. Im Dienst ist ein Beamter, wenn sich dieser in der von der jeweiligen Behörde zugelassenen Umkleide in beliebige Dienstkleidung begibt. 2. Außer Dienst ist es Beamten untersagt, jegliches Dienstzubehör (Bekleidung und Bewaffnung) mit sich zu führen. 3. Eine Ausnahme hierzu bilden die in §6 VI. definierten Zivil- und Undercoverstreifen. 4. Außer Dienst ist es Beamten untersagt, außerhalb des sog. Jedermannsrechts einzugreifen. 5. Leitende Beamte (Leader und Vize-Leader) einer Organisation sind ständig im Dienst anzusehen."},
{b:"BDG",p:"§8",t:"Verhaltensnormen",x:"1. Jeder Beamte ist verpflichtet, seine dienstlichen Aufgaben unter Beachtung der geltenden Gesetzgebung treu, gewissenhaft und unparteiisch zu verrichten. 2. Jeder Beamte muss auf das Ansehen seiner eigenen sowie anderer Behörden achten und aktiv zu deren positiven Ansehen beitragen. 3. Beamte sind verpflichtet Straftaten zu melden, sobald sie über diese in Kenntnis gesetzt wurden oder diese beobachtet haben (Legalitätsprinzip). 4. Jeder Beamte hat sich eigenständig über Gesetzesänderungen zu informieren. 5. Jeder Beamte ist verpflichtet, auf Verlangen seinen Dienstausweis allen in einer Diensthandlung Betroffenen vorzulegen, solange der Zweck der Diensthandlung hierdurch nicht beeinträchtigt wird. 6. Dies gilt für alle Beamten, mit Ausnahme von Spezialeinheiten, solange ihre Identität nicht offenbart oder erkennbar ist (Dienstnummer ist anzugeben). 7. Gegenüber anderen Beamten ist der Dienstausweis immer und von jedem vorzuzeigen. 8. Beamte sind dazu verpflichtet, die im Bußgeldkatalog markierten Tatbestände an die jeweiligen Behörden weiterzugeben, bzw. diese zur gemeinsamen Bearbeitung des Falles hinzuzuziehen. 9. Eine Ausnahme hierzu gilt, wenn die angeforderte Behörde nach mehrmaligen Anfragen und/oder nach 5 Minuten nicht reagiert. 10. Beamte sind bei Straftaten an den aktuellen Bußgeldkatalog gebunden. Strafmilderung kann nur durch einen Staatsanwalt oder Richter angewiesen werden. 11. Jeder Beamte ist verpflichtet, in jeder dienstlichen Situation deeskalierend zu handeln. Die Anwendung von Zwangsmaßnahmen oder Gewalt ist stets das letzte Mittel und darf nur eingesetzt werden, wenn alle deeskalierenden Maßnahmen ausgeschöpft oder aufgrund der unmittelbaren Gefahrenlage nicht möglich sind. Insbesondere gilt: a) Beamte haben zunächst das Gespräch zu suchen und durch ruhiges, besonnenes Auftreten auf eine friedliche Lösung hinzuwirken. b) Provokationen oder verbal aggressive Äußerungen von Bürgern dürfen nicht mit gleichartiger Reaktion erwidert werden. c) Vor jeder Eskalationsstufe ist eine klare verbale Warnung auszusprechen, sofern die Situation dies zulässt. d) Verstöße gegen die Deeskalationspflicht können als Dienstvergehen gem. §22 StGB oder als Amtsmissbrauch gem. §38 StGB geahndet werden."},
{b:"BDG",p:"§9",t:"Dienstpflichten",x:"1. Ein Beamter ist verpflichtet, gegenüber Zivilisten oder Beamten Geheimhaltung über sämtliche Informationen zu wahren, die ihm im Zusammenhang mit seiner dienstlichen Tätigkeit bekannt geworden sind und/oder deren Geheimhaltung im Interesse der Behörde erforderlich ist. 2. Die Pflicht zur Verschwiegenheit besteht auch nach Beendigung des Dienstverhältnisses. 3. Die Geheimhaltungspflicht kann von der Staatsanwaltschaft im Falle einer Ermittlung aufgehoben werden. 4. Wird eine Verletzung der Geheimhaltung erst festgestellt, nachdem der/die Beklagte aus dem aktiven Dienst ausgeschieden ist, so ist er trotzdem nach dem vollen Strafmaß zu verurteilen. 5. Aufgrund von Befangenheit darf ein Beamter nicht alleine die Strafverfolgung eigener Familienmitglieder (blutsverwandt sowie Mitglied der eigenen Familie) durchführen, dabei ist zwangsweise ein unbefangener Beamter für die Strafverfolgung hinzuzuziehen. 6. Wenn ein Beamter Wanteds erhält, muss dies umgehend dem leitenden Angestellten (Leader oder Vize-Leader) sowie anschließend dem FIB mitgeteilt werden. 7. Beim falschen Ausstellen einer Akte (Wanteds, Geldstrafen, Lizenz-Entzug, etc.) ist jeder Beamte dazu verpflichtet, den Vorfall zu dokumentieren und unverzüglich den Leader oder Vize-Leader seiner eigenen Behörde zu informieren. Sollte dies nicht möglich sein, ist die Justiz zu informieren."},
{b:"BDG",p:"§10",t:"Berufsverbot",x:"1. Begeht ein Beamter mit hinreichendem Tatverdacht eine Straftat, so kann dieser durch den Gouverneursrat oder eine Bundesbehörde in Rücksprache mit der Staatsanwaltschaft von seinem Dienst vorerst suspendiert werden. 2. Wird ein Beamter straffällig und/oder verurteilt, muss das Dienstverhältnis mit sofortiger Wirkung beendet werden."},
{b:"BDG",p:"§11",t:"Dienstwaffen",x:"1. Wer den Dienst antritt, hat lediglich die verfügbaren Waffen aus dem Waffenschrank seiner Dienststelle zu verwenden. 2. Eine Ausnahme bilden folgende Waffen: Revolver, abgesägte Schrotflinte, SMG, Spezialkarabiner, Heavy Sniper. Diese Waffen dürfen ausschließlich für die Dienstausübung mit sich geführt und genutzt werden, sofern (falls notwendig) eine Erlaubnis vorliegt. 3. Beamte sämtlicher Behörden benötigen zum Führen ihrer Dienstwaffen einen aktuellen und gültigen Waffenschein sowie ein aktuelles und gültiges medizinisches Gutachten. 4. Der Einsatz der Schusswaffe ist nur als letztes Mittel gestattet. Flüchtende Personen und Fahrzeuge können mit Waffengewalt gestoppt werden, sofern von ihnen eine akute Gefahr für Leib und Leben oder die allgemeine Sicherheit ausgeht. 5. Der Einsatz weniger tödlicher Waffen (z.B. Tazer) kann jederzeit zur Durchführung hoheitlicher Maßnahmen angewandt werden, wenn sich eine Widerstandshandlung anbahnt oder darstellt."},
{b:"BDG",p:"§12",t:"Organisatorischer Eingriff",x:"1. Der Gouverneur sowie der Vize-Gouverneur haben das Recht, Beamte und Angestellte anderer Organisationen zu entlassen, wenn nach BDG und/oder StGB ein Dienstvergehen (hinreichender Tatverdacht) festgestellt wurde. 2. Die Leiter der Behörden/Abteilungen sind für ihre angestellten Beamten verantwortlich und sind daher befugt, diese jederzeit und regelmäßig zu überprüfen/durchsuchen. Dies dient präventiv der Bekämpfung illegaler Aktivitäten innerhalb der Behörden. So ist eine Einsicht z. B. in das Vorstrafenregister jederzeit möglich und nicht nur bei Einstellung zu überprüfen. 3. Jede staatliche Organisation hat das Recht, die Fahrzeuge der Mitarbeiter der jeweiligen Organisation stichprobenartig (bei hinreichendem Tatverdacht) zu durchsuchen. 4. Die Rechte aus Abs. 3 obliegen behördenübergreifend der FIB Korruptionsabteilung."},
{b:"BDG",p:"§13",t:"Waffenfreigabe",x:"1. Die Erteilung der Erlaubnis zur dienstlichen Verwendung eines einzigartigen LMG oder einer Heavysniper obliegt den jeweiligen Organisationen. Der Gouverneur und seine Stellvertreter haben jedoch jederzeit das Recht, die Freigabelisten anzufordern und einzusehen. 2. Der Gouverneur hat das Recht Maßnahmen zu fordern und falls es notwendig sein sollte, die Anzahl der Freigaben zu reduzieren."},
{b:"BDG",p:"§14",t:"Organisatorische Durchsuchungsermächtigung",x:"1. Das Korruptionsdepartment des FIB ist befugt, nach vorheriger Genehmigung durch den Justizminister, den Vize-Gouverneur oder den Gouverneur, eine bestimmte Organisation für einen Zeitraum von maximal einem (1) Tag organisatorisch zu durchsuchen. 2. Die Genehmigung gem. Abs. 1 darf höchstens einmal pro Kalendermonat erteilt werden. Eine erneute Genehmigung für dieselbe Organisation innerhalb desselben Kalendermonats ist unzulässig. 3. Der Antrag auf Genehmigung ist schriftlich durch die Leitung der Korruptionsabteilung des FIB an den Justizminister, Vize-Gouverneur oder Gouverneur zu richten. Der Antrag muss folgende Angaben enthalten: a) die Bezeichnung der zu durchsuchenden Organisation, b) den konkreten Verdachtsgrund oder Anlass der Durchsuchung, c) den geplanten Durchsuchungszeitraum (maximal 1 Tag). 4. Während des genehmigten Durchsuchungszeitraums ist die Korruptionsabteilung des FIB berechtigt, Geschäftsräume, Fahrzeuge und Lagerstätten der betroffenen Organisation zu betreten und zu durchsuchen. Dabei sind die allgemeinen Grundsätze der Verhältnismäßigkeit zu wahren. 5. Über die Ergebnisse der Durchsuchung ist dem genehmigenden Organ (Justizminister, Vize-Gouverneur oder Gouverneur) innerhalb von 48 Stunden nach Abschluss schriftlich Bericht zu erstatten."},
{b:"BDG",p:"§15",t:"Dienstaufsichtsbeschwerde",x:"1. Jeder Bürger hat das Recht, bei der Justiz oder dem Gouverneursbüro eine formelle Dienstaufsichtsbeschwerde gegen einen Beamten einzureichen, wenn dieser im Rahmen seiner Dienstausübung gegen geltendes Recht oder die Verhaltensnormen des BDG verstoßen hat. 2. Die Beschwerde muss schriftlich erfolgen und folgende Angaben enthalten: a) Name und Kontaktdaten des Beschwerdeführers. b) Dienstnummer oder Name des betroffenen Beamten (soweit bekannt). c) Datum, Uhrzeit und Ort des Vorfalls. d) Schilderung des beanstandeten Verhaltens. 3. Die Justiz ist verpflichtet, jede ordnungsgemäß eingereichte Beschwerde zu prüfen und dem Beschwerdeführer innerhalb von 7 Tagen eine Rückmeldung über den Stand der Bearbeitung zu geben. 4. Ergibt die Prüfung einen hinreichenden Verdacht auf ein Dienstvergehen, wird ein Verfahren gem. §22 StGB eingeleitet. Ergibt die Prüfung keinen Verstoß, wird die Beschwerde begründet zurückgewiesen. 5. Das Einreichen einer wissentlich falschen Dienstaufsichtsbeschwerde kann als falsche Verdächtigung gem. §26 StGB geahndet werden."},
{b:"BDG",p:"§16",t:"Hausrechtzuweisung",x:"1. Die Regierung (Gouverneur, Vize-Gouverneur) hat die Entscheidungsgewalt, je nach Situation zu bestimmen, welche Organisation das Hausrecht über eine bestimmte staatliche Einrichtung ausübt. 2. Eine Neuzuweisung des Hausrechts bedarf der Bestätigung durch: a) den Gouverneur oder den Vize-Gouverneur, b) den Leader der jeweilig neu zugeordneten Organisation. 3. Die Neuzuweisung muss in einem schriftlichen Beschluss festgehalten werden, der von allen in Abs. 2 genannten Personen unterzeichnet wird. Der Beschluss tritt erst mit Unterzeichnung aller Beteiligten in Kraft. 4. Die Regierung behält zu jeder Zeit die uneingeschränkte Entscheidungsgewalt über das Staatsgefängnis (SG). Das Hausrecht über das SG kann nicht dauerhaft an eine einzelne Organisation übertragen werden; die Regierung kann es jederzeit durch einseitigen Beschluss zurücknehmen oder neu zuweisen. 5. Unbeschadet der Zuweisung gem. Abs. 1 gelten die allgemeinen Vorschriften über Sicherheitsbereiche gem. §35 StGB fort. Das Hausrecht berechtigt die jeweilige Organisation zur Erteilung von Hausverboten und zur Regelung des Zugangs, nicht jedoch zur Einschränkung der Exekutivrechte anderer Behörden bei der Ausübung ihrer gesetzlichen Aufgaben."},
{b:"StVO",p:"§1",t:"Personen- und Sachbegriffe",x:"Behörden iSd StVO sind: 1. GOV (Bundesbehörde, Government of San Andreas), 2. FIB (Bundesbehörde, Federal Investigation Bureau), 3. LSPD (Los Santos Police Department), 4. SAHP (San Andreas Highway Patrol), 5. NG (Nationalgarde), 6. EMS (Emergency Services). Mitarbeiter der o.g. Behörden sind Amtsträger (Beamte). Staatliche Einrichtungen iSd StVO sind: 1. Alle Regierungsgebäude, 2. Alle Polizeistationen, 3. Alle Krankenhäuser, 4. Das Fort Zancudo."},
{b:"StVO",p:"§2",t:"Grundlegendes",x:"1. Die Teilnahme am Straßenverkehr erfordert ständige Vorsicht und gegenseitige Rücksicht. 2. Wer am Verkehr teilnimmt, hat sich so zu verhalten, dass kein anderer geschädigt, gefährdet, behindert oder belästigt wird. 3. Die Straßenverkehrsordnung regelt und lenkt den öffentlichen Verkehr auf dem Land-, sowie dem See- und Luftweg und ist somit gültig für alle Fahrzeugklassen (Zweirad, Dreirad, PKW, Bus, LKW, Jetski, Boot, Schiff, Hubschrauber, Flugzeug und weitere Fluggeräte). 4. Öffentlicher Verkehr findet auch auf nicht gewidmeten Straßen statt, wenn diese mit Zustimmung oder unter Duldung des Verfügungsberechtigten tatsächlich allgemein benutzt werden. 5. Jeder Fahrzeugführer, welcher am öffentlichen Verkehr teilnimmt, ist dafür verantwortlich, dass Verbandsmaterial und ein Reparaturkasten während der Fahrt mitgeführt werden muss. 6. Vorgeschriebene Sicherheitsgurte müssen während der Fahrt angelegt sein. 7. Wer Krafträder oder offene drei- oder mehrrädrige Kraftfahrzeuge fährt, sowie auf oder mit ihnen mitfährt, muss während der Fahrt einen geeigneten Schutzhelm tragen. 8. Alle Fahrzeuge, die am öffentlichen Verkehr teilnehmen, müssen vom Fahrzeughalter unverzüglich nach dem Erwerb angemeldet werden. Das ausgehändigte Kennzeichen muss sichtbar am Fahrzeug angebracht werden. 9. Ausgenommen hiervon sind Luft- sowie Wasserfahrzeuge. 10. Alle Fahrzeuge, die am öffentlichen Straßenverkehr teilnehmen, sind in der Zeit zwischen 21:00 Uhr und 06:00 Uhr dazu verpflichtet, die Scheinwerfer (Frontlichter) einzuschalten. 11. Das Fahren unter Alkohol- und/oder Drogeneinfluss ist verboten. 12. Die Nutzung von Telekommunikationsgeräten (Handy, Tablets, Funkgerät) ist während der Fahrt untersagt. Hiervon ausgenommen sind sämtliche staatliche Behörden und Taxiunternehmen innerhalb ihres Dienstes. 13. Vergehen innerhalb der StVO werden gemäß dem Straf- bzw. Bußgeldkatalog des Staates San Andreas geahndet. 14. Von den Vorschriften dieser Verordnung sind sämtliche staatliche Behörden sowie deren Dienstfahrten, soweit das zur Erfüllung ihrer täglichen Aufgaben dringend geboten ist, befreit. 15. Selbiges gilt für Mitarbeiter der Freiwilligen Feuerwehr unter Berücksichtigung des §2 1. soweit Sondersignale eingeschaltet sind."},
{b:"StVO",p:"§3",t:"Gültige Lizenzen",x:"Folgende Lizenzen für den Straßen-, Wasser- und Luftverkehr sind in dem Staat San Andreas gültig: 1. PKW-Führerschein, 2. Bootsführerschein, 3. Fluglizenz. Wer ein Kraft-, Wasser-, oder Luftfahrzeug führt, obwohl er die dazu erforderliche Lizenz nicht unmittelbar besitzt oder ihm das Führen des Fahrzeugs durch den Staat San Andreas untersagt wurde, macht sich strafbar."},
{b:"StVO",p:"§4",t:"Straßenbenutzung durch Fahrzeuge",x:"1. Fahrzeuge müssen die Fahrbahnen benutzen. Es gilt ein Rechtsfahrgebot. Die Seitenstreifen sind nicht Bestandteil der Fahrbahn. 2. Es ist möglichst weit rechts zu fahren, nicht nur bei Gegenverkehr, sondern auch beim Überholtwerden, an Kuppen, in Kurven oder bei Unübersichtlichkeit. 3. Das Fahren abseits befestigter Straßen ist nicht gestattet. Die Ausnahmen hierfür sind Wald- oder Feldwege. Es ist verboten mit Fahrzeugen, die objektiv nicht dazu geeignet sind (beinahe jeder PKW) Hügel, Berge u.ä. Off-Road zu befahren."},
{b:"StVO",p:"§5",t:"Gefährlicher Eingriff in den Straßenverkehr",x:"Wer die Sicherheit des Straßenverkehrs dadurch beeinträchtigt, dass er 1. Anlagen oder Fahrzeuge innerhalb des Straßenverkehrs vorsätzlich zerstört oder beschädigt, 2. beabsichtigt gefährdende Hindernisse bereitet, 3. ein Fahrzeug entgegengesetzt des dafür vorgesehenen Nutzens einsetzt, 4. einen ähnlichen, ebenso gefährlichen Eingriff vorsätzlich vornimmt und dadurch Leib oder Leben eines anderen Menschen gefährdet, 5. vorsätzlich fremde Sachen von bedeutendem Wert beschädigt, 6. ein Fahrzeug mit mindestens zwei defekten Reifen weiterführt, wird bestraft."},
{b:"StVO",p:"§6",t:"Geschwindigkeiten im Straßenverkehr",x:"1. Wer ein Fahrzeug führt, darf nur so schnell fahren, dass das Fahrzeug ständig beherrscht wird. Die Geschwindigkeit ist insbesondere den Straßen-, Verkehrs-, Sicht- und Wetterverhältnissen sowie den persönlichen Fähigkeiten und den Eigenschaften von Fahrzeug und Ladung anzupassen. 2. Es darf nur so schnell gefahren werden, dass innerhalb der übersehbaren Strecke gehalten werden kann. Auf Fahrbahnen, die so schmal sind, dass dort entgegenkommende Fahrzeuge gefährdet werden könnten, muss jedoch so langsam gefahren werden, dass mindestens innerhalb der Hälfte der übersehbaren Strecke gehalten werden kann. 3. An Mautstellen und festverbauten Checkpoints (+50m) gilt ein Tempolimit von 125km/h. Die zulässige Höchstgeschwindigkeit beträgt auch unter günstigsten Umständen: 1. innerhalb geschlossener Ortschaften für alle Kraftfahrzeuge 125 km/h, 2. außerhalb geschlossener Ortschaften für alle Kraftfahrzeuge 200 km/h, 3. Highways oder Autobahnen für alle Kraftfahrzeuge 300 km/h, 4. auf Highways und Autobahnen gilt eine Mindestgeschwindigkeit von 100 km/h."},
{b:"StVO",p:"§7",t:"Verkehrszeichen",x:"Folgende Verkehrszeichen und Bodenmarkierungen sind im Straßenverkehr verpflichtend zu beachten und einzuhalten: 1. Stoppschilder sowie die STOP Bodenmarkierungen (man ist verpflichtet sein Fahrzeug für mindestens drei Sekunden zu stoppen). 2. Einbahnstraßenschilder (die Einfahrt ist nur in die vorgegebene Richtung zulässig). 3. Parkverbotsschilder oder rote Bordsteinmarkierungen (das Parken ist bei solch einem Verkehrszeichen verboten). 4. Exekutivbeamte sind immer das höchste Verkehrszeichen. 5. Das Ampelsystem ist nicht zu beachten."},
{b:"StVO",p:"§8",t:"Überholen und Vorfahrt",x:"1. Es ist links zu überholen. 2. Es darf nur überholt werden, wenn eine Gefährdung anderer Verkehrsteilnehmer ausgeschlossen ist und die eigene Geschwindigkeit höher als die des zu Überholenden ist. 3. Das Überholen ist unzulässig bei unklarer Verkehrslage. 4. Wer zum Überholen ausscheren will, muss sich so verhalten, dass eine Gefährdung des nachfolgenden Verkehrs ausgeschlossen ist. Beim Überholen muss ein ausreichender Seitenabstand zu anderen Verkehrsteilnehmern, insbesondere zu Fußgängern und Radfahrern eingehalten werden. Ebenso muss man sich nach dem Überholvorgang wieder rechts einordnen. Beim Überholvorgang darf kein anderer Verkehrsteilnehmer behindert werden. 5. Grundsätzlich gilt an Kreuzungen und Einmündungen rechts vor links. Dies gilt nicht für Fahrzeuge die aus einem Feld- oder Waldweg kommen. 6. Ausgenommen hiervon sind Kreuzungen, bei denen unterschiedlich viele Fahrstreifen an einer Kreuzung aufeinander treffen. Dort hat derjenige Vorfahrt, der die meisten Fahrstreifen hat."},
